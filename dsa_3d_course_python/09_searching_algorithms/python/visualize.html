<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Searching Algorithms - 3D Visualization</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header {
            text-align: center;
            padding: 25px 0;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(255, 0, 255, 0.1));
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            margin-bottom: 25px;
        }
        h1 {
            font-size: 2.2rem;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 3s linear infinite;
        }
        @keyframes gradient-shift {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        .subtitle { color: #888; font-size: 1rem; margin-top: 8px; }
        .algorithm-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 25px;
        }
        .algo-btn {
            padding: 10px 18px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #00ffff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        .algo-btn:hover { border-color: #00ffff; box-shadow: 0 0 20px rgba(0, 255, 255, 0.3); }
        .algo-btn.active {
            background: linear-gradient(135deg, #00ffff, #0088aa);
            color: #000;
            font-weight: bold;
        }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
        }
        @media (max-width: 1200px) { .main-content { grid-template-columns: 1fr; } }
        .left-panel { display: flex; flex-direction: column; gap: 20px; }
        .visualization-area {
            background: radial-gradient(ellipse at center, #0f0f1a 0%, #050508 70%, #000 100%);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            overflow: hidden;
            position: relative;
        }
        .scene {
            width: 100%;
            height: 380px;
            perspective: 1200px;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }
        .scene:active { cursor: grabbing; }
        .stage {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform-origin: 50% 50%;
            transition: transform 0.1s ease-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .array-container {
            display: flex;
            gap: 8px;
            transform-style: preserve-3d;
            padding: 20px;
        }
        .array-cell {
            width: 55px;
            height: 70px;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%);
            border: 3px solid rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.1), 0 8px 20px rgba(0, 0, 0, 0.5);
            transform-style: preserve-3d;
        }
        .array-cell.active {
            border-color: #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
            transform: translateZ(20px) scale(1.1);
        }
        .array-cell.mid {
            border-color: #ff00ff;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.6);
            transform: translateZ(15px) scale(1.05);
        }
        .array-cell.found {
            border-color: #00ff88;
            background: linear-gradient(135deg, #0a2a1a 0%, #0f1f0f 100%);
            box-shadow: 0 0 35px rgba(0, 255, 136, 0.7);
            transform: translateZ(25px) scale(1.15);
        }
        .array-cell.eliminated {
            opacity: 0.3;
            transform: translateZ(-20px) scale(0.9);
        }
        .array-cell.in-range {
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }
        .array-cell.checked {
            border-color: #888;
            opacity: 0.6;
        }
        .cell-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
        }
        .cell-index {
            font-size: 0.7rem;
            color: #888;
            margin-top: 4px;
        }
        .target-display {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 10px 20px;
            background: linear-gradient(135deg, rgba(255, 0, 255, 0.2), rgba(255, 0, 255, 0.1));
            border: 2px solid #ff00ff;
            border-radius: 10px;
            font-size: 1rem;
            color: #ff00ff;
            font-weight: bold;
        }
        .pointers-display {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
        }
        .pointer {
            padding: 5px 12px;
            border-radius: 6px;
            font-family: monospace;
        }
        .pointer.low { background: rgba(0, 255, 255, 0.2); color: #00ffff; }
        .pointer.mid { background: rgba(255, 0, 255, 0.2); color: #ff00ff; }
        .pointer.high { background: rgba(255, 215, 0, 0.2); color: #ffd700; }
        .code-panel {
            background: linear-gradient(135deg, #0d0d15, #1a1a25);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            padding: 15px;
            max-height: 280px;
            overflow-y: auto;
        }
        .code-title {
            font-size: 0.8rem;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .code-title::before { content: "</>"; color: #ff00ff; font-weight: bold; }
        .code-block {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.75rem;
            line-height: 1.5;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
        }
        .code-line {
            padding: 2px 8px;
            border-radius: 4px;
            transition: all 0.3s ease;
            white-space: pre;
        }
        .code-line.active {
            background: rgba(0, 255, 255, 0.2);
            border-left: 3px solid #00ffff;
        }
        .code-keyword { color: #ff79c6; }
        .code-function { color: #50fa7b; }
        .code-number { color: #bd93f9; }
        .code-comment { color: #6272a4; }
        .code-variable { color: #8be9fd; }
        .info-panel {
            background: linear-gradient(135deg, #0f0f1a, #1a1a2e);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            padding: 20px;
        }
        .panel-section { margin-bottom: 20px; }
        .panel-title {
            font-size: 0.8rem;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-title::before {
            content: "";
            width: 4px;
            height: 14px;
            background: linear-gradient(180deg, #00ffff, #ff00ff);
            border-radius: 2px;
        }
        .step-description {
            font-size: 1rem;
            line-height: 1.5;
            color: #e0e0e0;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border-left: 3px solid #00ffff;
        }
        .complexity-badge {
            display: inline-block;
            padding: 5px 12px;
            background: linear-gradient(135deg, rgba(255, 0, 255, 0.2), rgba(0, 255, 255, 0.2));
            border: 1px solid rgba(255, 0, 255, 0.4);
            border-radius: 15px;
            font-size: 0.85rem;
            color: #ff00ff;
            font-weight: bold;
        }
        .search-info {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.85rem;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(0, 255, 255, 0.2);
        }
        .control-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid rgba(0, 255, 255, 0.4);
            color: #00ffff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        .control-btn:hover:not(:disabled) { background: linear-gradient(135deg, #00ffff, #0088aa); color: #000; }
        .control-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .control-btn.playing { background: linear-gradient(135deg, #ff00ff, #aa0088); border-color: #ff00ff; }
        .speed-control { display: flex; align-items: center; gap: 10px; margin-left: auto; }
        .speed-label { color: #888; font-size: 0.85rem; }
        .speed-slider {
            width: 100px;
            height: 5px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            border-radius: 3px;
        }
        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }
        .progress-bar { height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; overflow: hidden; margin-top: 12px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00ffff, #ff00ff); transition: width 0.3s ease; }
        .step-counter { text-align: center; color: #888; font-size: 0.85rem; margin-top: 8px; }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; }
        .legend-color { width: 14px; height: 14px; border-radius: 4px; border: 2px solid; }
        .result-display {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 12px 20px;
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 255, 136, 0.1));
            border: 2px solid #00ff88;
            border-radius: 10px;
            font-size: 1rem;
            color: #00ff88;
            font-weight: bold;
            display: none;
        }
        .camera-hint {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Searching Algorithms</h1>
        <p class="subtitle">Interactive 3D Visualization with Code - Drag to rotate, scroll to zoom</p>
    </header>
    <div class="container">
        <div class="algorithm-selector" id="algoSelector"></div>
        <div class="main-content">
            <div class="left-panel">
                <div class="visualization-area">
                    <div class="scene" id="scene">
                        <div class="stage" id="stage">
                            <div class="array-container" id="arrayContainer"></div>
                        </div>

                    <div class="panel-title">Complexity</div>
                    <div class="complexity-badge" id="complexityBadge">-</div>

                    <div class="panel-title">Search State</div>

            </div>
        </div>

    <script>
const codeSnippets = {
    "linear_search": `<span class="code-keyword">def</span> <span class="code-function">linear_search</span>(arr, target):
    <span class="code-keyword">for</span> i <span class="code-keyword">in</span> range(len(arr)):
        <span class="code-keyword">if</span> arr[i] == target:
            <span class="code-keyword">return</span> i  <span class="code-comment"># Found!</span>
    <span class="code-keyword">return</span> -<span class="code-number">1</span>  <span class="code-comment"># Not found</span>`,
    "binary_search": `<span class="code-keyword">def</span> <span class="code-function">binary_search</span>(arr, target):
    low, high = <span class="code-number">0</span>, len(arr) - <span class="code-number">1</span>
    
    <span class="code-keyword">while</span> low <= high:
        mid = (low + high) // <span class="code-number">2</span>
        
        <span class="code-keyword">if</span> arr[mid] == target:
            <span class="code-keyword">return</span> mid  <span class="code-comment"># Found!</span>
        <span class="code-keyword">elif</span> arr[mid] < target:
            low = mid + <span class="code-number">1</span>  <span class="code-comment"># Search right</span>
        <span class="code-keyword">else</span>:
            high = mid - <span class="code-number">1</span>  <span class="code-comment"># Search left</span>
    
    <span class="code-keyword">return</span> -<span class="code-number">1</span>  <span class="code-comment"># Not found</span>`,
    "binary_search_not_found": `<span class="code-keyword">def</span> <span class="code-function">binary_search</span>(arr, target):
    low, high = <span class="code-number">0</span>, len(arr) - <span class="code-number">1</span>
    
    <span class="code-keyword">while</span> low <= high:
        mid = (low + high) // <span class="code-number">2</span>
        
        <span class="code-keyword">if</span> arr[mid] == target:
            <span class="code-keyword">return</span> mid
        <span class="code-keyword">elif</span> arr[mid] < target:
            low = mid + <span class="code-number">1</span>
        <span class="code-keyword">else</span>:
            high = mid - <span class="code-number">1</span>
    
    <span class="code-keyword">return</span> -<span class="code-number">1</span>  <span class="code-comment"># low > high, not found</span>`,
    "first_last_occurrence": `<span class="code-keyword">def</span> <span class="code-function">find_first</span>(arr, target):
    low, high, result = <span class="code-number">0</span>, len(arr)-<span class="code-number">1</span>, -<span class="code-number">1</span>
    <span class="code-keyword">while</span> low <= high:
        mid = (low + high) // <span class="code-number">2</span>
        <span class="code-keyword">if</span> arr[mid] == target:
            result = mid  <span class="code-comment"># Save and go left</span>
            high = mid - <span class="code-number">1</span>
        <span class="code-keyword">elif</span> arr[mid] < target:
            low = mid + <span class="code-number">1</span>
        <span class="code-keyword">else</span>:
            high = mid - <span class="code-number">1</span>
    <span class="code-keyword">return</span> result`,
    "search_rotated_array": `<span class="code-keyword">def</span> <span class="code-function">search_rotated</span>(arr, target):
    low, high = <span class="code-number">0</span>, len(arr) - <span class="code-number">1</span>
    
    <span class="code-keyword">while</span> low <= high:
        mid = (low + high) // <span class="code-number">2</span>
        <span class="code-keyword">if</span> arr[mid] == target:
            <span class="code-keyword">return</span> mid
        
        <span class="code-comment"># Check which half is sorted</span>
        <span class="code-keyword">if</span> arr[low] <= arr[mid]:  <span class="code-comment"># Left sorted</span>
            <span class="code-keyword">if</span> arr[low] <= target < arr[mid]:
                high = mid - <span class="code-number">1</span>
            <span class="code-keyword">else</span>:
                low = mid + <span class="code-number">1</span>
        <span class="code-keyword">else</span>:  <span class="code-comment"># Right sorted</span>
            <span class="code-keyword">if</span> arr[mid] < target <= arr[high]:
                low = mid + <span class="code-number">1</span>
            <span class="code-keyword">else</span>:
                high = mid - <span class="code-number">1</span>`,
    "bst_search": `<span class="code-keyword">def</span> <span class="code-function">search_bst</span>(root, target):
    curr = root
    
    <span class="code-keyword">while</span> curr:
        <span class="code-keyword">if</span> target == curr.val:
            <span class="code-keyword">return</span> curr  <span class="code-comment"># Found!</span>
        <span class="code-keyword">elif</span> target < curr.val:
            curr = curr.left  <span class="code-comment"># Go left</span>
        <span class="code-keyword">else</span>:
            curr = curr.right  <span class="code-comment"># Go right</span>
    
    <span class="code-keyword">return</span> <span class="code-keyword">None</span>  <span class="code-comment"># Not found</span>`
};

let currentAlgorithm = null;
let currentStep = 0;
let isPlaying = false;
let playInterval = null;
let cameraRotX = 10;
let cameraRotY = 0;
let cameraZoom = 0;
let isDragging = false;
let lastMouseX = 0;
let lastMouseY = 0;

const scene = document.getElementById('scene');
const stage = document.getElementById('stage');
const arrayContainer = document.getElementById('arrayContainer');
const codeBlock = document.getElementById('codeBlock');
const stepDescription = document.getElementById('stepDescription');
const complexityBadge = document.getElementById('complexityBadge');
const searchInfo = document.getElementById('searchInfo');
const targetDisplay = document.getElementById('targetDisplay');
const pointersDisplay = document.getElementById('pointersDisplay');
const progressFill = document.getElementById('progressFill');
const stepCounter = document.getElementById('stepCounter');
const playBtn = document.getElementById('playBtn');
const resultDisplay = document.getElementById('resultDisplay');

function initAlgorithmSelector() {
    const selector = document.getElementById('algoSelector');
    visualData.algorithms.forEach((algo, index) => {
        const btn = document.createElement('button');
        btn.className = 'algo-btn';
        btn.textContent = algo.name;
        btn.onclick = () => selectAlgorithm(index);
        selector.appendChild(btn);
    });
}

function selectAlgorithm(index) {
    document.querySelectorAll('.algo-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
    currentAlgorithm = visualData.algorithms[index];
    currentStep = 0;
    stopPlaying();
    complexityBadge.textContent = currentAlgorithm.complexity;
    targetDisplay.textContent = 'Target: ' + currentAlgorithm.target;
    renderCode();
    renderStep();
    updateControls();
}

function renderCode() {
    const code = codeSnippets[currentAlgorithm.algorithm] || '';
    const lines = code.split('\n');
    let html = '';
    lines.forEach((line, idx) => {
        html += '<div class="code-line" data-line="' + idx + '">' + line + '</div>';
    });
    codeBlock.innerHTML = html;
}

function highlightCodeLines(stepNum) {
    const lineMap = codeLineMap[currentAlgorithm.algorithm] || {};
    const activeLines = lineMap[stepNum] || [];
    document.querySelectorAll('.code-line').forEach((el, idx) => {
        el.classList.remove('active');
        if (activeLines.includes(idx)) el.classList.add('active');
    });
}

function renderArray(step) {
    const array = currentAlgorithm.array;
    const eliminated = step.eliminated || [];
    const currentIndex = step.index;
    const mid = step.mid;
    const low = step.low;
    const high = step.high;
    const found = step.action === 'found';
    
    let html = '';
    array.forEach((val, idx) => {
        let cellClass = 'array-cell';
        if (found && idx === step.index) cellClass += ' found';
        else if (idx === mid) cellClass += ' mid';
        else if (idx === currentIndex) cellClass += ' active';
        else if (eliminated.includes(idx)) cellClass += ' eliminated';
        else if (low !== undefined && high !== undefined && idx >= low && idx <= high) cellClass += ' in-range';
        
        html += '<div class="' + cellClass + '"><span class="cell-value">' + val + '</span><span class="cell-index">[' + idx + ']</span></div>';
    });
    arrayContainer.innerHTML = html;
    
    // Update pointers display
    let pointers = '';
    if (low !== undefined) pointers += '<span class="pointer low">low=' + low + '</span>';
    if (mid !== undefined) pointers += '<span class="pointer mid">mid=' + mid + '</span>';
    if (high !== undefined) pointers += '<span class="pointer high">high=' + high + '</span>';
    pointersDisplay.innerHTML = pointers;
}

function renderStep() {
    if (!currentAlgorithm) return;
    const step = currentAlgorithm.steps[currentStep];
    stepDescription.textContent = step.description;
    highlightCodeLines(step.step);
    resultDisplay.style.display = 'none';
    
    renderArray(step);
    
    // Update search info
    let info = '';
    if (step.comparison) info += 'Comparison: ' + step.midValue + ' ' + step.comparison + ' ' + currentAlgorithm.target + '\n';
    if (step.comparisons) info += 'Total comparisons: ' + step.comparisons;
    if (step.insertPos !== undefined) info += 'Insert position: ' + step.insertPos;
    searchInfo.textContent = info || 'Searching...';
    
    if (step.action === 'found') {
        resultDisplay.style.display = 'block';
        resultDisplay.textContent = 'Found at index ' + step.index + '!';
    } else if (step.action === 'not_found') {
        resultDisplay.style.display = 'block';
        resultDisplay.style.borderColor = '#ff6b6b';
        resultDisplay.style.color = '#ff6b6b';
        resultDisplay.textContent = 'Not Found!';
    }
    
    progressFill.style.width = ((currentStep + 1) / currentAlgorithm.steps.length * 100) + '%';
    stepCounter.textContent = 'Step ' + (currentStep + 1) + ' / ' + currentAlgorithm.steps.length;
}

function updateControls() {
    document.getElementById('prevBtn').disabled = !currentAlgorithm || currentStep === 0;
    document.getElementById('nextBtn').disabled = !currentAlgorithm || currentStep >= currentAlgorithm.steps.length - 1;
    document.getElementById('playBtn').disabled = !currentAlgorithm;
}

function nextStep() {
    if (currentAlgorithm && currentStep < currentAlgorithm.steps.length - 1) { currentStep++; renderStep(); updateControls(); }
    else stopPlaying();
}

function prevStep() {
    if (currentAlgorithm && currentStep > 0) { currentStep--; renderStep(); updateControls(); }
}

function togglePlay() { if (isPlaying) stopPlaying(); else startPlaying(); }

function startPlaying() {
    isPlaying = true;
    playBtn.textContent = 'Pause';
    playBtn.classList.add('playing');
    playInterval = setInterval(() => {
        if (currentStep < currentAlgorithm.steps.length - 1) nextStep();
        else stopPlaying();
    }, 2200 - document.getElementById('speedSlider').value);
}

function stopPlaying() {
    isPlaying = false;
    playBtn.textContent = 'Play';
    playBtn.classList.remove('playing');
    if (playInterval) { clearInterval(playInterval); playInterval = null; }
}

function reset() { stopPlaying(); currentStep = 0; renderStep(); updateControls(); }

function updateCamera() {
    stage.style.transform = 'translateZ(' + cameraZoom + 'px) rotateX(' + cameraRotX + 'deg) rotateY(' + cameraRotY + 'deg)';
}

scene.addEventListener('mousedown', (e) => { isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY; });
document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    cameraRotY += (e.clientX - lastMouseX) * 0.5;
    cameraRotX -= (e.clientY - lastMouseY) * 0.3;
    cameraRotX = Math.max(-60, Math.min(60, cameraRotX));
    lastMouseX = e.clientX; lastMouseY = e.clientY;
    updateCamera();
});
document.addEventListener('mouseup', () => { isDragging = false; });
scene.addEventListener('wheel', (e) => { e.preventDefault(); cameraZoom += e.deltaY * -0.5; cameraZoom = Math.max(-300, Math.min(200, cameraZoom)); updateCamera(); });

document.getElementById('playBtn').onclick = togglePlay;
document.getElementById('prevBtn').onclick = prevStep;
document.getElementById('nextBtn').onclick = nextStep;
document.getElementById('resetBtn').onclick = reset;
document.getElementById('speedSlider').oninput = () => { if (isPlaying) { stopPlaying(); startPlaying(); } };

initAlgorithmSelector();
updateCamera();
    </script>
</body>
</html>
