        header {
            text-align: center;

            border-bottom: 1px solid rgba(0, 255, 255, 0.3);

        }
        h1 {
            font-size: 2.2rem;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff);

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 3s linear infinite;
        }
        @keyframes gradient-shift {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        .subtitle { color: #888; font-size: 1rem; margin-top: 8px; }
        .algorithm-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 25px;
        }
        .algo-btn {
            padding: 10px 18px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #00ffff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        .algo-btn:hover { border-color: #00ffff; box-shadow: 0 0 20px rgba(0, 255, 255, 0.3); }
        .algo-btn.active {
            background: linear-gradient(135deg, #00ffff, #0088aa);
            color: #000;
            font-weight: bold;
        }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
        }
        @media (max-width: 1200px) { .main-content { grid-template-columns: 1fr; } }
        .left-panel { display: flex; flex-direction: column; gap: 20px; }
        .visualization-area {
            background: radial-gradient(ellipse at center, #0f0f1a 0%, #050508 70%, #000 100%);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            overflow: hidden;
            position: relative;
        }
        .scene {
            width: 100%;
            height: 380px;
            perspective: 1200px;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }
        .scene:active { cursor: grabbing; }
        .stage {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform-origin: 50% 50%;
            transition: transform 0.1s ease-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .viz-container {
            transform-style: preserve-3d;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .stack-container {
            display: flex;
            flex-direction: column-reverse;
            gap: 5px;
            align-items: center;
            min-height: 200px;
            justify-content: flex-start;
        }
        .stack-plate {
            width: 80px;
            height: 40px;
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            border: 2px solid rgba(0, 255, 255, 0.4);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            transition: all 0.4s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .stack-plate.top {
            border-color: #00ffff;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.5);
        }
        .stack-plate.pushing {
            animation: push-down 0.5s ease;
            border-color: #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.6);
        }
        @keyframes push-down {
            0% { transform: translateY(-50px) scale(1.2); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .stack-plate.popping {
            animation: pop-up 0.5s ease;
            border-color: #ff6b6b;
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.6);
        }
        @keyframes pop-up {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(0.8); opacity: 0; }
        }
        .stack-label {
            font-size: 0.8rem;
            color: #ffd700;
            margin-top: 10px;
        }
        .queue-container {
            display: flex;
            gap: 8px;
            align-items: center;
            min-width: 300px;
            justify-content: center;
        }
        .queue-item {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            border: 2px solid rgba(0, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            transition: all 0.4s ease;
        }
        .queue-item.front {
            border-color: #ffd700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
        }
        .queue-item.rear {
            border-color: #ff00ff;
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.5);
        }
        .queue-item.enqueuing {
            animation: slide-in 0.5s ease;
            border-color: #00ff88;
        }
        @keyframes slide-in {
            0% { transform: translateX(50px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        .queue-item.dequeuing {
            animation: slide-out 0.5s ease;
            border-color: #ff6b6b;
        }
        @keyframes slide-out {
            0% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(-50px); opacity: 0; }
        }
        .queue-labels {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 0.75rem;
            color: #888;
            margin-top: 10px;
        }
        .expression-display {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }
        .expr-char {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            transition: all 0.3s ease;
        }
        .expr-char.current {
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            transform: scale(1.1);
        }
        .expr-char.matched {
            border-color: #00ff88;
            background: linear-gradient(135deg, #0a2a1a, #0f1f0f);
        }
        .code-panel {
            background: linear-gradient(135deg, #0d0d15, #1a1a25);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            padding: 15px;
            max-height: 280px;
            overflow-y: auto;
        }
        .code-title {
            font-size: 0.8rem;
            color: #00ffff;

            display: flex;
            align-items: center;
            gap: 8px;

            padding: 12px;
            overflow-x: auto;
        }
        .code-line {
            padding: 2px 8px;
            border-radius: 4px;
            transition: all 0.3s ease;
            white-space: pre;
        }
        .code-line.active {
            background: rgba(0, 255, 255, 0.2);
            border-left: 3px solid #00ffff;
        }
        .code-keyword { color: #ff79c6; }
        .code-function { color: #50fa7b; }
        .code-number { color: #bd93f9; }
        .code-comment { color: #6272a4; }
        .code-variable { color: #8be9fd; }
        .code-string { color: #f1fa8c; }
        .info-panel {
            background: linear-gradient(135deg, #0f0f1a, #1a1a2e);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            padding: 20px;
        }
        .panel-section { margin-bottom: 20px; }
        .panel-title {
            font-size: 0.8rem;
            color: #00ffff;

        }

            border-radius: 15px;
            font-size: 0.85rem;
            color: #ff00ff;
            font-weight: bold;
        }
        .state-info {

            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(0, 255, 255, 0.2);
        }
        .control-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid rgba(0, 255, 255, 0.4);
            color: #00ffff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;

        .speed-control { display: flex; align-items: center; gap: 10px; margin-left: auto; }
        .speed-label { color: #888; font-size: 0.85rem; }
        .speed-slider {
            width: 100px;
            height: 5px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            border-radius: 3px;

            -webkit-appearance: none;

            height: 16px;
            background: #fff;

        .progress-bar { height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; overflow: hidden; margin-top: 12px; }

        .step-counter { text-align: center; color: #888; font-size: 0.85rem; margin-top: 8px; }
        .legend {

        .result-display {

            padding: 12px 20px;

            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.75rem;
        }

let currentAlgorithm = null;
let currentStep = 0;
let isPlaying = false;
let playInterval = null;
let cameraRotX = 15;
let cameraRotY = 0;
let cameraZoom = 0;
let isDragging = false;
let lastMouseX = 0;
let lastMouseY = 0;

const scene = document.getElementById('scene');
const stage = document.getElementById('stage');
const vizContainer = document.getElementById('vizContainer');
const codeBlock = document.getElementById('codeBlock');
const stepDescription = document.getElementById('stepDescription');
const complexityBadge = document.getElementById('complexityBadge');
const stateInfo = document.getElementById('stateInfo');
const progressFill = document.getElementById('progressFill');
const stepCounter = document.getElementById('stepCounter');
const playBtn = document.getElementById('playBtn');
const resultDisplay = document.getElementById('resultDisplay');

function initAlgorithmSelector() {
    const selector = document.getElementById('algoSelector');
    visualData.algorithms.forEach((algo, index) => {
        const btn = document.createElement('button');
        btn.className = 'algo-btn';
        btn.textContent = algo.name;
        btn.onclick = () => selectAlgorithm(index);
        selector.appendChild(btn);
    });
}

function selectAlgorithm(index) {
    document.querySelectorAll('.algo-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
    currentAlgorithm = visualData.algorithms[index];
    currentStep = 0;
    stopPlaying();
    complexityBadge.textContent = currentAlgorithm.complexity;
    renderCode();
    renderStep();
    updateControls();
}

function renderCode() {
    const code = codeSnippets[currentAlgorithm.algorithm] || '';
    const lines = code.split('\n');
    let html = '';
    lines.forEach((line, idx) => {
        html += '<div class="code-line" data-line="' + idx + '">' + line + '</div>';
    });
    codeBlock.innerHTML = html;
}

function highlightCodeLines(stepNum) {
    const lineMap = codeLineMap[currentAlgorithm.algorithm] || {};
    const activeLines = lineMap[stepNum] || [];
    document.querySelectorAll('.code-line').forEach((el, idx) => {
        el.classList.remove('active');
        if (activeLines.includes(idx)) el.classList.add('active');
    });
}

function renderStack(step) {
    const stack = step.stack || [];
    let html = '<div class="stack-container">';
    stack.forEach((val, i) => {
        let plateClass = 'stack-plate';
        if (i === stack.length - 1) plateClass += ' top';
        if (step.pushing === val) plateClass += ' pushing';
        html += '<div class="' + plateClass + '">' + val + '</div>';
    });
    if (step.popping) {
        html += '<div class="stack-plate popping">' + step.popping + '</div>';
    }
    html += '</div>';
    html += '<div class="stack-label">TOP ^</div>';
    return html;
}

function renderQueue(step) {
    const queue = step.queue || [];
    let html = '<div class="queue-container">';
    queue.forEach((val, i) => {
        let itemClass = 'queue-item';
        if (i === 0) itemClass += ' front';
        if (i === queue.length - 1) itemClass += ' rear';
        if (step.enqueuing === val) itemClass += ' enqueuing';
        html += '<div class="' + itemClass + '">' + val + '</div>';
    });
    if (step.dequeuing) {
        html = '<div class="queue-item dequeuing">' + step.dequeuing + '</div>' + html.slice(html.indexOf('>') + 1);
    }
    html += '</div>';
    html += '<div class="queue-labels"><span style="color:#ffd700">FRONT</span><span style="color:#ff00ff">REAR</span></div>';
    return html;
}

function renderParentheses(step) {
    const expr = step.expr || '';
    let html = '<div class="expression-display">';
    for (let i = 0; i < expr.length; i++) {
        let charClass = 'expr-char';
        if (step.index === i) charClass += ' current';
        if (step.matched && i < step.index) charClass += ' matched';
        html += '<div class="' + charClass + '">' + expr[i] + '</div>';
    }
    html += '</div>';
    html += renderStack(step);
    return html;
}

function renderPostfix(step) {
    const tokens = step.tokens || [];
    let html = '<div class="expression-display">';
    tokens.forEach((t, i) => {
        let charClass = 'expr-char';
        if (step.index === i) charClass += ' current';
        if (i < step.index) charClass += ' matched';
        html += '<div class="' + charClass + '">' + t + '</div>';
    });
    html += '</div>';
    html += renderStack(step);
    return html;
}

function renderBFS(step) {
    const queue = step.queue || [];
    const visited = step.visited || [];
    let html = '<div style="margin-bottom:15px"><span style="color:#00ffff">Queue: </span>';
    html += '<div class="queue-container" style="min-width:auto">';
    queue.forEach((val, i) => {
        let itemClass = 'queue-item';
        if (i === 0) itemClass += ' front';
        if (step.current === val) itemClass += ' dequeuing';
        html += '<div class="' + itemClass + '" style="width:40px;height:40px;font-size:0.9rem">' + val + '</div>';
    });
    html += '</div></div>';
    html += '<div><span style="color:#00ff88">Visited: </span>' + (visited.join(' -> ') || 'none') + '</div>';
    return html;
}

function renderStep() {
    if (!currentAlgorithm) return;
    const step = currentAlgorithm.steps[currentStep];
    stepDescription.textContent = step.description;
    highlightCodeLines(step.step);
    resultDisplay.style.display = 'none';
    
    let html = '';
    const algo = currentAlgorithm.algorithm;
    
    if (algo === 'stack_push_pop') html = renderStack(step);
    else if (algo === 'queue_enqueue_dequeue') html = renderQueue(step);
    else if (algo === 'valid_parentheses') html = renderParentheses(step);
    else if (algo === 'postfix_evaluation') html = renderPostfix(step);
    else if (algo === 'bfs_with_queue') html = renderBFS(step);
    
    vizContainer.innerHTML = html;
    
    // Update state info
    let info = '';
    if (step.stack) info += 'Stack: [' + step.stack.join(', ') + ']\n';
    if (step.queue) info += 'Queue: [' + step.queue.join(', ') + ']\n';
    if (step.visited) info += 'Visited: [' + step.visited.join(', ') + ']\n';
    if (step.result !== undefined) info += 'Result: ' + step.result;
    if (step.op) info += 'Operation: ' + step.a + ' ' + step.op + ' ' + step.b;
    stateInfo.textContent = info || '-';
    
    if (step.action === 'complete') {
        resultDisplay.style.display = 'block';
        if (step.result === true) resultDisplay.textContent = 'VALID!';
        else if (step.result === false) resultDisplay.textContent = 'INVALID!';
        else if (step.result !== undefined) resultDisplay.textContent = 'Result: ' + step.result;
        else resultDisplay.textContent = 'Complete!';
    }
    
    progressFill.style.width = ((currentStep + 1) / currentAlgorithm.steps.length * 100) + '%';
    stepCounter.textContent = 'Step ' + (currentStep + 1) + ' / ' + currentAlgorithm.steps.length;
}

function updateControls() {
    document.getElementById('prevBtn').disabled = !currentAlgorithm || currentStep === 0;
    document.getElementById('nextBtn').disabled = !currentAlgorithm || currentStep >= currentAlgorithm.steps.length - 1;
    document.getElementById('playBtn').disabled = !currentAlgorithm;
}

function nextStep() {
    if (currentAlgorithm && currentStep < currentAlgorithm.steps.length - 1) { currentStep++; renderStep(); updateControls(); }
    else stopPlaying();
}

function prevStep() {
    if (currentAlgorithm && currentStep > 0) { currentStep--; renderStep(); updateControls(); }
}

function togglePlay() { if (isPlaying) stopPlaying(); else startPlaying(); }

function startPlaying() {
    isPlaying = true;
    playBtn.textContent = 'Pause';
    playBtn.classList.add('playing');
    playInterval = setInterval(() => {
        if (currentStep < currentAlgorithm.steps.length - 1) nextStep();
        else stopPlaying();
    }, 2200 - document.getElementById('speedSlider').value);
}

function stopPlaying() {
    isPlaying = false;
    playBtn.textContent = 'Play';
    playBtn.classList.remove('playing');
    if (playInterval) { clearInterval(playInterval); playInterval = null; }
}

function reset() { stopPlaying(); currentStep = 0; renderStep(); updateControls(); }

function updateCamera() {
    stage.style.transform = 'translateZ(' + cameraZoom + 'px) rotateX(' + cameraRotX + 'deg) rotateY(' + cameraRotY + 'deg)';
}

scene.addEventListener('mousedown', (e) => { isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY; });
document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    cameraRotY += (e.clientX - lastMouseX) * 0.5;
    cameraRotX -= (e.clientY - lastMouseY) * 0.3;
    cameraRotX = Math.max(-60, Math.min(60, cameraRotX));
    lastMouseX = e.clientX; lastMouseY = e.clientY;
    updateCamera();
});
document.addEventListener('mouseup', () => { isDragging = false; });
scene.addEventListener('wheel', (e) => { e.preventDefault(); cameraZoom += e.deltaY * -0.5; cameraZoom = Math.max(-300, Math.min(200, cameraZoom)); updateCamera(); });

document.getElementById('playBtn').onclick = togglePlay;
document.getElementById('prevBtn').onclick = prevStep;
document.getElementById('nextBtn').onclick = nextStep;
document.getElementById('resetBtn').onclick = reset;
document.getElementById('speedSlider').oninput = () => { if (isPlaying) { stopPlaying(); startPlaying(); } };

initAlgorithmSelector();
updateCamera();
    </script>
</body>
</html>
