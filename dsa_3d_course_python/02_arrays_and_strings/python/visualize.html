<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays & Strings - 3D Visualization</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header {
            text-align: center;
            padding: 25px 0;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(255, 0, 255, 0.1));
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            margin-bottom: 25px;
        }
        h1 {
            font-size: 2.2rem;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 3s linear infinite;
        }
        @keyframes gradient-shift {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        .subtitle { color: #888; font-size: 1rem; margin-top: 8px; }
        .algorithm-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 25px;
        }
        .algo-btn {
            padding: 10px 18px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #00ffff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        .algo-btn:hover { border-color: #00ffff; box-shadow: 0 0 20px rgba(0, 255, 255, 0.3); }
        .algo-btn.active {
            background: linear-gradient(135deg, #00ffff, #0088aa);
            color: #000;
            font-weight: bold;
        }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
        }
        @media (max-width: 1200px) { .main-content { grid-template-columns: 1fr; } }
        .left-panel { display: flex; flex-direction: column; gap: 20px; }
        .visualization-area {
            background: radial-gradient(ellipse at center, #0f0f1a 0%, #050508 70%, #000 100%);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            overflow: hidden;
            position: relative;
        }
        .scene {
            width: 100%;
            height: 380px;
            perspective: 1200px;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }
        .scene:active { cursor: grabbing; }
        .stage {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform-origin: 50% 50%;
            transition: transform 0.1s ease-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .viz-container {
            transform-style: preserve-3d;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .array-corridor {
            display: flex;
            gap: 6px;
            transform-style: preserve-3d;
        }
        .array-tile {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
            position: relative;
        }
        .array-tile.highlight {
            border-color: #00ffff;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.6);
            transform: translateZ(30px) scale(1.1);
        }
        .array-tile.found {
            border-color: #00ff88;
            background: linear-gradient(135deg, #0a2a1a, #0f1f0f);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.6);
            transform: translateZ(40px) scale(1.15);
        }
        .array-tile.checked {
            border-color: #ff00ff;
            background: linear-gradient(135deg, #2a1a2e, #1f0f1a);
        }
        .array-tile.left-ptr {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        .array-tile.right-ptr {
            border-color: #ff6b6b;
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
        }
        .array-tile.window {
            border-color: #00ffff;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.2), rgba(0, 255, 255, 0.1));
        }
        .array-tile.swap {
            animation: swap-pulse 0.5s ease;
        }
        @keyframes swap-pulse {
            0%, 100% { transform: translateZ(30px) scale(1.1); }
            50% { transform: translateZ(50px) scale(1.2); }
        }
        .tile-value { font-size: 1.1rem; font-weight: bold; color: #fff; }
        .tile-index { font-size: 0.65rem; color: #888; }
        .hash-map-display {
            margin-top: 15px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border: 1px solid rgba(255, 0, 255, 0.3);
        }
        .hash-title { font-size: 0.8rem; color: #ff00ff; margin-bottom: 8px; }
        .hash-entries { display: flex; flex-wrap: wrap; gap: 8px; }
        .hash-entry {
            padding: 5px 10px;
            background: rgba(255, 0, 255, 0.1);
            border: 1px solid rgba(255, 0, 255, 0.3);
            border-radius: 5px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #ff00ff;
        }
        .window-info {
            margin-top: 15px;
            padding: 12px;
            background: rgba(0, 255, 255, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            text-align: center;
        }
        .window-sum { font-size: 1.2rem; font-weight: bold; color: #00ffff; }
        .code-panel {
            background: linear-gradient(135deg, #0d0d15, #1a1a25);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            padding: 15px;
            max-height: 280px;
            overflow-y: auto;
        }
        .code-title {
            font-size: 0.8rem;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .code-title::before { content: "</>"; color: #ff00ff; font-weight: bold; }
        .code-block {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.72rem;
            line-height: 1.4;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
        }
        .code-line {
            padding: 2px 8px;
            border-radius: 4px;
            transition: all 0.3s ease;
            white-space: pre;
        }
        .code-line.active {
            background: rgba(0, 255, 255, 0.2);
            border-left: 3px solid #00ffff;
        }
        .code-keyword { color: #ff79c6; }
        .code-function { color: #50fa7b; }
        .code-number { color: #bd93f9; }
        .code-comment { color: #6272a4; }
        .code-variable { color: #8be9fd; }
        .code-string { color: #f1fa8c; }
        .info-panel {
            background: linear-gradient(135deg, #0f0f1a, #1a1a2e);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            padding: 20px;
        }
        .panel-section { margin-bottom: 20px; }
        .panel-title {
            font-size: 0.8rem;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-title::before {
            content: "";
            width: 4px;
            height: 14px;
            background: linear-gradient(180deg, #00ffff, #ff00ff);
            border-radius: 2px;
        }
        .step-description {
            font-size: 1rem;
            line-height: 1.5;
            color: #e0e0e0;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border-left: 3px solid #00ffff;
        }
        .complexity-badge {
            display: inline-block;
            padding: 5px 12px;
            background: linear-gradient(135deg, rgba(255, 0, 255, 0.2), rgba(0, 255, 255, 0.2));
            border: 1px solid rgba(255, 0, 255, 0.4);
            border-radius: 15px;
            font-size: 0.85rem;
            color: #ff00ff;
            font-weight: bold;
        }
        .state-info {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(0, 255, 255, 0.2);
        }
        .control-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid rgba(0, 255, 255, 0.4);
            color: #00ffff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        .control-btn:hover:not(:disabled) { background: linear-gradient(135deg, #00ffff, #0088aa); color: #000; }
        .control-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .control-btn.playing { background: linear-gradient(135deg, #ff00ff, #aa0088); border-color: #ff00ff; }
        .speed-control { display: flex; align-items: center; gap: 10px; margin-left: auto; }
        .speed-label { color: #888; font-size: 0.85rem; }
        .speed-slider {
            width: 100px;
            height: 5px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            border-radius: 3px;
        }
        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }
        .progress-bar { height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; overflow: hidden; margin-top: 12px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00ffff, #ff00ff); transition: width 0.3s ease; }
        .step-counter { text-align: center; color: #888; font-size: 0.85rem; margin-top: 8px; }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; }
        .legend-color { width: 14px; height: 14px; border-radius: 4px; }
        .result-display {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 12px 20px;
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 255, 136, 0.1));
            border: 2px solid #00ff88;
            border-radius: 10px;
            font-size: 1rem;
            color: #00ff88;
            font-weight: bold;
            display: none;
        }
        .camera-hint {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Arrays & Strings</h1>
        <p class="subtitle">Interactive 3D Visualization - Drag to rotate, scroll to zoom</p>
    </header>
    <div class="container">
        <div class="algorithm-selector" id="algoSelector"></div>
        <div class="main-content">
            <div class="left-panel">
                <div class="visualization-area">
                    <div class="scene" id="scene">
                        <div class="stage" id="stage">
                            <div class="viz-container" id="vizContainer"></div>
                        </div>

                        <button class="control-btn" id="resetBtn">Reset</button>
                        <div class="speed-control">
                            <span class="speed-label">Speed:</span>
                            <input type="range" class="speed-slider" id="speedSlider" min="200" max="2000" value="800">
                        </div>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

                    <div class="code-block" id="codeBlock"></div>
                </div>
            </div>
            <div class="info-panel">
                <div class="panel-section">
                    <div class="panel-title">Current Step</div>
                    <div class="step-description" id="stepDescription">Select an algorithm to begin</div>
                </div>
                <div class="panel-section">
                    <div class="panel-title">Complexity</div>
                    <div class="complexity-badge" id="complexityBadge">-</div>
                </div>
                <div class="panel-section">
                    <div class="panel-title">State</div>
                    <div class="state-info" id="stateInfo">-</div>
                </div>
                <div class="panel-section">
                    <div class="panel-title">Legend</div>
                    <div class="legend">
                        <div class="legend-item"><div class="legend-color" style="background:linear-gradient(135deg,#00ffff,#006688)"></div><span>Current</span></div>
                        <div class="legend-item"><div class="legend-color" style="background:linear-gradient(135deg,#00ff88,#006633)"></div><span>Found</span></div>
                        <div class="legend-item"><div class="legend-color" style="background:linear-gradient(135deg,#ffd700,#996600)"></div><span>Left Ptr</span></div>
                        <div class="legend-item"><div class="legend-color" style="background:linear-gradient(135deg,#ff6b6b,#993333)"></div><span>Right Ptr</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
const codeSnippets = {
    "array_access": `<span class="code-comment"># O(1) Array Access</span>
<span class="code-keyword">def</span> <span class="code-function">get_element</span>(arr, index):
    <span class="code-comment"># Direct memory access - constant time</span>
    <span class="code-keyword">return</span> arr[index]

<span class="code-comment"># Example usage:</span>
arr = [<span class="code-number">10</span>, <span class="code-number">20</span>, <span class="code-number">30</span>, <span class="code-number">40</span>, <span class="code-number">50</span>, <span class="code-number">60</span>, <span class="code-number">70</span>, <span class="code-number">80</span>]
value = get_element(arr, <span class="code-number">5</span>)  <span class="code-comment"># Returns 60</span>
<span class="code-comment"># No matter array size, access is O(1)</span>`,
    "linear_search": `<span class="code-keyword">def</span> <span class="code-function">linear_search</span>(arr, target):
    <span class="code-keyword">for</span> i <span class="code-keyword">in</span> range(len(arr)):
        <span class="code-keyword">if</span> arr[i] == target:
            <span class="code-keyword">return</span> i  <span class="code-comment"># Found!</span>
    <span class="code-keyword">return</span> -<span class="code-number">1</span>  <span class="code-comment"># Not found</span>

<span class="code-comment"># Example: Search for 9</span>
arr = [<span class="code-number">5</span>, <span class="code-number">2</span>, <span class="code-number">8</span>, <span class="code-number">1</span>, <span class="code-number">9</span>, <span class="code-number">3</span>, <span class="code-number">7</span>]
idx = linear_search(arr, <span class="code-number">9</span>)  <span class="code-comment"># Returns 4</span>
<span class="code-comment"># O(n) - must check each element</span>`,
    "two_pointer_reverse": `<span class="code-keyword">def</span> <span class="code-function">reverse_array</span>(arr):
    left = <span class="code-number">0</span>
    right = len(arr) - <span class="code-number">1</span>
    
    <span class="code-keyword">while</span> left < right:
        <span class="code-comment"># Swap elements</span>
        arr[left], arr[right] = arr[right], arr[left]
        left += <span class="code-number">1</span>
        right -= <span class="code-number">1</span>
    
    <span class="code-keyword">return</span> arr

<span class="code-comment"># O(n/2) = O(n) time, O(1) space</span>`,
    "sliding_window_sum": `<span class="code-keyword">def</span> <span class="code-function">max_window_sum</span>(arr, k):
    <span class="code-comment"># Calculate first window sum</span>
    window_sum = sum(arr[:k])
    max_sum = window_sum
    
    <span class="code-comment"># Slide the window</span>
    <span class="code-keyword">for</span> i <span class="code-keyword">in</span> range(k, len(arr)):
        <span class="code-comment"># Remove left, add right</span>
        window_sum = window_sum - arr[i-k] + arr[i]
        max_sum = max(max_sum, window_sum)
    
    <span class="code-keyword">return</span> max_sum

<span class="code-comment"># O(n) - each element visited once</span>`,
    "two_sum": `<span class="code-keyword">def</span> <span class="code-function">two_sum</span>(nums, target):
    seen = {}  <span class="code-comment"># value -> index</span>
    
    <span class="code-keyword">for</span> i, num <span class="code-keyword">in</span> enumerate(nums):
        complement = target - num
        
        <span class="code-keyword">if</span> complement <span class="code-keyword">in</span> seen:
            <span class="code-keyword">return</span> [seen[complement], i]
        
        seen[num] = i
    
    <span class="code-keyword">return</span> []

<span class="code-comment"># O(n) time, O(n) space with hash map</span>`
};

const codeLineMap = {
    "array_access": { 1: [0,1,2,3], 2: [6,7], 3: [3], 4: [8,9] },
    "linear_search": { 1: [0,1,7,8], 2: [1,2,3], 3: [1,2,3], 4: [1,2,3], 5: [1,2,3], 6: [3,4], 7: [9,10] },
    "two_pointer_reverse": { 1: [0,1,2], 2: [4,5,6], 3: [7,8], 4: [4,5,6], 5: [7,8], 6: [4,5,6], 7: [7,8], 8: [10,12] },
    "sliding_window_sum": { 1: [0,1,2,3], 2: [5,6,7,8], 3: [5,6,7,8,9], 4: [5,6,7,8,9], 5: [11,13] },
    "two_sum": { 1: [0,1], 2: [3,4,5], 3: [9], 4: [6,7], 5: [12] }
};

const visualData = {"algorithms":[{"algorithm":"array_access","name":"Array Access O(1)","complexity":"O(1)","steps":[{"step":1,"description":"Array corridor with 8 tiles. Each tile represents an index with a value stored above it.","array":[10,20,30,40,50,60,70,80],"action":"show"},{"step":2,"description":"Request access to index 5. In arrays, we can jump directly to any index!","array":[10,20,30,40,50,60,70,80],"target":5,"action":"request"},{"step":3,"description":"Instant access! No need to traverse. Memory address = base + (index * size).","array":[10,20,30,40,50,60,70,80],"highlight":[5],"action":"access"},{"step":4,"description":"Value 60 retrieved in O(1) time. Array access is constant time regardless of array size!","array":[10,20,30,40,50,60,70,80],"found":5,"value":60,"action":"complete"}]},{"algorithm":"linear_search","name":"Linear Search","complexity":"O(n)","steps":[{"step":1,"description":"Search for target 9 in unsorted array. Must check each element one by one.","array":[5,2,8,1,9,3,7],"target":9,"action":"init"},{"step":2,"description":"Check index 0: value 5. Is 5 == 9? No. Move to next.","array":[5,2,8,1,9,3,7],"checking":0,"action":"check"},{"step":3,"description":"Check index 1: value 2. Is 2 == 9? No. Move to next.","array":[5,2,8,1,9,3,7],"checking":1,"action":"check"},{"step":4,"description":"Check index 2: value 8. Is 8 == 9? No. Move to next.","array":[5,2,8,1,9,3,7],"checking":2,"action":"check"},{"step":5,"description":"Check index 3: value 1. Is 1 == 9? No. Move to next.","array":[5,2,8,1,9,3,7],"checking":3,"action":"check"},{"step":6,"description":"Check index 4: value 9. Is 9 == 9? YES! Found target!","array":[5,2,8,1,9,3,7],"found":4,"action":"found"},{"step":7,"description":"Target 9 found at index 4 after 5 comparisons. Worst case is O(n).","array":[5,2,8,1,9,3,7],"result":4,"action":"complete"}]},{"algorithm":"two_pointer_reverse","name":"Two Pointer Reverse","complexity":"O(n)","steps":[{"step":1,"description":"Reverse array in-place using two pointers. Left starts at 0, right at end.","array":["R","E","V","E","R","S","E"],"left":0,"right":6,"action":"init"},{"step":2,"description":"Swap arr[0] and arr[6]: R <-> E. Pointers move inward.","array":["R","E","V","E","R","S","E"],"left":0,"right":6,"action":"swap"},{"step":3,"description":"After swap. Move pointers: left++, right--.","array":["E","E","V","E","R","S","R"],"left":1,"right":5,"action":"move"},{"step":4,"description":"Swap arr[1] and arr[5]: E <-> S.","array":["E","E","V","E","R","S","R"],"left":1,"right":5,"action":"swap"},{"step":5,"description":"After swap. Move pointers inward.","array":["E","S","V","E","R","E","R"],"left":2,"right":4,"action":"move"},{"step":6,"description":"Swap arr[2] and arr[4]: V <-> R.","array":["E","S","V","E","R","E","R"],"left":2,"right":4,"action":"swap"},{"step":7,"description":"After swap. Move pointers.","array":["E","S","R","E","V","E","R"],"left":3,"right":3,"action":"move"},{"step":8,"description":"Pointers crossed! Reversal complete. O(n/2) swaps = O(n) time, O(1) space.","array":["E","S","R","E","V","E","R"],"action":"complete"}]},{"algorithm":"sliding_window_sum","name":"Sliding Window","complexity":"O(n)","steps":[{"step":1,"description":"Find max sum of window size k=3. Initialize first window [0:3].","array":[2,1,5,1,3,2],"window":[0,1,2],"sum":8,"action":"init"},{"step":2,"description":"Slide window: remove arr[0]=2, add arr[3]=1. New sum = 8-2+1 = 7.","array":[2,1,5,1,3,2],"window":[1,2,3],"sum":7,"leaving":0,"entering":3,"action":"slide"},{"step":3,"description":"Slide window: remove arr[1]=1, add arr[4]=3. New sum = 7-1+3 = 9. New max!","array":[2,1,5,1,3,2],"window":[2,3,4],"sum":9,"max":9,"action":"slide"},{"step":4,"description":"Slide window: remove arr[2]=5, add arr[5]=2. New sum = 9-5+2 = 6.","array":[2,1,5,1,3,2],"window":[3,4,5],"sum":6,"action":"slide"},{"step":5,"description":"Window reached end. Maximum sum was 9 (window [5,1,3]). O(n) time!","array":[2,1,5,1,3,2],"max":9,"action":"complete"}]},{"algorithm":"two_sum","name":"Two Sum (Hash Map)","complexity":"O(n)","steps":[{"step":1,"description":"Find two numbers that sum to 9. Use hash map for O(1) lookups.","array":[2,7,11,15],"target":9,"hashMap":{},"action":"init"},{"step":2,"description":"Process arr[0]=2. Complement = 9-2 = 7. Is 7 in map? No. Store 2->0.","array":[2,7,11,15],"checking":0,"complement":7,"hashMap":{"2":0},"action":"check"},{"step":3,"description":"Store mapping: value 2 maps to index 0.","array":[2,7,11,15],"hashMap":{"2":0},"action":"store"},{"step":4,"description":"Process arr[1]=7. Complement = 9-7 = 2. Is 2 in map? YES! Found pair!","array":[2,7,11,15],"checking":1,"complement":2,"found":[0,1],"action":"found"},{"step":5,"description":"Return indices [0, 1]. Values 2 + 7 = 9. O(n) time with hash map!","array":[2,7,11,15],"result":[0,1],"action":"complete"}]}]};

let currentAlgorithm = null;
let currentStep = 0;
let isPlaying = false;
let playInterval = null;
let cameraRotX = 15;
let cameraRotY = 0;
let cameraZoom = 0;
let isDragging = false;
let lastMouseX = 0;
let lastMouseY = 0;

const scene = document.getElementById('scene');
const stage = document.getElementById('stage');
const vizContainer = document.getElementById('vizContainer');
const codeBlock = document.getElementById('codeBlock');
const stepDescription = document.getElementById('stepDescription');
const complexityBadge = document.getElementById('complexityBadge');
const stateInfo = document.getElementById('stateInfo');
const progressFill = document.getElementById('progressFill');
const stepCounter = document.getElementById('stepCounter');
const playBtn = document.getElementById('playBtn');
const resultDisplay = document.getElementById('resultDisplay');

function initAlgorithmSelector() {
    const selector = document.getElementById('algoSelector');
    visualData.algorithms.forEach((algo, index) => {
        const btn = document.createElement('button');
        btn.className = 'algo-btn';
        btn.textContent = algo.name;
        btn.onclick = () => selectAlgorithm(index);
        selector.appendChild(btn);
    });
}

function selectAlgorithm(index) {
    document.querySelectorAll('.algo-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
    currentAlgorithm = visualData.algorithms[index];
    currentStep = 0;
    stopPlaying();
    complexityBadge.textContent = currentAlgorithm.complexity;
    renderCode();
    renderStep();
    updateControls();
}

function renderCode() {
    const code = codeSnippets[currentAlgorithm.algorithm] || '';
    const lines = code.split('\n');
    let html = '';
    lines.forEach((line, idx) => {
        html += '<div class="code-line" data-line="' + idx + '">' + line + '</div>';
    });
    codeBlock.innerHTML = html;
}

function highlightCodeLines(stepNum) {
    const lineMap = codeLineMap[currentAlgorithm.algorithm] || {};
    const activeLines = lineMap[stepNum] || [];
    document.querySelectorAll('.code-line').forEach((el, idx) => {
        el.classList.remove('active');
        if (activeLines.includes(idx)) el.classList.add('active');
    });
}

function renderStep() {
    if (!currentAlgorithm) return;
    const step = currentAlgorithm.steps[currentStep];
    stepDescription.textContent = step.description;
    highlightCodeLines(step.step);
    resultDisplay.style.display = 'none';
    
    const array = step.array || [];
    let html = '<div class="array-corridor">';
    
    array.forEach((val, i) => {
        let tileClass = 'array-tile';
        if (step.highlight && step.highlight.includes(i)) tileClass += ' highlight';
        if (step.found === i || (step.found && step.found.includes && step.found.includes(i))) tileClass += ' found';
        if (step.checking === i) tileClass += ' checked';
        if (step.left === i) tileClass += ' left-ptr';
        if (step.right === i) tileClass += ' right-ptr';
        if (step.window && step.window.includes(i)) tileClass += ' window';
        if (step.action === 'swap' && (step.left === i || step.right === i)) tileClass += ' swap';
        
        html += '<div class="' + tileClass + '"><div class="tile-value">' + val + '</div><div class="tile-index">[' + i + ']</div></div>';
    });
    html += '</div>';
    
    // Add hash map display for two_sum
    if (step.hashMap && Object.keys(step.hashMap).length > 0) {
        html += '<div class="hash-map-display"><div class="hash-title">Hash Map</div><div class="hash-entries">';
        for (const [key, val] of Object.entries(step.hashMap)) {
            html += '<div class="hash-entry">' + key + ' -> ' + val + '</div>';
        }
        html += '</div></div>';
    }
    
    // Add window sum display
    if (step.sum !== undefined) {
        html += '<div class="window-info"><div class="window-sum">Window Sum: ' + step.sum + '</div>';
        if (step.max) html += '<div style="color:#00ff88;margin-top:5px">Max: ' + step.max + '</div>';
        html += '</div>';
    }
    
    vizContainer.innerHTML = html;
    
    // Update state info
    let info = '';
    if (step.target !== undefined) info += 'Target: ' + step.target + '\n';
    if (step.checking !== undefined) info += 'Checking index: ' + step.checking + '\n';
    if (step.complement !== undefined) info += 'Complement: ' + step.complement + '\n';
    if (step.left !== undefined) info += 'Left ptr: ' + step.left + '\n';
    if (step.right !== undefined) info += 'Right ptr: ' + step.right + '\n';
    if (step.value !== undefined) info += 'Value: ' + step.value;
    if (step.result !== undefined) info += 'Result: ' + JSON.stringify(step.result);
    stateInfo.textContent = info || '-';
    
    if (step.action === 'complete' || step.action === 'found') {
        resultDisplay.style.display = 'block';
        if (step.value !== undefined) resultDisplay.textContent = 'Value: ' + step.value;
        else if (step.result !== undefined) resultDisplay.textContent = 'Result: ' + JSON.stringify(step.result);
        else if (step.max !== undefined) resultDisplay.textContent = 'Max Sum: ' + step.max;
        else resultDisplay.textContent = 'Complete!';
    }
    
    progressFill.style.width = ((currentStep + 1) / currentAlgorithm.steps.length * 100) + '%';
    stepCounter.textContent = 'Step ' + (currentStep + 1) + ' / ' + currentAlgorithm.steps.length;
}

function updateControls() {
    document.getElementById('prevBtn').disabled = !currentAlgorithm || currentStep === 0;
    document.getElementById('nextBtn').disabled = !currentAlgorithm || currentStep >= currentAlgorithm.steps.length - 1;
    document.getElementById('playBtn').disabled = !currentAlgorithm;
}

function nextStep() {
    if (currentAlgorithm && currentStep < currentAlgorithm.steps.length - 1) { currentStep++; renderStep(); updateControls(); }
    else stopPlaying();
}

function prevStep() {
    if (currentAlgorithm && currentStep > 0) { currentStep--; renderStep(); updateControls(); }
}

function togglePlay() { if (isPlaying) stopPlaying(); else startPlaying(); }

function startPlaying() {
    isPlaying = true;
    playBtn.textContent = 'Pause';
    playBtn.classList.add('playing');
    playInterval = setInterval(() => {
        if (currentStep < currentAlgorithm.steps.length - 1) nextStep();
        else stopPlaying();
    }, 2200 - document.getElementById('speedSlider').value);
}

function stopPlaying() {
    isPlaying = false;
    playBtn.textContent = 'Play';
    playBtn.classList.remove('playing');
    if (playInterval) { clearInterval(playInterval); playInterval = null; }
}

function reset() { stopPlaying(); currentStep = 0; renderStep(); updateControls(); }

function updateCamera() {
    stage.style.transform = 'translateZ(' + cameraZoom + 'px) rotateX(' + cameraRotX + 'deg) rotateY(' + cameraRotY + 'deg)';
}

scene.addEventListener('mousedown', (e) => { isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY; });
document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    cameraRotY += (e.clientX - lastMouseX) * 0.5;
    cameraRotX -= (e.clientY - lastMouseY) * 0.3;
    cameraRotX = Math.max(-60, Math.min(60, cameraRotX));
    lastMouseX = e.clientX; lastMouseY = e.clientY;
    updateCamera();
});
document.addEventListener('mouseup', () => { isDragging = false; });
scene.addEventListener('wheel', (e) => { e.preventDefault(); cameraZoom += e.deltaY * -0.5; cameraZoom = Math.max(-300, Math.min(200, cameraZoom)); updateCamera(); });

document.getElementById('playBtn').onclick = togglePlay;
document.getElementById('prevBtn').onclick = prevStep;
document.getElementById('nextBtn').onclick = nextStep;
document.getElementById('resetBtn').onclick = reset;
document.getElementById('speedSlider').oninput = () => { if (isPlaying) { stopPlaying(); startPlaying(); } };

initAlgorithmSelector();
updateCamera();
    </script>
</body>
</html>
