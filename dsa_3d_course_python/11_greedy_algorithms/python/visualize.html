<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greedy Algorithms - 3D Visualization</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header {
            text-align: center;
            padding: 25px 0;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(255, 0, 255, 0.1));
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            margin-bottom: 25px;
        }
        h1 {
            font-size: 2.2rem;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 3s linear infinite;
        }
        @keyframes gradient-shift {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        .subtitle { color: #888; font-size: 1rem; margin-top: 8px; }
        .algorithm-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 25px;
        }
        .algo-btn {
            padding: 10px 18px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #00ffff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        .algo-btn:hover { border-color: #00ffff; box-shadow: 0 0 20px rgba(0, 255, 255, 0.3); }
        .algo-btn.active {
            background: linear-gradient(135deg, #00ffff, #0088aa);
            color: #000;
            font-weight: bold;
        }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
        }
        @media (max-width: 1200px) { .main-content { grid-template-columns: 1fr; } }
        .left-panel { display: flex; flex-direction: column; gap: 20px; }
        .visualization-area {
            background: radial-gradient(ellipse at center, #0f0f1a 0%, #050508 70%, #000 100%);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            overflow: hidden;
            position: relative;
        }
        .scene {
            width: 100%;
            height: 380px;
            perspective: 1200px;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }
        .scene:active { cursor: grabbing; }
        .stage {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform-origin: 50% 50%;
            transition: transform 0.1s ease-out;
            position: relative;
        }
        .greedy-container {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            padding: 20px;
        }
        .activity-bar {
            position: absolute;
            height: 30px;
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            border: 2px solid rgba(0, 255, 255, 0.4);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: #fff;
            transition: all 0.4s ease;
        }
        .activity-bar.selected {
            background: linear-gradient(135deg, #00ff88, #00aa55);
            border-color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }
        .activity-bar.rejected {
            opacity: 0.3;
            background: linear-gradient(135deg, #333, #222);
        }
        .activity-bar.checking {
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }
        .coin {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.4s ease;
            position: absolute;
        }
        .coin.quarter { background: linear-gradient(135deg, #ffd700, #cc9900); color: #000; }
        .coin.dime { background: linear-gradient(135deg, #c0c0c0, #888); color: #000; }
        .coin.nickel { background: linear-gradient(135deg, #cd7f32, #8b4513); color: #fff; }
        .coin.penny { background: linear-gradient(135deg, #b87333, #8b4513); color: #fff; }
        .coin.selected {
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.7);
            transform: scale(1.1);
        }
        .item-box {
            position: absolute;
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            border: 2px solid rgba(0, 255, 255, 0.4);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            transition: all 0.4s ease;
        }
        .item-box.taken {
            background: linear-gradient(135deg, #00ff88, #00aa55);
            border-color: #00ff88;
        }
        .item-box.partial {
            background: linear-gradient(135deg, #ffd700, #cc9900);
            border-color: #ffd700;
        }
        .timeline {
            position: absolute;
            bottom: 50px;
            left: 50px;
            right: 50px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
        .timeline-marker {
            position: absolute;
            bottom: -8px;
            width: 2px;
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
        }
        .timeline-label {
            position: absolute;
            bottom: -30px;
            font-size: 0.7rem;
            color: #888;
            transform: translateX(-50%);
        }
        .code-panel {
            background: linear-gradient(135deg, #0d0d15, #1a1a25);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            padding: 15px;
            max-height: 280px;
            overflow-y: auto;
        }
        .code-title {
            font-size: 0.8rem;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .code-title::before { content: "</>"; color: #ff00ff; font-weight: bold; }
        .code-block {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.72rem;
            line-height: 1.4;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
        }
        .code-line {
            padding: 2px 8px;
            border-radius: 4px;
            transition: all 0.3s ease;
            white-space: pre;
        }
        .code-line.active {
            background: rgba(0, 255, 255, 0.2);
            border-left: 3px solid #00ffff;
        }
        .code-keyword { color: #ff79c6; }
        .code-function { color: #50fa7b; }
        .code-number { color: #bd93f9; }
        .code-comment { color: #6272a4; }
        .code-variable { color: #8be9fd; }
        .info-panel {
            background: linear-gradient(135deg, #0f0f1a, #1a1a2e);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            padding: 20px;
        }
        .panel-section { margin-bottom: 20px; }
        .panel-title {
            font-size: 0.8rem;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-title::before {
            content: "";
            width: 4px;
            height: 14px;
            background: linear-gradient(180deg, #00ffff, #ff00ff);
            border-radius: 2px;
        }
        .step-description {
            font-size: 1rem;
            line-height: 1.5;
            color: #e0e0e0;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border-left: 3px solid #00ffff;
        }
        .complexity-badge {
            display: inline-block;
            padding: 5px 12px;
            background: linear-gradient(135deg, rgba(255, 0, 255, 0.2), rgba(0, 255, 255, 0.2));
            border: 1px solid rgba(255, 0, 255, 0.4);
            border-radius: 15px;
            font-size: 0.85rem;
            color: #ff00ff;
            font-weight: bold;
        }
        .state-info {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.85rem;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(0, 255, 255, 0.2);
        }
        .control-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid rgba(0, 255, 255, 0.4);
            color: #00ffff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        .control-btn:hover:not(:disabled) { background: linear-gradient(135deg, #00ffff, #0088aa); color: #000; }
        .control-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .control-btn.playing { background: linear-gradient(135deg, #ff00ff, #aa0088); border-color: #ff00ff; }
        .speed-control { display: flex; align-items: center; gap: 10px; margin-left: auto; }
        .speed-label { color: #888; font-size: 0.85rem; }
        .speed-slider {
            width: 100px;
            height: 5px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            border-radius: 3px;
        }
        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }
        .progress-bar { height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; overflow: hidden; margin-top: 12px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00ffff, #ff00ff); transition: width 0.3s ease; }
        .step-counter { text-align: center; color: #888; font-size: 0.85rem; margin-top: 8px; }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; }
        .legend-color { width: 14px; height: 14px; border-radius: 4px; }
        .result-display {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 12px 20px;
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 255, 136, 0.1));
            border: 2px solid #00ff88;
            border-radius: 10px;
            font-size: 1rem;
            color: #00ff88;
            font-weight: bold;
            display: none;
        }
        .camera-hint {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.75rem;
        }
    </style>

<body>
    <header>
        <h1>Greedy Algorithms</h1>
        <p class="subtitle">Interactive 3D Visualization with Code - Drag to rotate, scroll to zoom</p>
    </header>
    <div class="container">
        <div class="algorithm-selector" id="algoSelector"></div>
        <div class="main-content">

    <script>
const codeSnippets = {
    "activity_selection": `<span class="code-keyword">def</span> <span class="code-function">activity_selection</span>(activities):
    <span class="code-comment"># Sort by end time (greedy choice)</span>
    activities.sort(key=<span class="code-keyword">lambda</span> x: x[<span class="code-number">1</span>])
    selected = [activities[<span class="code-number">0</span>]]
    last_end = activities[<span class="code-number">0</span>][<span class="code-number">1</span>]
    
    <span class="code-keyword">for</span> start, end <span class="code-keyword">in</span> activities[<span class="code-number">1</span>:]:
        <span class="code-keyword">if</span> start >= last_end:
            selected.append((start, end))
            last_end = end
    
    <span class="code-keyword">return</span> selected`,
    "coin_change_greedy": `<span class="code-keyword">def</span> <span class="code-function">coin_change</span>(amount, coins):
    coins.sort(reverse=<span class="code-keyword">True</span>)  <span class="code-comment"># Largest first</span>
    result = []
    
    <span class="code-keyword">for</span> coin <span class="code-keyword">in</span> coins:
        <span class="code-keyword">while</span> amount >= coin:
            result.append(coin)
            amount -= coin
    
    <span class="code-keyword">return</span> result`,
    "fractional_knapsack": `<span class="code-keyword">def</span> <span class="code-function">fractional_knapsack</span>(capacity, items):
    <span class="code-comment"># Sort by value/weight ratio</span>
    items.sort(key=<span class="code-keyword">lambda</span> x: x[<span class="code-number">0</span>]/x[<span class="code-number">1</span>], reverse=<span class="code-keyword">True</span>)
    total_value = <span class="code-number">0</span>
    
    <span class="code-keyword">for</span> value, weight <span class="code-keyword">in</span> items:
        <span class="code-keyword">if</span> capacity >= weight:
            total_value += value
            capacity -= weight
        <span class="code-keyword">else</span>:
            total_value += value * (capacity / weight)
            <span class="code-keyword">break</span>
    
    <span class="code-keyword">return</span> total_value`,
    "jump_game": `<span class="code-keyword">def</span> <span class="code-function">can_jump</span>(nums):
    farthest = <span class="code-number">0</span>
    
    <span class="code-keyword">for</span> i, jump <span class="code-keyword">in</span> enumerate(nums):
        <span class="code-keyword">if</span> i > farthest:
            <span class="code-keyword">return</span> <span class="code-keyword">False</span>
        farthest = max(farthest, i + jump)
        <span class="code-keyword">if</span> farthest >= len(nums) - <span class="code-number">1</span>:
            <span class="code-keyword">return</span> <span class="code-keyword">True</span>
    
    <span class="code-keyword">return</span> <span class="code-keyword">True</span>`,
    "gas_station": `<span class="code-keyword">def</span> <span class="code-function">can_complete_circuit</span>(gas, cost):
    <span class="code-keyword">if</span> sum(gas) < sum(cost):
        <span class="code-keyword">return</span> -<span class="code-number">1</span>
    
    start = tank = <span class="code-number">0</span>
    <span class="code-keyword">for</span> i <span class="code-keyword">in</span> range(len(gas)):
        tank += gas[i] - cost[i]
        <span class="code-keyword">if</span> tank < <span class="code-number">0</span>:
            start = i + <span class="code-number">1</span>  <span class="code-comment"># Reset start</span>
            tank = <span class="code-number">0</span>
    
    <span class="code-keyword">return</span> start`,
    "huffman_encoding": `<span class="code-keyword">import</span> heapq

<span class="code-keyword">def</span> <span class="code-function">huffman</span>(freq):
    heap = [[f, [c, ""]] <span class="code-keyword">for</span> c, f <span class="code-keyword">in</span> freq.items()]
    heapq.heapify(heap)
    
    <span class="code-keyword">while</span> len(heap) > <span class="code-number">1</span>:
        lo = heapq.heappop(heap)
        hi = heapq.heappop(heap)
        <span class="code-keyword">for</span> pair <span class="code-keyword">in</span> lo[<span class="code-number">1</span>:]: pair[<span class="code-number">1</span>] = '<span class="code-number">0</span>' + pair[<span class="code-number">1</span>]
        <span class="code-keyword">for</span> pair <span class="code-keyword">in</span> hi[<span class="code-number">1</span>:]: pair[<span class="code-number">1</span>] = '<span class="code-number">1</span>' + pair[<span class="code-number">1</span>]
        heapq.heappush(heap, [lo[<span class="code-number">0</span>]+hi[<span class="code-number">0</span>]] + lo[<span class="code-number">1</span>:] + hi[<span class="code-number">1</span>:])
    
    <span class="code-keyword">return</span> heap[<span class="code-number">0</span>][<span class="code-number">1</span>:]`
};

let currentAlgorithm = null;
let currentStep = 0;
let isPlaying = false;
let playInterval = null;
let cameraRotX = 15;
let cameraRotY = 0;
let cameraZoom = 0;
let isDragging = false;
let lastMouseX = 0;
let lastMouseY = 0;

const scene = document.getElementById('scene');
const stage = document.getElementById('stage');
const greedyContainer = document.getElementById('greedyContainer');
const codeBlock = document.getElementById('codeBlock');
const stepDescription = document.getElementById('stepDescription');
const complexityBadge = document.getElementById('complexityBadge');
const stateInfo = document.getElementById('stateInfo');
const progressFill = document.getElementById('progressFill');
const stepCounter = document.getElementById('stepCounter');
const playBtn = document.getElementById('playBtn');
const resultDisplay = document.getElementById('resultDisplay');

function initAlgorithmSelector() {
    const selector = document.getElementById('algoSelector');
    visualData.algorithms.forEach((algo, index) => {
        const btn = document.createElement('button');
        btn.className = 'algo-btn';
        btn.textContent = algo.name;
        btn.onclick = () => selectAlgorithm(index);
        selector.appendChild(btn);
    });
}

function selectAlgorithm(index) {
    document.querySelectorAll('.algo-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
    currentAlgorithm = visualData.algorithms[index];
    currentStep = 0;
    stopPlaying();
    complexityBadge.textContent = currentAlgorithm.complexity;
    renderCode();
    renderStep();
    updateControls();
}

function renderCode() {
    const code = codeSnippets[currentAlgorithm.algorithm] || '';
    const lines = code.split('\n');
    let html = '';
    lines.forEach((line, idx) => {
        html += '<div class="code-line" data-line="' + idx + '">' + line + '</div>';
    });
    codeBlock.innerHTML = html;
}

function highlightCodeLines(stepNum) {
    const lineMap = codeLineMap[currentAlgorithm.algorithm] || {};
    const activeLines = lineMap[stepNum] || [];
    document.querySelectorAll('.code-line').forEach((el, idx) => {
        el.classList.remove('active');
        if (activeLines.includes(idx)) el.classList.add('active');
    });
}

function renderActivitySelection(step) {
    const activities = currentAlgorithm.steps[0].activities;
    const selected = step.selected || [];
    const checking = step.activity;
    const rejected = [];
    
    // Collect rejected activities
    for (let i = 1; i <= currentStep; i++) {
        const s = currentAlgorithm.steps[i];
        if (s.action === 'reject') rejected.push(s.activity);
    }
    
    let html = '<div class="timeline"></div>';
    
    activities.forEach((act, idx) => {
        const left = act.start * 50 + 50;
        const width = (act.end - act.start) * 50;
        const top = 80 + idx * 40;
        
        let barClass = 'activity-bar';
        if (selected.includes(act.name)) barClass += ' selected';
        else if (rejected.includes(act.name)) barClass += ' rejected';
        else if (act.name === checking) barClass += ' checking';
        
        html += '<div class="' + barClass + '" style="left:' + left + 'px;top:' + top + 'px;width:' + width + 'px">' + act.name + ' [' + act.start + '-' + act.end + ']</div>';
    });
    
    // Timeline markers
    for (let i = 0; i <= 10; i++) {
        html += '<div class="timeline-marker" style="left:' + (50 + i * 50) + 'px;bottom:46px"></div>';
        html += '<div class="timeline-label" style="left:' + (50 + i * 50) + 'px">' + i + '</div>';
    }
    
    greedyContainer.innerHTML = html;
}

function renderCoinChange(step) {
    const result = step.result || [];
    const remaining = step.remaining !== undefined ? step.remaining : currentAlgorithm.steps[0].amount;
    
    let html = '<div style="position:absolute;top:20px;left:20px;font-size:1.2rem;color:#00ffff">Remaining: ' + remaining + ' cents</div>';
    
    // Coin pile
    result.forEach((coin, idx) => {
        const x = 100 + (idx % 5) * 60;
        const y = 150 + Math.floor(idx / 5) * 60;
        let coinClass = 'coin selected ';
        if (coin === 25) coinClass += 'quarter';
        else if (coin === 10) coinClass += 'dime';
        else if (coin === 5) coinClass += 'nickel';
        else coinClass += 'penny';
        
        html += '<div class="' + coinClass + '" style="left:' + x + 'px;top:' + y + 'px">' + coin + '</div>';
    });
    
    greedyContainer.innerHTML = html;
}

function renderKnapsack(step) {
    const items = currentAlgorithm.steps[0].items;
    const capacity = step.capacity !== undefined ? step.capacity : 50;
    const total = step.total || 0;
    
    let html = '<div style="position:absolute;top:20px;left:20px;color:#00ffff">Capacity: ' + capacity + ' | Value: ' + total + '</div>';
    
    items.forEach((item, idx) => {
        const x = 100 + idx * 150;
        let boxClass = 'item-box';
        if (step.item !== undefined && idx < step.item) boxClass += ' taken';
        else if (step.item === idx && !step.full) boxClass += ' partial';
        else if (step.item === idx) boxClass += ' taken';
        
        html += '<div class="' + boxClass + '" style="left:' + x + 'px;top:120px;width:120px">';
        html += '<div>Item ' + idx + '</div>';
        html += '<div>V:' + item.value + ' W:' + item.weight + '</div>';
        html += '<div>Ratio: ' + item.ratio + '</div>';
        html += '</div>';
    });
    
    greedyContainer.innerHTML = html;
}

function renderJumpGame(step) {
    const array = currentAlgorithm.steps[0].array;
    const farthest = step.farthest || 0;
    const pos = step.pos !== undefined ? step.pos : -1;
    
    let html = '';
    array.forEach((val, idx) => {
        const x = 80 + idx * 80;
        let style = 'position:absolute;left:' + x + 'px;top:150px;width:60px;height:60px;background:linear-gradient(135deg,#1a1a2e,#0f0f1a);border:2px solid rgba(0,255,255,0.4);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all 0.3s;';
        
        if (idx === pos) style += 'border-color:#ffd700;box-shadow:0 0 20px rgba(255,215,0,0.5);';
        else if (idx <= farthest) style += 'border-color:#00ff88;background:linear-gradient(135deg,#0a2a1a,#0f1f0f);';
        
        html += '<div style="' + style + '"><span style="font-size:1.2rem;font-weight:bold">' + val + '</span><span style="font-size:0.7rem;color:#888">[' + idx + ']</span></div>';
    });
    
    html += '<div style="position:absolute;top:100px;left:80px;color:#00ffff">Farthest reachable: ' + farthest + '</div>';
    
    greedyContainer.innerHTML = html;
}

function renderGasStation(step) {
    const gas = currentAlgorithm.steps[0].gas;
    const cost = currentAlgorithm.steps[0].cost;
    const station = step.station !== undefined ? step.station : -1;
    const newStart = step.newStart !== undefined ? step.newStart : 0;
    const tank = step.tank !== undefined ? step.tank : 0;
    
    let html = '<div style="position:absolute;top:20px;left:20px;color:#00ffff">Tank: ' + tank + ' | Start: ' + newStart + '</div>';
    
    gas.forEach((g, idx) => {
        const angle = (idx / gas.length) * 2 * Math.PI - Math.PI / 2;
        const x = 250 + Math.cos(angle) * 100;
        const y = 180 + Math.sin(angle) * 100;
        
        let style = 'position:absolute;left:' + x + 'px;top:' + y + 'px;width:70px;height:70px;background:linear-gradient(135deg,#1a1a2e,#0f0f1a);border:2px solid rgba(0,255,255,0.4);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all 0.3s;transform:translate(-50%,-50%);';
        
        if (idx === station) style += 'border-color:#ffd700;box-shadow:0 0 20px rgba(255,215,0,0.5);';
        else if (idx >= newStart && step.action === 'complete') style += 'border-color:#00ff88;';
        
        html += '<div style="' + style + '"><span style="font-size:0.8rem">G:' + g + '</span><span style="font-size:0.8rem">C:' + cost[idx] + '</span></div>';
    });
    
    greedyContainer.innerHTML = html;
}

function renderStep() {
    if (!currentAlgorithm) return;
    const step = currentAlgorithm.steps[currentStep];
    stepDescription.textContent = step.description;
    highlightCodeLines(step.step);
    resultDisplay.style.display = 'none';
    
    // Render based on algorithm type
    if (currentAlgorithm.algorithm === 'activity_selection') renderActivitySelection(step);
    else if (currentAlgorithm.algorithm === 'coin_change_greedy') renderCoinChange(step);
    else if (currentAlgorithm.algorithm === 'fractional_knapsack') renderKnapsack(step);
    else if (currentAlgorithm.algorithm === 'jump_game') renderJumpGame(step);
    else if (currentAlgorithm.algorithm === 'gas_station') renderGasStation(step);
    
    // Update state info
    let info = '';
    if (step.selected) info += 'Selected: [' + step.selected.join(', ') + ']\n';
    if (step.result) info += 'Coins: [' + step.result.join(', ') + ']\n';
    if (step.remaining !== undefined) info += 'Remaining: ' + step.remaining;
    if (step.total !== undefined) info += 'Total value: ' + step.total;
    if (step.farthest !== undefined) info += 'Farthest: ' + step.farthest;
    if (step.tank !== undefined) info += 'Tank: ' + step.tank;
    stateInfo.textContent = info || '-';
    
    if (step.action === 'complete') {
        resultDisplay.style.display = 'block';
        if (step.count) resultDisplay.textContent = 'Result: ' + step.count + ' items';
        else if (step.totalValue) resultDisplay.textContent = 'Max Value: ' + step.totalValue;
        else if (step.success) resultDisplay.textContent = 'Can reach end!';
        else if (step.startStation !== undefined) resultDisplay.textContent = 'Start: Station ' + step.startStation;
        else resultDisplay.textContent = 'Complete!';
    }
    
    progressFill.style.width = ((currentStep + 1) / currentAlgorithm.steps.length * 100) + '%';
    stepCounter.textContent = 'Step ' + (currentStep + 1) + ' / ' + currentAlgorithm.steps.length;
}

function updateControls() {
    document.getElementById('prevBtn').disabled = !currentAlgorithm || currentStep === 0;
    document.getElementById('nextBtn').disabled = !currentAlgorithm || currentStep >= currentAlgorithm.steps.length - 1;
    document.getElementById('playBtn').disabled = !currentAlgorithm;
}

function nextStep() {
    if (currentAlgorithm && currentStep < currentAlgorithm.steps.length - 1) { currentStep++; renderStep(); updateControls(); }
    else stopPlaying();
}

function prevStep() {
    if (currentAlgorithm && currentStep > 0) { currentStep--; renderStep(); updateControls(); }
}

function togglePlay() { if (isPlaying) stopPlaying(); else startPlaying(); }

function startPlaying() {
    isPlaying = true;
    playBtn.textContent = 'Pause';
    playBtn.classList.add('playing');
    playInterval = setInterval(() => {
        if (currentStep < currentAlgorithm.steps.length - 1) nextStep();
        else stopPlaying();
    }, 2200 - document.getElementById('speedSlider').value);
}

function stopPlaying() {
    isPlaying = false;
    playBtn.textContent = 'Play';
    playBtn.classList.remove('playing');
    if (playInterval) { clearInterval(playInterval); playInterval = null; }
}

function reset() { stopPlaying(); currentStep = 0; renderStep(); updateControls(); }

function updateCamera() {
    stage.style.transform = 'translateZ(' + cameraZoom + 'px) rotateX(' + cameraRotX + 'deg) rotateY(' + cameraRotY + 'deg)';
}

scene.addEventListener('mousedown', (e) => { isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY; });
document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    cameraRotY += (e.clientX - lastMouseX) * 0.5;
    cameraRotX -= (e.clientY - lastMouseY) * 0.3;
    cameraRotX = Math.max(-60, Math.min(60, cameraRotX));
    lastMouseX = e.clientX; lastMouseY = e.clientY;
    updateCamera();
});
document.addEventListener('mouseup', () => { isDragging = false; });
scene.addEventListener('wheel', (e) => { e.preventDefault(); cameraZoom += e.deltaY * -0.5; cameraZoom = Math.max(-300, Math.min(200, cameraZoom)); updateCamera(); });

document.getElementById('playBtn').onclick = togglePlay;
document.getElementById('prevBtn').onclick = prevStep;
document.getElementById('nextBtn').onclick = nextStep;
document.getElementById('resetBtn').onclick = reset;
document.getElementById('speedSlider').oninput = () => { if (isPlaying) { stopPlaying(); startPlaying(); } };

initAlgorithmSelector();
updateCamera();
    </script>
</body>
</html>
