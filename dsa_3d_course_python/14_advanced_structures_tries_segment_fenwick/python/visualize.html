<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Structures - 3D Visualization</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header {
            text-align: center;
            padding: 25px 0;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(255, 0, 255, 0.1));
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            margin-bottom: 25px;
        }
        h1 {
            font-size: 2.2rem;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 3s linear infinite;
        }
        @keyframes gradient-shift {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        .subtitle { color: #888; font-size: 1rem; margin-top: 8px; }
        .algorithm-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 25px;
        }
        .algo-btn {
            padding: 10px 18px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #00ffff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        .algo-btn:hover { border-color: #00ffff; box-shadow: 0 0 20px rgba(0, 255, 255, 0.3); }
        .algo-btn.active {
            background: linear-gradient(135deg, #00ffff, #0088aa);
            color: #000;
            font-weight: bold;
        }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
        }
        @media (max-width: 1200px) { .main-content { grid-template-columns: 1fr; } }
        .left-panel { display: flex; flex-direction: column; gap: 20px; }
        .visualization-area {
            background: radial-gradient(ellipse at center, #0f0f1a 0%, #050508 70%, #000 100%);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            overflow: hidden;
            position: relative;
        }
        .scene {
            width: 100%;
            height: 380px;
            perspective: 1200px;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }
        .scene:active { cursor: grabbing; }
        .stage {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform-origin: 50% 50%;
            transition: transform 0.1s ease-out;
            position: relative;
        }
        .structure-container {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .trie-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }
        .trie-level {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .trie-node {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            border: 2px solid rgba(0, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: #00ffff;
            transition: all 0.3s ease;
            position: relative;
        }
        .trie-node.root {
            background: linear-gradient(135deg, #ff00ff, #aa0088);
            color: #fff;
        }
        .trie-node.current {
            background: linear-gradient(135deg, #ffd700, #cc9900);
            color: #000;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
            transform: scale(1.15);
        }
        .trie-node.path {
            background: linear-gradient(135deg, #00ffff, #0088aa);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }
        .trie-node.word-end::after {
            content: "";
            position: absolute;
            width: 55px;
            height: 55px;
            border: 3px solid #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }
        .segment-tree {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .tree-level {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .tree-node {
            min-width: 50px;
            height: 40px;
            padding: 0 10px;
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        .tree-node .value { color: #00ffff; font-weight: bold; }
        .tree-node .range { color: #888; font-size: 0.65rem; }
        .tree-node.current {
            background: linear-gradient(135deg, #ffd700, #cc9900);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        .tree-node.current .value { color: #000; }
        .tree-node.included {
            background: linear-gradient(135deg, #00ff88, #00aa55);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }
        .tree-node.included .value { color: #000; }
        .tree-node.partial {
            border-color: #ff00ff;
            border-width: 2px;
        }
        .array-display {
            display: flex;
            gap: 5px;
            margin-top: 15px;
        }
        .array-cell {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }
        .array-cell .idx { color: #666; font-size: 0.65rem; }
        .array-cell .val { color: #00ffff; font-weight: bold; }
        .array-cell.in-range {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.3), rgba(0, 255, 255, 0.1));
            border-color: #00ffff;
        }
        .array-cell.updated {
            background: linear-gradient(135deg, #ffd700, #cc9900);
        }
        .array-cell.updated .val { color: #000; }
        .fenwick-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .bit-array {
            display: flex;
            gap: 5px;
        }
        .bit-cell {
            width: 50px;
            height: 60px;
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            transition: all 0.3s ease;
        }
        .bit-cell .idx { color: #666; }
        .bit-cell .binary { color: #ff00ff; font-family: monospace; }
        .bit-cell .val { color: #00ffff; font-weight: bold; }
        .bit-cell.active {
            background: linear-gradient(135deg, #ffd700, #cc9900);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        .bit-cell.active .val { color: #000; }
        .code-panel {
            background: linear-gradient(135deg, #0d0d15, #1a1a25);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            padding: 15px;
            max-height: 280px;
            overflow-y: auto;
        }
        .code-title {
            font-size: 0.8rem;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .code-title::before { content: "</>"; color: #ff00ff; font-weight: bold; }
        .code-block {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.72rem;
            line-height: 1.4;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
        }
        .code-line {
            padding: 2px 8px;
            border-radius: 4px;
            transition: all 0.3s ease;
            white-space: pre;
        }
        .code-line.active {
            background: rgba(0, 255, 255, 0.2);
            border-left: 3px solid #00ffff;
        }
        .code-keyword { color: #ff79c6; }
        .code-function { color: #50fa7b; }
        .code-number { color: #bd93f9; }
        .code-comment { color: #6272a4; }
        .code-variable { color: #8be9fd; }
        .code-string { color: #f1fa8c; }
        .info-panel {
            background: linear-gradient(135deg, #0f0f1a, #1a1a2e);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            padding: 20px;
        }
        .panel-section { margin-bottom: 20px; }
        .panel-title {
            font-size: 0.8rem;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-title::before {
            content: "";
            width: 4px;
            height: 14px;
            background: linear-gradient(180deg, #00ffff, #ff00ff);
            border-radius: 2px;
        }
        .step-description {
            font-size: 1rem;
            line-height: 1.5;
            color: #e0e0e0;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border-left: 3px solid #00ffff;
        }
        .complexity-badge {
            display: inline-block;
            padding: 5px 12px;
            background: linear-gradient(135deg, rgba(255, 0, 255, 0.2), rgba(0, 255, 255, 0.2));
            border: 1px solid rgba(255, 0, 255, 0.4);
            border-radius: 15px;
            font-size: 0.85rem;
            color: #ff00ff;
            font-weight: bold;
        }
        .state-info {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(0, 255, 255, 0.2);
        }
        .control-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid rgba(0, 255, 255, 0.4);
            color: #00ffff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        .control-btn:hover:not(:disabled) { background: linear-gradient(135deg, #00ffff, #0088aa); color: #000; }
        .control-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .control-btn.playing { background: linear-gradient(135deg, #ff00ff, #aa0088); border-color: #ff00ff; }
        .speed-control { display: flex; align-items: center; gap: 10px; margin-left: auto; }
        .speed-label { color: #888; font-size: 0.85rem; }
        .speed-slider {
            width: 100px;
            height: 5px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            border-radius: 3px;
        }
        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }
        .progress-bar { height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; overflow: hidden; margin-top: 12px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00ffff, #ff00ff); transition: width 0.3s ease; }
        .step-counter { text-align: center; color: #888; font-size: 0.85rem; margin-top: 8px; }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; }
        .legend-color { width: 14px; height: 14px; border-radius: 4px; }
        .result-display {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 12px 20px;
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 255, 136, 0.1));
            border: 2px solid #00ff88;
            border-radius: 10px;
            font-size: 1rem;
            color: #00ff88;
            font-weight: bold;
            display: none;
        }
        .camera-hint {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Advanced Data Structures</h1>
        <p class="subtitle">Tries, Segment Trees, Fenwick Trees - Drag to rotate, scroll to zoom</p>
    </header>
    <div class="container">
        <div class="algorithm-selector" id="algoSelector"></div>
        <div class="main-content">
            <div class="left-panel">
                <div class="visualization-area">
                    <div class="scene" id="scene">
                        <div class="stage" id="stage">
                            <div class="structure-container" id="structureContainer"></div>
                        </div>
                        <div class="result-display" id="resultDisplay"></div>
                        <div class="camera-hint">Drag to rotate | Scroll to zoom</div>

                    <div class="controls">
                        <button class="control-btn" id="prevBtn">Prev</button>
                        <button class="control-btn" id="playBtn">Play</button>
                        <button class="control-btn" id="nextBtn">Next</button>
                        <button class="control-btn" id="resetBtn">Reset</button>
                        <div class="speed-control">
                            <span class="speed-label">Speed:</span>
                            <input type="range" class="speed-slider" id="speedSlider" min="200" max="2000" value="800">
                        </div>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                    <div class="step-counter" id="stepCounter">Step 0 / 0</div>

                <div class="code-panel">
                    <div class="code-title">Python Code</div>

                </div>
            </div>
            <div class="info-panel">
                <div class="panel-section">
                    <div class="panel-title">Current Step</div>

                </div>
                <div class="panel-section">

                    <div class="panel-title">State</div>

                </div>
                <div class="panel-section">
                    <div class="panel-title">Legend</div>
                    <div class="legend">
                        <div class="legend-item"><div class="legend-color" style="background:linear-gradient(135deg,#ffd700,#996600)"></div><span>Current</span></div>
                        <div class="legend-item"><div class="legend-color" style="background:linear-gradient(135deg,#00ffff,#006688)"></div><span>Path/Visited</span></div>
                        <div class="legend-item"><div class="legend-color" style="background:linear-gradient(135deg,#00ff88,#006633)"></div><span>Result</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
const codeSnippets = {
    "trie_insert": `<span class="code-keyword">class</span> <span class="code-function">TrieNode</span>:
    <span class="code-keyword">def</span> <span class="code-function">__init__</span>(self):
        self.children = {}
        self.is_end = <span class="code-keyword">False</span>

<span class="code-keyword">class</span> <span class="code-function">Trie</span>:
    <span class="code-keyword">def</span> <span class="code-function">__init__</span>(self):
        self.root = TrieNode()
    
    <span class="code-keyword">def</span> <span class="code-function">insert</span>(self, word):
        node = self.root
        <span class="code-keyword">for</span> char <span class="code-keyword">in</span> word:
            <span class="code-keyword">if</span> char <span class="code-keyword">not in</span> node.children:
                node.children[char] = TrieNode()
            node = node.children[char]
        node.is_end = <span class="code-keyword">True</span>`,
    "trie_search": `<span class="code-keyword">def</span> <span class="code-function">search</span>(self, word):
    node = self.root
    <span class="code-keyword">for</span> char <span class="code-keyword">in</span> word:
        <span class="code-keyword">if</span> char <span class="code-keyword">not in</span> node.children:
            <span class="code-keyword">return</span> <span class="code-keyword">False</span>
        node = node.children[char]
    <span class="code-keyword">return</span> node.is_end`,
    "segment_tree_build": `<span class="code-keyword">class</span> <span class="code-function">SegmentTree</span>:
    <span class="code-keyword">def</span> <span class="code-function">__init__</span>(self, arr):
        self.n = len(arr)
        self.tree = [<span class="code-number">0</span>] * (<span class="code-number">4</span> * self.n)
        self._build(arr, <span class="code-number">0</span>, <span class="code-number">0</span>, self.n - <span class="code-number">1</span>)
    
    <span class="code-keyword">def</span> <span class="code-function">_build</span>(self, arr, node, start, end):
        <span class="code-keyword">if</span> start == end:
            self.tree[node] = arr[start]
        <span class="code-keyword">else</span>:
            mid = (start + end) // <span class="code-number">2</span>
            self._build(arr, <span class="code-number">2</span>*node+<span class="code-number">1</span>, start, mid)
            self._build(arr, <span class="code-number">2</span>*node+<span class="code-number">2</span>, mid+<span class="code-number">1</span>, end)
            self.tree[node] = self.tree[<span class="code-number">2</span>*node+<span class="code-number">1</span>] + self.tree[<span class="code-number">2</span>*node+<span class="code-number">2</span>]`,
    "segment_tree_query": `<span class="code-keyword">def</span> <span class="code-function">query</span>(self, L, R):
    <span class="code-keyword">return</span> self._query(<span class="code-number">0</span>, <span class="code-number">0</span>, self.n-<span class="code-number">1</span>, L, R)

<span class="code-keyword">def</span> <span class="code-function">_query</span>(self, node, start, end, L, R):
    <span class="code-keyword">if</span> R < start <span class="code-keyword">or</span> L > end:
        <span class="code-keyword">return</span> <span class="code-number">0</span>  <span class="code-comment"># No overlap</span>
    <span class="code-keyword">if</span> L <= start <span class="code-keyword">and</span> end <= R:
        <span class="code-keyword">return</span> self.tree[node]  <span class="code-comment"># Full overlap</span>
    mid = (start + end) // <span class="code-number">2</span>
    left = self._query(<span class="code-number">2</span>*node+<span class="code-number">1</span>, start, mid, L, R)
    right = self._query(<span class="code-number">2</span>*node+<span class="code-number">2</span>, mid+<span class="code-number">1</span>, end, L, R)
    <span class="code-keyword">return</span> left + right`,
    "fenwick_update": `<span class="code-keyword">class</span> <span class="code-function">FenwickTree</span>:
    <span class="code-keyword">def</span> <span class="code-function">__init__</span>(self, n):
        self.n = n
        self.tree = [<span class="code-number">0</span>] * (n + <span class="code-number">1</span>)
    
    <span class="code-keyword">def</span> <span class="code-function">update</span>(self, i, delta):
        i += <span class="code-number">1</span>  <span class="code-comment"># 1-indexed</span>
        <span class="code-keyword">while</span> i <= self.n:
            self.tree[i] += delta
            i += i & (-i)  <span class="code-comment"># Add LSB</span>`,
    "fenwick_query": `<span class="code-keyword">def</span> <span class="code-function">prefix_sum</span>(self, i):
    i += <span class="code-number">1</span>  <span class="code-comment"># 1-indexed</span>
    total = <span class="code-number">0</span>
    <span class="code-keyword">while</span> i > <span class="code-number">0</span>:
        total += self.tree[i]
        i -= i & (-i)  <span class="code-comment"># Remove LSB</span>
    <span class="code-keyword">return</span> total`

"action":"level","nodes":[4,12,20],"ranges":["[0-1]","[2-3]","[4-5]"]},{"step":4,"description":"Build level 1: [4+12=16, 20]. Combine subtrees.","action":"level","nodes":[16,20],"ranges":["[0-3]","[4-5]"]},{"step":5,"description":"Build root: 16+20=36. Root covers entire array [0-5].","action":"root","value":36,"range":"[0-5]"}]},{"algorithm":"segment_tree_query","name":"Segment Tree Query","complexity":"O(log n)","steps":[{"step":1,"description":"Query sum of range [1, 4] on array [1, 3, 5, 7, 9, 11].","action":"init","query":[1,4],"array":[1,3,5,7,9,11]},{"step":2,"description":"Start at root [0-5]=36. Partial overlap with [1,4]. Go deeper.","action":"visit","range":[0,5],"value":36,"overlap":"partial"},{"step":3,"description":"Check left child [0-2]. Partial overlap. Go deeper.","action":"visit","range":[0,2],"overlap":"partial"},{"step":4,"description":"Check [0-1]. Partial overlap (only index 1 in query).","action":"visit","range":[0,1],"overlap":"partial"},{"step":5,"description":"Get leaf [1]=3. Full overlap. Add to result. Sum=3.","action":"get","range":[1,1],"value":3,"sum":3},{"step":6,"description":"Get [2]=5. Full overlap. Add to result. Sum=8.","action":"get","range":[2,2],"value":5,"sum":8},{"step":7,"description":"Check right child [3-5]. Partial overlap.","action":"visit","range":[3,5],"overlap":"partial"},{"step":8,"description":"Get [3-4]=16. Full overlap! Add to result. Sum=24.","action":"get","range":[3,4],"value":16,"sum":24},{"step":9,"description":"Complete! Sum[1,4] = 3 + 5 + 16 = 24.","action":"complete","result":24}]},{"algorithm":"fenwick_update","name":"Fenwick Update","complexity":"O(log n)","steps":[{"step":1,"description":"Fenwick Tree (BIT): Update index 3 by +5. Uses binary representation.","action":"init","index":3,"delta":5},{"step":2,"description":"Update BIT[4] (1-indexed). Binary: 0100. LSB=4. Next: 4+4=8.","action":"update","index":4,"binary":"0100","lsb":4},{"step":3,"description":"Update BIT[8]. Binary: 1000. LSB=8. Next: 8+8 let currentAlgorithm = null;
let currentStep = 0;
let isPlaying = false;
let playInterval = null;
let cameraRotX = 15;
let cameraRotY = 0;
let cameraZoom = 0;
let isDragging = false;
let lastMouseX = 0;
let lastMouseY = 0;

const scene = document.getElementById('scene');
const stage = document.getElementById('stage');
const structureContainer = document.getElementById('structureContainer');
const codeBlock = document.getElementById('codeBlock');
const stepDescription = document.getElementById('stepDescription');
const complexityBadge = document.getElementById('complexityBadge');
const stateInfo = document.getElementById('stateInfo');
const progressFill = document.getElementById('progressFill');
const stepCounter = document.getElementById('stepCounter');
const playBtn = document.getElementById('playBtn');
const resultDisplay = document.getElementById('resultDisplay');

function initAlgorithmSelector() {
    const selector = document.getElementById('algoSelector');
    visualData.algorithms.forEach((algo, index) => {
        const btn = document.createElement('button');
        btn.className = 'algo-btn';
        btn.textContent = algo.name;
        btn.onclick = () => selectAlgorithm(index);
        selector.appendChild(btn);
    });
}

function selectAlgorithm(index) {
    document.querySelectorAll('.algo-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
    currentAlgorithm = visualData.algorithms[index];
    currentStep = 0;
    stopPlaying();
    complexityBadge.textContent = currentAlgorithm.complexity;
    renderCode();
    renderStep();
    updateControls();
}

function renderCode() {
    const code = codeSnippets[currentAlgorithm.algorithm] || '';
    const lines = code.split('\n');
    let html = '';
    lines.forEach((line, idx) => {
        html += '<div class="code-line" data-line="' + idx + '">' + line + '</div>';
    });
    codeBlock.innerHTML = html;
}

function highlightCodeLines(stepNum) {
    const lineMap = codeLineMap[currentAlgorithm.algorithm] || {};
    const activeLines = lineMap[stepNum] || [];
    document.querySelectorAll('.code-line').forEach((el, idx) => {
        el.classList.remove('active');
        if (activeLines.includes(idx)) el.classList.add('active');
    });
}

function renderTrie(step) {
    const path = step.path || '';
    const isEnd = step.action === 'mark_end' || step.action === 'found';
    
    let html = '<div class="trie-container">';
    
    // Root
    html += '<div class="trie-level"><div class="trie-node root">*</div></div>';
    
    // Build path nodes
    if (path.length > 0) {
        for (let i = 0; i < path.length; i++) {
            const char = path[i];
            const isCurrent = i === path.length - 1;
            let nodeClass = 'trie-node';
            if (isCurrent) nodeClass += ' current';
            else nodeClass += ' path';
            if (isCurrent && isEnd) nodeClass += ' word-end';
            
            html += '<div class="trie-level"><div class="' + nodeClass + '">' + char + '</div></div>';
        }
    }
    
    html += '</div>';
    structureContainer.innerHTML = html;
}

function renderSegmentTree(step) {
    const array = [1, 3, 5, 7, 9, 11];
    const query = step.query || null;
    const currentRange = step.range || null;
    const isComplete = step.action === 'complete';
    const sum = step.sum || 0;
    
    let html = '<div class="segment-tree">';
    
    // Root level
    let rootClass = 'tree-node';
    if (currentRange && currentRange[0] === 0 && currentRange[1] === 5) rootClass += ' current';
    if (isComplete) rootClass += ' included';
    html += '<div class="tree-level"><div class="' + rootClass + '"><div class="value">36</div><div class="range">[0-5]</div></div></div>';
    
    // Level 1
    html += '<div class="tree-level">';
    let l1Class1 = 'tree-node';
    let l1Class2 = 'tree-node';
    if (currentRange && currentRange[0] === 0 && currentRange[1] <= 3) l1Class1 += ' current';
    if (currentRange && currentRange[0] >= 3 && currentRange[1] === 5) l1Class2 += ' current';
    html += '<div class="' + l1Class1 + '"><div class="value">16</div><div class="range">[0-3]</div></div>';
    html += '<div class="' + l1Class2 + '"><div class="value">20</div><div class="range">[4-5]</div></div>';
    html += '</div>';
    
    // Level 2
    html += '<div class="tree-level">';
    const l2Ranges = [[0,1], [2,3], [4,5]];
    const l2Values = [4, 12, 20];
    l2Ranges.forEach((r, i) => {
        let cls = 'tree-node';
        if (currentRange && currentRange[0] === r[0] && currentRange[1] === r[1]) cls += ' current';
        if (step.action === 'get' && currentRange && currentRange[0] >= r[0] && currentRange[1] <= r[1]) cls += ' included';
        html += '<div class="' + cls + '"><div class="value">' + l2Values[i] + '</div><div class="range">[' + r[0] + '-' + r[1] + ']</div></div>';
    });
    html += '</div>';
    
    // Leaves
    html += '<div class="tree-level">';
    array.forEach((val, i) => {
        let cls = 'tree-node';
        if (currentRange && currentRange[0] === i && currentRange[1] === i) cls += ' current';
        if (query && i >= query[0] && i <= query[1]) cls += ' included';
        html += '<div class="' + cls + '"><div class="value">' + val + '</div><div class="range">[' + i + ']</div></div>';
    });
    html += '</div>';
    
    // Array display
    html += '<div class="array-display">';
    array.forEach((val, i) => {
        let cls = 'array-cell';
        if (query && i >= query[0] && i <= query[1]) cls += ' in-range';
        html += '<div class="' + cls + '"><div class="idx">' + i + '</div><div class="val">' + val + '</div></div>';
    });
    html += '</div>';
    
    html += '</div>';
    structureContainer.innerHTML = html;
}

function renderFenwick(step) {
    const size = 10;
    const activeIndex = step.index || null;
    const isComplete = step.action === 'complete';
    
    let html = '<div class="fenwick-container">';
    
    html += '<div style="color:#888;font-size:0.9rem;margin-bottom:10px">Fenwick Tree (Binary Indexed Tree)</div>';
    
    html += '<div class="bit-array">';
    for (let i = 1; i <= 8; i++) {
        let cls = 'bit-cell';
        if (activeIndex === i) cls += ' active';
        const binary = i.toString(2).padStart(4, '0');
        const lsb = i & (-i);
        html += '<div class="' + cls + '"><div class="idx">' + i + '</div><div class="binary">' + binary + '</div><div class="val">LSB=' + lsb + '</div></div>';
    }
    html += '</div>';
    
    if (step.binary) {
        html += '<div style="margin-top:20px;padding:15px;background:rgba(0,0,0,0.3);border-radius:8px">';
        html += '<div style="color:#00ffff">Current: ' + step.index + ' (binary: ' + step.binary + ')</div>';
        html += '<div style="color:#ff00ff">LSB: ' + step.lsb + '</div>';
        html += '</div>';
    }
    
    html += '</div>';
    structureContainer.innerHTML = html;
}

function renderStep() {
    if (!currentAlgorithm) return;
    const step = currentAlgorithm.steps[currentStep];
    stepDescription.textContent = step.description;
    highlightCodeLines(step.step);
    resultDisplay.style.display = 'none';
    
    // Render based on algorithm type
    const algo = currentAlgorithm.algorithm;
    if (algo.startsWith('trie')) renderTrie(step);
    else if (algo.startsWith('segment')) renderSegmentTree(step);
    else if (algo.startsWith('fenwick')) renderFenwick(step);
    
    // Update state info
    let info = '';
    if (step.path !== undefined) info += 'Path: "' + step.path + '"\n';
    if (step.char) info += 'Character: ' + step.char + '\n';
    if (step.range) info += 'Range: [' + step.range.join(', ') + ']\n';
    if (step.value !== undefined) info += 'Value: ' + step.value + '\n';
    if (step.sum !== undefined) info += 'Running sum: ' + step.sum + '\n';
    if (step.result !== undefined) info += 'Result: ' + step.result;
    if (step.binary) info += 'Binary: ' + step.binary + '\nLSB: ' + step.lsb;
    stateInfo.textContent = info || '-';
    
    if (step.action === 'complete' || step.action === 'found' || step.action === 'mark_end') {
        resultDisplay.style.display = 'block';
        if (step.result !== undefined) resultDisplay.textContent = 'Result: ' + step.result;
        else if (step.is_end) resultDisplay.textContent = 'Found!';
        else resultDisplay.textContent = 'Complete!';
    }
    
    progressFill.style.width = ((currentStep + 1) / currentAlgorithm.steps.length * 100) + '%';
    stepCounter.textContent = 'Step ' + (currentStep + 1) + ' / ' + currentAlgorithm.steps.length;
}

function updateControls() {
    document.getElementById('prevBtn').disabled = !currentAlgorithm || currentStep === 0;
    document.getElementById('nextBtn').disabled = !currentAlgorithm || currentStep >= currentAlgorithm.steps.length - 1;
    document.getElementById('playBtn').disabled = !currentAlgorithm;
}

function nextStep() {
    if (currentAlgorithm && currentStep < currentAlgorithm.steps.length - 1) { currentStep++; renderStep(); updateControls(); }
    else stopPlaying();
}

function prevStep() {
    if (currentAlgorithm && currentStep > 0) { currentStep--; renderStep(); updateControls(); }
}

function togglePlay() { if (isPlaying) stopPlaying(); else startPlaying(); }

function startPlaying() {
    isPlaying = true;
    playBtn.textContent = 'Pause';
    playBtn.classList.add('playing');
    playInterval = setInterval(() => {
        if (currentStep < currentAlgorithm.steps.length - 1) nextStep();
        else stopPlaying();
    }, 2200 - document.getElementById('speedSlider').value);
}

function stopPlaying() {
    isPlaying = false;
    playBtn.textContent = 'Play';
    playBtn.classList.remove('playing');
    if (playInterval) { clearInterval(playInterval); playInterval = null; }
}

function reset() { stopPlaying(); currentStep = 0; renderStep(); updateControls(); }

function updateCamera() {
    stage.style.transform = 'translateZ(' + cameraZoom + 'px) rotateX(' + cameraRotX + 'deg) rotateY(' + cameraRotY + 'deg)';
}

scene.addEventListener('mousedown', (e) => { isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY; });
document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    cameraRotY += (e.clientX - lastMouseX) * 0.5;
    cameraRotX -= (e.clientY - lastMouseY) * 0.3;
    cameraRotX = Math.max(-60, Math.min(60, cameraRotX));
    lastMouseX = e.clientX; lastMouseY = e.clientY;
    updateCamera();
});
document.addEventListener('mouseup', () => { isDragging = false; });
scene.addEventListener('wheel', (e) => { e.preventDefault(); cameraZoom += e.deltaY * -0.5; cameraZoom = Math.max(-300, Math.min(200, cameraZoom)); updateCamera(); });

document.getElementById('playBtn').onclick = togglePlay;
document.getElementById('prevBtn').onclick = prevStep;
document.getElementById('nextBtn').onclick = nextStep;
document.getElementById('resetBtn').onclick = reset;
document.getElementById('speedSlider').oninput = () => { if (isPlaying) { stopPlaying(); startPlaying(); } };

initAlgorithmSelector();
updateCamera();
    </script>
</body>
</html>
