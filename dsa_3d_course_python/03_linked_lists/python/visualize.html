    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .subtitle { color: #888; font-size: 1rem; margin-top: 8px; }

        .algo-btn {

            font-size: 0.85rem;

        .left-panel { display: flex; flex-direction: column; gap: 20px; }
        .visualization-area {
            background: radial-gradient(ellipse at center, #0f0f1a 0%, #050508 70%, #000 100%);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            overflow: hidden;
            position: relative;
        }
        .scene {
            width: 100%;
            height: 380px;
            perspective: 1200px;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }
        .scene:active { cursor: grabbing; }
        .stage {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform-origin: 50% 50%;
            transition: transform 0.1s ease-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .viz-container {
            transform-style: preserve-3d;
            display: flex;
            align-items: center;
            gap: 0;
        }
        .node {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            border: 2px solid rgba(0, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            transition: all 0.4s ease;
            position: relative;
            z-index: 1;
        }
        .node.current {
            border-color: #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
            transform: scale(1.15) translateZ(30px);
        }
        .node.head-node {
            border-color: #ffd700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
        }
        .node.tail-node {
            border-color: #ff00ff;
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.5);
        }
        .node.new-node {
            border-color: #00ff88;
            background: linear-gradient(135deg, #0a2a1a, #0f1f0f);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.6);
            animation: pulse-new 1s ease infinite;
        }
        @keyframes pulse-new {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .node.delete-node {
            border-color: #ff6b6b;
            background: linear-gradient(135deg, #2a1a1a, #1f0f0f);
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.6);
        }
        .node.tortoise {
            border-color: #00ff88;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.5);
        }
        .node.hare {
            border-color: #ff6b6b;
            box-shadow: 0 0 25px rgba(255, 107, 107, 0.5);
        }
        .node.prev-ptr {
            border-color: #ffd700;
        }
        .node.curr-ptr {
            border-color: #00ffff;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.5);
        }
        .arrow {
            width: 40px;
            height: 4px;
            background: linear-gradient(90deg, rgba(0, 255, 255, 0.3), rgba(0, 255, 255, 0.8));
            position: relative;
            margin: 0 -5px;

        .arrow::after {
            content: "";

            border: 8px solid transparent;
            border-left: 12px solid rgba(0, 255, 255, 0.8);

        .arrow.broken {
            opacity: 0.2;
            background: linear-gradient(90deg, rgba(255, 107, 107, 0.3), rgba(255, 107, 107, 0.5));
        }
        .arrow.broken::after {
            border-left-color: rgba(255, 107, 107, 0.5);
        }
        .arrow.new-link {

        .arrow.new-link::after {
            border-left-color: rgba(0, 255, 136, 0.8);

        .control-btn {

<body>
    <header>

    <script>
const codeSnippets = {
    "singly_linked_list_traversal": `<span class="code-keyword">class</span> <span class="code-function">Node</span>:
    <span class="code-keyword">def</span> <span class="code-function">__init__</span>(self, val):
        self.val = val
        self.next = <span class="code-keyword">None</span>

<span class="code-keyword">def</span> <span class="code-function">traverse</span>(head):
    current = head
    <span class="code-keyword">while</span> current:
        print(current.val)
        current = current.next
    <span class="code-comment"># Reached None - end of list</span>

<span class="code-comment"># O(n) time - visit each node once</span>`,
    "insert_at_head": `<span class="code-keyword">def</span> <span class="code-function">insert_at_head</span>(head, val):
    <span class="code-comment"># Create new node</span>
    new_node = Node(val)
    
    <span class="code-comment"># Point new node to current head</span>
    new_node.next = head
    
    <span class="code-comment"># Update head to new node</span>
    <span class="code-keyword">return</span> new_node  <span class="code-comment"># New head</span>

<span class="code-comment"># O(1) time - no traversal needed!</span>`,
    "insert_at_tail": `<span class="code-keyword">def</span> <span class="code-function">insert_at_tail</span>(head, val):
    new_node = Node(val)
    
    <span class="code-keyword">if</span> <span class="code-keyword">not</span> head:
        <span class="code-keyword">return</span> new_node
    
    <span class="code-comment"># Traverse to find tail</span>
    current = head
    <span class="code-keyword">while</span> current.next:
        current = current.next
    
    <span class="code-comment"># Link tail to new node</span>
    current.next = new_node
    <span class="code-keyword">return</span> head

<span class="code-comment"># O(n) time - must traverse to tail</span>`,
    "delete_node": `<span class="code-keyword">def</span> <span class="code-function">delete_node</span>(head, val):
    <span class="code-keyword">if</span> head.val == val:
        <span class="code-keyword">return</span> head.next
    
    current = head
    <span class="code-keyword">while</span> current.next:
        <span class="code-keyword">if</span> current.next.val == val:
            <span class="code-comment"># Skip the node to delete</span>
            current.next = current.next.next
            <span class="code-keyword">return</span> head
        current = current.next
    
    <span class="code-keyword">return</span> head

<span class="code-comment"># O(n) time - may need to traverse</span>`,
    "reverse_linked_list": `<span class="code-keyword">def</span> <span class="code-function">reverse</span>(head):
    prev = <span class="code-keyword">None</span>
    curr = head
    
    <span class="code-keyword">while</span> curr:
        next_temp = curr.next  <span class="code-comment"># Save next</span>
        curr.next = prev       <span class="code-comment"># Reverse link</span>
        prev = curr            <span class="code-comment"># Move prev</span>
        curr = next_temp       <span class="code-comment"># Move curr</span>
    
    <span class="code-keyword">return</span> prev  <span class="code-comment"># New head</span>

<span class="code-comment"># O(n) time, O(1) space</span>`,
    "floyd_cycle_detection": `<span class="code-keyword">def</span> <span class="code-function">has_cycle</span>(head):
    slow = head  <span class="code-comment"># Tortoise</span>
    fast = head  <span class="code-comment"># Hare</span>
    
    <span class="code-keyword">while</span> fast <span class="code-keyword">and</span> fast.next:
        slow = slow.next       <span class="code-comment"># Move 1 step</span>
        fast = fast.next.next  <span class="code-comment"># Move 2 steps</span>
        
        <span class="code-keyword">if</span> slow == fast:
            <span class="code-keyword">return</span> <span class="code-keyword">True</span>  <span class="code-comment"># Cycle!</span>
    
    <span class="code-keyword">return</span> <span class="code-keyword">False</span>

<span class="code-comment"># O(n) time, O(1) space</span>`
};

eeded.","list":[10,20,30,40],"action":"complete"}]},{"algorithm":"insert_at_tail","name":"Insert at Tail","complexity":"O(n)","steps":[{"step":1,"description":"Current list: 10 -> 20 -> 30. We want to insert 40 at the tail.","list":[10,20,30],"action":"init"},{"step":2,"description":"Create new node with value 40.","list":[10,20,30],"newNode":40,"action":"create"},{"step":3,"description":"Start traversal from HEAD to find the tail.","list":[10,20,30],"current":0,"action":"traverse"},{"step":4,"description":"Continue traversal. Node 20 has a next pointer, so not the tail.","list":[10,20,30],"current":1,"action":"traverse"},{"step":5,"description":"Found tail! Node 30's next is NULL.","list":[10,20,30],"current":2,"tail":true,"action":"found_tail"},{"step":6,"description":"Remove NULL from node 30.","list":[10,20,30],"current":2,"action":"remove_null"},{"step":7,"description":"Link node 30 to new node 40.","list":[10,20,30],"newNode":40,"linking":true,"action":"link"},{"step":8,"description":"Add NULL terminator to node 40.","list":[10,20,30,40],"action":"add_null"},{"step":9,"description":"Insertion complete! O(n) time - had to traverse to find tail.","list":[10,20,30,40],"action":"complete"}]},{"algorithm":"delete_node","name":"Delete Node","complexity":"O(n)","steps":[{"step":1,"description":"List: 10 -> 20 -> 30 -> 40 -> 50. Delete node with value 30.","list":[10,20,30,40,50],"target":30,"action":"init"},{"step":2,"description":"Search for node to delete (30). Start from head.","list":[10,20,30,40,50],"target":30,"action":"search"},{"step":3,"description":"Check node 10. Not the target. Move to next.","list":[10,20,30,40,50],"current":0,"target":30,"action":"check"},{"step":4,"description":"Check node 20. Its next node (30) is the target!","list":[10,20,30,40,50],"current":1,"target":30,"action":"check"},{"step":5,"description":"Found target node 30! Mark for deletion.","list":[10,20,30,40,50],"delete":2,"action":"found"},{"step":6,"description":"Break link from node 20 to node 30.","list":[10,20,30,40,50],"delete":2,"breaking":true,"action":"break_link"},{"step":7,"description":"Break link from node 30 to node 40.","list":[10,20,30,40,50],"delete":2,"action":"break_link2"},{"step":8,"description":"Create direct link from node 20 to node 40.","list":[10,20,30,40,50],"newLink":[1,3],"action":"new_link"},{"step":9,"description":"Node 30 is now unreachable. Garbage collected.","list":[10,20,40,50],"action":"garbage"},{"step":10,"description":"Deletion complete! O(n) time to find the node.","list":[10,20,40,50],"action":"complete"}]},{"algorithm":"reverse_linked_list","name":"Reverse List","complexity":"O(n)","steps":[{"step":1,"description":"Reverse list 1 -> 2 -> 3 -> 4 -> 5. Initialize: prev=NULL, curr=1.","list":[1,2,3,4,5],"prev":null,"curr":0,"action":"init"},{"step":2,"description":"Save next: next_temp = 2. We need this before breaking the link.","list":[1,2,3,4,5],"prev":null,"curr":0,"next":1,"action":"save"},{"step":3,"description":"Reverse link: node(1).next = NULL. First node becomes new tail.","list":[1,2,3,4,5],"prev":null,"curr":0,"reversed":[0],"action":"reverse"},{"step":4,"description":"Advance pointers: prev=1, curr=2.","list":[1,2,3,4,5],"prev":0,"curr":1,"action":"advance"},{"step":5,"description":"Save next: next_temp = 3.","list":[1,2,3,4,5],"prev":0,"curr":1,"next":2,"action":"save"},{"step":6,"description":"Reverse link: node(2).next = 1.","list":[1,2,3,4,5],"prev":0,"curr":1,"reversed":[0,1],"action":"reverse"},{"step":7,"description":"Advance pointers: prev=2, curr=3.","list":[1,2,3,4,5],"prev":1,"curr":2,"action":"advance"},{"step":8,"description":"Save next: next_temp = 4.","list":[1,2,3,4,5],"prev":1,"curr":2,"next":3,"action":"save"},{"step":9,"description":"Reverse link: node(3).next = 2.","list":[1,2,3,4,5],"prev":1,"curr":2,"reversed":[0,1,2],"action":"reverse"},{"step":10,"description":"Advance pointers: prev=3, curr=4.","list":[1,2,3,4,5],"prev":2,"curr":3,"action":"advance"},{"step":11,"description":"Save next: next_temp = 5.","list":[1,2,3,4,5],"prev":2,"curr":3,"next":4,"action":"save"},{"step":12,"description":"Reverse link: node(4).next = 3.","list":[1,2,3,4,5],"prev":2,"curr":3,"reversed":[0,1,2,3],"action":"reverse"},{"step":13,"description":"Advance pointers: prev=4, curr=5.","list":[1,2,3,4,5],"prev":3,"curr":4,"action":"advance"},{"step":14,"description":"Save next: next_temp = NULL.","list":[1,2,3,4,5],"prev":3,"curr":4,"next":null,"action":"save"},{"step":15,"description":"Reverse link: node(5).next = 4.","list":[1,2,3,4,5],"prev":3,"curr":4,"reversed":[0,1,2,3,4],"action":"reverse"},{"step":16,"description":"Advance pointers: prev=5, curr=NULL. Loop ends.","list":[1,2,3,4,5],"prev":4,"curr":null,"action":"advance"},{"step":17,"description":"Update HEAD to point to prev (node 5).","list":[5,4,3,2,1],"action":"update_head"},{"step":18,"description":"Reversal complete! List is now 5 -> 4 -> 3 -> 2 -> 1.","list":[5,4,3,2,1],"action":"complete"}]},{"algorithm":"floyd_cycle_detection","name":"Cycle Detection","complexity":"O(n)","steps":[{"step":1,"description":"Detect cycle using Floyd's algorithm. Tortoise (slow) and Hare (fast) start at head.","list":[1,2,3,4,5,6],"cycle":3,"tortoise":0,"hare":0,"action":"init"},{"step":2,"description":"Move tortoise 1 step (to 2), hare 2 steps (to 3).","list":[1,2,3,4,5,6],"cycle":3,"tortoise":1,"hare":2,"action":"move"},{"step":3,"description":"Move tortoise 1 step (to 3), hare 2 steps (to 5).","list":[1,2,3,4,5,6],"cycle":3,"tortoise":2,"hare":4,"action":"move"},{"step":4,"description":"Move tortoise 1 step (to 4), hare 2 steps. Hare wraps around cycle!","list":[1,2,3,4,5,6],"cycle":3,"tortoise":3,"hare":2,"action":"move"},{"step":5,"description":"Move tortoise 1 step (to 5), hare 2 steps (to 5). They meet!","list":[1,2,3,4,5,6],"cycle":3,"tortoise":4,"hare":4,"action":"move"},{"step":6,"description":"CYCLE DETECTED! Tortoise and hare met at node 5.","list":[1,2,3,4,5,6],"cycle":3,"meeting":4,"action":"detected"},{"step":7,"description":"Cycle exists! Entry point is at node 3. O(n) time, O(1) space.","list":[1,2,3,4,5,6],"cycle":3,"entry":2,"action":"complete"}]}]};

let currentAlgorithm = null;
let currentStep = 0;
let isPlaying = false;
let playInterval = null;
let cameraRotX = 15;
let cameraRotY = 0;
let cameraZoom = 0;
let isDragging = false;
let lastMouseX = 0;
let lastMouseY = 0;

const scene = document.getElementById('scene');
const stage = document.getElementById('stage');
const vizContainer = document.getElementById('vizContainer');
const codeBlock = document.getElementById('codeBlock');
const stepDescription = document.getElementById('stepDescription');
const complexityBadge = document.getElementById('complexityBadge');
const stateInfo = document.getElementById('stateInfo');
const progressFill = document.getElementById('progressFill');
const stepCounter = document.getElementById('stepCounter');
const playBtn = document.getElementById('playBtn');
const resultDisplay = document.getElementById('resultDisplay');

function initAlgorithmSelector() {
    const selector = document.getElementById('algoSelector');
    visualData.algorithms.forEach((algo, index) => {
        const btn = document.createElement('button');
        btn.className = 'algo-btn';
        btn.textContent = algo.name;
        btn.onclick = () => selectAlgorithm(index);
        selector.appendChild(btn);
    });
}

function selectAlgorithm(index) {
    document.querySelectorAll('.algo-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
    currentAlgorithm = visualData.algorithms[index];
    currentStep = 0;
    stopPlaying();
    complexityBadge.textContent = currentAlgorithm.complexity;
    renderCode();
    renderStep();
    updateControls();
}

function renderCode() {
    const code = codeSnippets[currentAlgorithm.algorithm] || '';
    const lines = code.split('\n');
    let html = '';
    lines.forEach((line, idx) => {
        html += '<div class="code-line" data-line="' + idx + '">' + line + '</div>';
    });
    codeBlock.innerHTML = html;
}

function highlightCodeLines(stepNum) {
    const lineMap = codeLineMap[currentAlgorithm.algorithm] || {};
    const activeLines = lineMap[stepNum] || [];
    document.querySelectorAll('.code-line').forEach((el, idx) => {
        el.classList.remove('active');
        if (activeLines.includes(idx)) el.classList.add('active');
    });
}

function renderStep() {
    if (!currentAlgorithm) return;
    const step = currentAlgorithm.steps[currentStep];
    stepDescription.textContent = step.description;
    highlightCodeLines(step.step);
    resultDisplay.style.display = 'none';
    
    const list = step.list || [];
    let html = '';
    
    // HEAD label
    html += '<div class="node head-node" style="width:40px;height:40px;font-size:0.7rem"><div class="head-label">HEAD</div>H</div>';
    html += '<div class="arrow"></div>';
    
    // Render nodes
    list.forEach((val, i) => {
        let nodeClass = 'node';
        if (step.current === i) nodeClass += ' current';
        if (step.delete === i) nodeClass += ' delete-node';
        if (step.tail && step.current === i) nodeClass += ' tail-node';
        if (step.tortoise === i) nodeClass += ' tortoise';
        if (step.hare === i) nodeClass += ' hare';
        if (step.prev === i) nodeClass += ' prev-ptr';
        if (step.curr === i) nodeClass += ' curr-ptr';
        if (step.meeting === i) nodeClass += ' current';
        if (step.entry === i) nodeClass += ' new-node';
        
        html += '<div class="' + nodeClass + '">' + val + '</div>';
        
        // Arrow after node (except last)
        if (i < list.length - 1) {
            let arrowClass = 'arrow';
            if (step.breaking && step.delete === i + 1) arrowClass += ' broken';
            if (step.newLink && step.newLink[0] === i) arrowClass += ' new-link';
            html += '<div class="' + arrowClass + '"></div>';
        }
    });
    
    // NULL terminator
    html += '<div class="arrow"></div>';
    html += '<div class="null-terminator">NULL</div>';
    
    // New node (if creating)
    if (step.newNode !== undefined && step.action !== 'complete') {
        html += '<div style="position:absolute;top:20px;right:20px">';
        html += '<div class="node new-node">' + step.newNode + '</div>';
        html += '<div style="color:#00ff88;font-size:0.7rem;text-align:center;margin-top:5px">New Node</div>';
        html += '</div>';
    }
    
    vizContainer.innerHTML = html;
    
    // Update state info
    let info = '';
    if (step.current !== undefined && step.current !== null) info += 'Current: node ' + step.current + '\n';
    if (step.prev !== undefined && step.prev !== null) info += 'Prev: node ' + step.prev + '\n';
    if (step.curr !== undefined && step.curr !== null) info += 'Curr: node ' + step.curr + '\n';
    if (step.tortoise !== undefined) info += 'Tortoise: node ' + step.tortoise + '\n';
    if (step.hare !== undefined) info += 'Hare: node ' + step.hare + '\n';
    if (step.target !== undefined) info += 'Target: ' + step.target + '\n';
    if (step.newNode !== undefined) info += 'New node: ' + step.newNode;
    stateInfo.textContent = info || '-';
    
    if (step.action === 'complete' || step.action === 'detected') {
        resultDisplay.style.display = 'block';
        resultDisplay.textContent = step.action === 'detected' ? 'Cycle Detected!' : 'Complete!';
    }
    
    progressFill.style.width = ((currentStep + 1) / currentAlgorithm.steps.length * 100) + '%';
    stepCounter.textContent = 'Step ' + (currentStep + 1) + ' / ' + currentAlgorithm.steps.length;
}

function updateControls() {
    document.getElementById('prevBtn').disabled = !currentAlgorithm || currentStep === 0;
    document.getElementById('nextBtn').disabled = !currentAlgorithm || currentStep >= currentAlgorithm.steps.length - 1;
    document.getElementById('playBtn').disabled = !currentAlgorithm;
}

function nextStep() {
    if (currentAlgorithm && currentStep < currentAlgorithm.steps.length - 1) { currentStep++; renderStep(); updateControls(); }
    else stopPlaying();
}

function prevStep() {
    if (currentAlgorithm && currentStep > 0) { currentStep--; renderStep(); updateControls(); }
}

function togglePlay() { if (isPlaying) stopPlaying(); else startPlaying(); }

function startPlaying() {
    isPlaying = true;
    playBtn.textContent = 'Pause';
    playBtn.classList.add('playing');
    playInterval = setInterval(() => {
        if (currentStep < currentAlgorithm.steps.length - 1) nextStep();
        else stopPlaying();
    }, 2200 - document.getElementById('speedSlider').value);
}

function stopPlaying() {
    isPlaying = false;
    playBtn.textContent = 'Play';
    playBtn.classList.remove('playing');
    if (playInterval) { clearInterval(playInterval); playInterval = null; }
}

function reset() { stopPlaying(); currentStep = 0; renderStep(); updateControls(); }

function updateCamera() {
    stage.style.transform = 'translateZ(' + cameraZoom + 'px) rotateX(' + cameraRotX + 'deg) rotateY(' + cameraRotY + 'deg)';
}

scene.addEventListener('mousedown', (e) => { isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY; });
document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    cameraRotY += (e.clientX - lastMouseX) * 0.5;
    cameraRotX -= (e.clientY - lastMouseY) * 0.3;
    cameraRotX = Math.max(-60, Math.min(60, cameraRotX));
    lastMouseX = e.clientX; lastMouseY = e.clientY;
    updateCamera();
});
document.addEventListener('mouseup', () => { isDragging = false; });
scene.addEventListener('wheel', (e) => { e.preventDefault(); cameraZoom += e.deltaY * -0.5; cameraZoom = Math.max(-300, Math.min(200, cameraZoom)); updateCamera(); });

document.getElementById('playBtn').onclick = togglePlay;
document.getElementById('prevBtn').onclick = prevStep;
document.getElementById('nextBtn').onclick = nextStep;
document.getElementById('resetBtn').onclick = reset;
document.getElementById('speedSlider').oninput = () => { if (isPlaying) { stopPlaying(); startPlaying(); } };

initAlgorithmSelector();
updateCamera();
    </script>
</body>
</html>
