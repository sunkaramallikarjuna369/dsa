<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Sorting Algorithms - 3D Visualization</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header {
            text-align: center;
            padding: 25px 0;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(255, 0, 255, 0.1));
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            margin-bottom: 25px;
        }
        h1 {
            font-size: 2.2rem;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 3s linear infinite;
        }
        @keyframes gradient-shift {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        .subtitle { color: #888; font-size: 1rem; margin-top: 8px; }
        .algorithm-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 25px;
        }
        .algo-btn {
            padding: 10px 18px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #00ffff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        .algo-btn:hover { border-color: #00ffff; box-shadow: 0 0 20px rgba(0, 255, 255, 0.3); }
        .algo-btn.active {
            background: linear-gradient(135deg, #00ffff, #0088aa);
            color: #000;
            font-weight: bold;
        }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
        }
        @media (max-width: 1200px) { .main-content { grid-template-columns: 1fr; } }
        .left-panel { display: flex; flex-direction: column; gap: 20px; }
        .visualization-area {
            background: radial-gradient(ellipse at center, #0f0f1a 0%, #050508 70%, #000 100%);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            overflow: hidden;
            position: relative;
        }
        .scene {
            width: 100%;
            height: 380px;
            perspective: 1200px;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }
        .scene:active { cursor: grabbing; }
        .stage {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform-origin: 50% 50%;
            transition: transform 0.1s ease-out;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 40px;
        }
        .bars-container {
            display: flex;
            gap: 6px;
            align-items: flex-end;
            transform-style: preserve-3d;
        }
        .bar {
            width: 45px;
            background: linear-gradient(180deg, #00ffff 0%, #0088aa 50%, #004455 100%);
            border-radius: 6px 6px 0 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 8px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3), inset 0 2px 10px rgba(255, 255, 255, 0.2);
            transform-style: preserve-3d;
            position: relative;
        }
        .bar::after {
            content: attr(data-index);
            position: absolute;
            bottom: -25px;
            font-size: 0.7rem;
            color: #888;
        }
        .bar-value {
            font-size: 0.8rem;
            font-weight: bold;
            color: #000;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }
        .bar.comparing {
            background: linear-gradient(180deg, #ffd700 0%, #cc9900 50%, #996600 100%);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
            transform: translateY(-10px);
        }
        .bar.swapping {
            background: linear-gradient(180deg, #ff00ff 0%, #aa0088 50%, #660055 100%);
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.6);
            animation: swap-pulse 0.3s ease-in-out;
        }
        .bar.sorted {
            background: linear-gradient(180deg, #00ff88 0%, #00aa55 50%, #006633 100%);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }
        .bar.pivot {
            background: linear-gradient(180deg, #ffd700 0%, #ffaa00 50%, #cc8800 100%);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.7);
        }
        .bar.picked {
            transform: translateY(-30px);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.5);
        }
        .bar.min {
            background: linear-gradient(180deg, #ff6b6b 0%, #cc4444 50%, #992222 100%);
            box-shadow: 0 0 25px rgba(255, 107, 107, 0.6);
        }
        @keyframes swap-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1) translateZ(20px); }
        }
        .code-panel {
            background: linear-gradient(135deg, #0d0d15, #1a1a25);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            padding: 15px;
            max-height: 280px;
            overflow-y: auto;
        }
        .code-title {
            font-size: 0.8rem;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .code-title::before { content: "</>"; color: #ff00ff; font-weight: bold; }
        .code-block {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.72rem;
            line-height: 1.4;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
        }
        .code-line {
            padding: 2px 8px;
            border-radius: 4px;
            transition: all 0.3s ease;
            white-space: pre;
        }
        .code-line.active {
            background: rgba(0, 255, 255, 0.2);
            border-left: 3px solid #00ffff;
        }
        .code-keyword { color: #ff79c6; }
        .code-function { color: #50fa7b; }
        .code-number { color: #bd93f9; }
        .code-comment { color: #6272a4; }
        .code-variable { color: #8be9fd; }
        .info-panel {
            background: linear-gradient(135deg, #0f0f1a, #1a1a2e);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            padding: 20px;
        }
        .panel-section { margin-bottom: 20px; }
        .panel-title {
            font-size: 0.8rem;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-title::before {
            content: "";
            width: 4px;
            height: 14px;
            background: linear-gradient(180deg, #00ffff, #ff00ff);
            border-radius: 2px;
        }
        .step-description {
            font-size: 1rem;
            line-height: 1.5;
            color: #e0e0e0;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border-left: 3px solid #00ffff;
        }
        .complexity-badge {
            display: inline-block;
            padding: 5px 12px;
            background: linear-gradient(135deg, rgba(255, 0, 255, 0.2), rgba(0, 255, 255, 0.2));
            border: 1px solid rgba(255, 0, 255, 0.4);
            border-radius: 15px;
            font-size: 0.85rem;
            color: #ff00ff;
            font-weight: bold;
        }
        .stats-info {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.85rem;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(0, 255, 255, 0.2);
        }
        .control-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid rgba(0, 255, 255, 0.4);
            color: #00ffff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        .control-btn:hover:not(:disabled) { background: linear-gradient(135deg, #00ffff, #0088aa); color: #000; }
        .control-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .control-btn.playing { background: linear-gradient(135deg, #ff00ff, #aa0088); border-color: #ff00ff; }
        .speed-control { display: flex; align-items: center; gap: 10px; margin-left: auto; }
        .speed-label { color: #888; font-size: 0.85rem; }
        .speed-slider {
            width: 100px;
            height: 5px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            border-radius: 3px;
        }
        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }
        .progress-bar { height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; overflow: hidden; margin-top: 12px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00ffff, #ff00ff); transition: width 0.3s ease; }
        .step-counter { text-align: center; color: #888; font-size: 0.85rem; margin-top: 8px; }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; }
        .legend-color { width: 14px; height: 14px; border-radius: 4px; }
        .result-display {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 12px 20px;
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 255, 136, 0.1));
            border: 2px solid #00ff88;
            border-radius: 10px;
            font-size: 1rem;
            color: #00ff88;
            font-weight: bold;
            display: none;
        }
        .camera-hint {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.75rem;
        }
    </style>

    "merge_sort": `<span class="code-keyword">def</span> <span class="code-function">merge_sort</span>(arr):
    <span class="code-keyword">if</span> len(arr) <= <span class="code-number">1</span>:
        <span class="code-keyword">return</span> arr
    mid = len(arr) // <span class="code-number">2</span>
    left = merge_sort(arr[:mid])

<span class="code-keyword">def</span> <span class="code-function">merge</span>(left, right):

<span class="code-keyword">def</span> <span class="code-function">partition</span>(arr, low, high):
    pivot = arr[high]  <span class="code-comment"># Choose last as pivot</span>
    i = low - <span class="code-number">1</span>

    arr[i+<span class="code-number">1</span>], arr[high] = arr[high], arr[i+<span class="code-number">1</span>]
    <span class="code-keyword">return</span> i + <span class="code-number">1</span>`

ty":"O(n log n)","steps":[{"step":1,"description":"Merge Sort: Divide array in half recursively, then merge sorted halves.","action":"init","array":[38,27,43,3,9,82,10]},{"step":2,"description":"Divide: Split [38,27,43,3,9,82,10] into two halves.","action":"divide","left":[38,27,43],"right":[3,9,82,10],"array":[38,27,43,3,9,82,10]},{"step":3,"description":"Continue dividing until single elements (base case).","action":"divide","elements":[[38],[27],[43],[3],[9],[82],[10]],"array":[38,27,43,3,9,82,10]},{"step":4,"description":"Base case reached. Single elements are trivially sorted.","action":"base_case","array":[38,27,43,3,9,82,10]},{"step":5,"description":"Merge [38] and [27]: Compare, take smaller first. Result: [27, 38].","action":"merge","left":[38],"right":[27],"result":[27,38],"array":[27,38,43,3,9,82,10]},{"step":6,"description":"Merge [27,38] and [43]: Result: [27, 38, 43].","action":"merge","left":[27,38],"right":[43],"result":[27,38,43],"array":[27,38,43,3,9,82,10]},{"step":7,"description":"Merge right side: [3,9] and [10,82] -> [3, 9, 10, 82].","action":"merge","result":[3,9,10,82],"array":[27,38,43,3,9,10,82]},{"step":8,"description":"Final merge: [27,38,43] and [3,9,10,82].","action":"merge","left":[27,38,43],"right":[3,9,10,82],"array":[27,38,43,3,9,10,82]},{"step":9,"description":"Compare and interleave: 3<27, take 3. 9<27, take 9...","action":"merging","array":[3,9,10,27,38,43,82]},{"step":10,"description":"Merge complete! Array is sorted.","action":"complete","array":[3,9,10,27,38,43,82]}]},{"algorithm":"quick_sort","name":"Quick Sort","complexity":"O(n log n)","steps":[{"step":1,"description":"Quick Sort: Choose pivot, partition array so smaller elements are left, larger right.","action":"init","array":[10,80,30,90,40,50,70]},{"step":2,"description":"Choose pivot: 70 (last element). Partition around it.","action":"pivot","pivotIndex":6,"pivot":70,"array":[10,80,30,90,40,50,70]},{"step":3,"description":"Initialize i=-1 (boundary). Scan with j from 0 to 5.","action":"init_partition","i":-1,"j":0,"array":[10,80,30,90,40,50,70]},{"step":4,"description":"j=0: 10 <= 70. Increment i to 0, swap arr[0] with arr[0] (no change).","action":"partition_step","i":0,"j":0,"array":[10,80,30,90,40,50,70]},{"step":5,"description":"j=1: 80 > 70. Don't swap, just move j.","action":"partition_step","i":0,"j":1,"array":[10,80,30,90,40,50,70]},{"step":6,"description":"j=2: 30 <= 70. Increment i to 1, swap arr[1] with arr[2].","action":"partition_step","i":1,"j":2,"swap":[1,2],"array":[10,30,80,90,40,50,70]},{"step":7,"description":"Continue partitioning... Elements <= 70 move left.","action":"partition_step","i":3,"array":[10,30,40,50,80,90,70]},{"step":8,"description":"Place pivot at i+1=4. Pivot 70 is now in final sorted position!","action":"pivot_placed","pivotFinal":4,"array":[10,30,40,50,70,90,80],"sorted":[4]},{"step":9,"description":"Recursively sort left partition [10,30,40,50].","action":"recurse","range":[0,3],"array":[10,30,40,50,70,90,80]},{"step":10,"description":"Recursively sort right partition [90,80].","action":"recurse","range":[5,6],"array":[10,30,40,50,70,80,90]},{"step":11,"description":"All partitions sorted. Array is complete!","action":"complete","array":[10,30,40,50,70,80,90]}]}]};

let currentAlgorithm = null;
let currentStep = 0;
let isPlaying = false;
let playInterval = null;
let cameraRotX = 15;
let cameraRotY = 0;
let cameraZoom = 0;
let isDragging = false;
let lastMouseX = 0;
let lastMouseY = 0;

const scene = document.getElementById('scene');
const stage = document.getElementById('stage');
const barsContainer = document.getElementById('barsContainer');
const codeBlock = document.getElementById('codeBlock');
const stepDescription = document.getElementById('stepDescription');
const complexityBadge = document.getElementById('complexityBadge');
const statsInfo = document.getElementById('statsInfo');
const progressFill = document.getElementById('progressFill');
const stepCounter = document.getElementById('stepCounter');
const playBtn = document.getElementById('playBtn');
const resultDisplay = document.getElementById('resultDisplay');

function initAlgorithmSelector() {
    const selector = document.getElementById('algoSelector');
    visualData.algorithms.forEach((algo, index) => {
        const btn = document.createElement('button');
        btn.className = 'algo-btn';
        btn.textContent = algo.name;
        btn.onclick = () => selectAlgorithm(index);
        selector.appendChild(btn);
    });
}

function selectAlgorithm(index) {
    document.querySelectorAll('.algo-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
    currentAlgorithm = visualData.algorithms[index];
    currentStep = 0;
    stopPlaying();
    complexityBadge.textContent = currentAlgorithm.complexity;
    renderCode();
    renderStep();
    updateControls();
}

function renderCode() {
    const code = codeSnippets[currentAlgorithm.algorithm] || '';
    const lines = code.split('\n');
    let html = '';
    lines.forEach((line, idx) => {
        html += '<div class="code-line" data-line="' + idx + '">' + line + '</div>';
    });
    codeBlock.innerHTML = html;
}

function highlightCodeLines(stepNum) {
    const lineMap = codeLineMap[currentAlgorithm.algorithm] || {};
    const activeLines = lineMap[stepNum] || [];
    document.querySelectorAll('.code-line').forEach((el, idx) => {
        el.classList.remove('active');
        if (activeLines.includes(idx)) el.classList.add('active');
    });
}

function renderBars(step) {
    const array = step.array;
    const comparing = step.indices || [];
    const sorted = step.sorted || [];
    const swapping = step.action === 'swap' ? step.indices : [];
    const pivot = step.pivotIndex;
    const minIndex = step.minIndex;
    const picked = step.action === 'pick' ? step.index : -1;
    const isComplete = step.action === 'complete';
    
    const maxVal = Math.max(...array);
    let html = '';
    
    array.forEach((val, idx) => {
        const height = (val / maxVal) * 200 + 40;
        let barClass = 'bar';
        
        if (isComplete || sorted.includes(idx)) barClass += ' sorted';
        else if (swapping.includes(idx)) barClass += ' swapping';
        else if (comparing.includes(idx)) barClass += ' comparing';
        else if (idx === pivot) barClass += ' pivot';
        else if (idx === minIndex) barClass += ' min';
        else if (idx === picked) barClass += ' picked';
        
        html += '<div class="' + barClass + '" style="height:' + height + 'px" data-index="' + idx + '"><span class="bar-value">' + val + '</span></div>';
    });
    
    barsContainer.innerHTML = html;
}

function renderStep() {
    if (!currentAlgorithm) return;
    const step = currentAlgorithm.steps[currentStep];
    stepDescription.textContent = step.description;
    highlightCodeLines(step.step);
    resultDisplay.style.display = 'none';
    
    renderBars(step);
    
    // Update stats
    let stats = 'Array: [' + step.array.join(', ') + ']';
    if (step.comparisons) stats += '\nComparisons: ' + step.comparisons;
    if (step.swaps) stats += '\nSwaps: ' + step.swaps;
    statsInfo.textContent = stats;
    
    if (step.action === 'complete') {
        resultDisplay.style.display = 'block';
        resultDisplay.textContent = 'Sorted!';
    }
    
    progressFill.style.width = ((currentStep + 1) / currentAlgorithm.steps.length * 100) + '%';
    stepCounter.textContent = 'Step ' + (currentStep + 1) + ' / ' + currentAlgorithm.steps.length;
}

function updateControls() {
    document.getElementById('prevBtn').disabled = !currentAlgorithm || currentStep === 0;
    document.getElementById('nextBtn').disabled = !currentAlgorithm || currentStep >= currentAlgorithm.steps.length - 1;
    document.getElementById('playBtn').disabled = !currentAlgorithm;
}

function nextStep() {
    if (currentAlgorithm && currentStep < currentAlgorithm.steps.length - 1) { currentStep++; renderStep(); updateControls(); }
    else stopPlaying();
}

function prevStep() {
    if (currentAlgorithm && currentStep > 0) { currentStep--; renderStep(); updateControls(); }
}

function togglePlay() { if (isPlaying) stopPlaying(); else startPlaying(); }

function startPlaying() {
    isPlaying = true;
    playBtn.textContent = 'Pause';
    playBtn.classList.add('playing');
    playInterval = setInterval(() => {
        if (currentStep < currentAlgorithm.steps.length - 1) nextStep();
        else stopPlaying();
    }, 2200 - document.getElementById('speedSlider').value);
}

function stopPlaying() {
    isPlaying = false;
    playBtn.textContent = 'Play';
    playBtn.classList.remove('playing');
    if (playInterval) { clearInterval(playInterval); playInterval = null; }
}

function reset() { stopPlaying(); currentStep = 0; renderStep(); updateControls(); }

function updateCamera() {
    stage.style.transform = 'translateZ(' + cameraZoom + 'px) rotateX(' + cameraRotX + 'deg) rotateY(' + cameraRotY + 'deg)';
}

scene.addEventListener('mousedown', (e) => { isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY; });
document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    cameraRotY += (e.clientX - lastMouseX) * 0.5;
    cameraRotX -= (e.clientY - lastMouseY) * 0.3;
    cameraRotX = Math.max(-60, Math.min(60, cameraRotX));
    lastMouseX = e.clientX; lastMouseY = e.clientY;
    updateCamera();
});
document.addEventListener('mouseup', () => { isDragging = false; });
scene.addEventListener('wheel', (e) => { e.preventDefault(); cameraZoom += e.deltaY * -0.5; cameraZoom = Math.max(-300, Math.min(200, cameraZoom)); updateCamera(); });

document.getElementById('playBtn').onclick = togglePlay;
document.getElementById('prevBtn').onclick = prevStep;
document.getElementById('nextBtn').onclick = nextStep;
document.getElementById('resetBtn').onclick = reset;
document.getElementById('speedSlider').oninput = () => { if (isPlaying) { stopPlaying(); startPlaying(); } };

initAlgorithmSelector();
updateCamera();
    </script>
</body>
</html>
