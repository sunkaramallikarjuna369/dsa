<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hashing & Sets/Maps - 3D Visualization</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 50%, #0d0d2a 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header {
            text-align: center;
            padding: 30px 0;
            background: rgba(0, 255, 255, 0.05);
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle { color: #888; font-size: 1.1em; }
        .algorithm-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .algo-btn {
            padding: 12px 20px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #00ffff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .algo-btn:hover, .algo-btn.active {
            background: rgba(0, 255, 255, 0.2);
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }
        .visualization-area {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            min-height: 450px;
        }
        .step-description {
            text-align: center;
            font-size: 1.2em;
            color: #00ffff;
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(0, 255, 255, 0.1);
            border-radius: 10px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .control-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #00ffff 0%, #0088aa 100%);
            border: none;
            color: #000;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .control-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(0, 255, 255, 0.5); }
        .control-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .progress-bar { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; margin-bottom: 20px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00ffff, #ff00ff); border-radius: 3px; transition: width 0.3s ease; }
        .step-counter { text-align: center; color: #888; margin-bottom: 20px; }

        /* Hash Table Visualization */
        .hash-table-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
        }
        .hash-input {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .input-box {
            padding: 15px 30px;
            background: rgba(255, 215, 0, 0.2);
            border: 2px solid #ffd700;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
        }
        .hash-arrow {
            font-size: 2em;
            color: #00ffff;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .hash-function {
            padding: 10px 20px;
            background: rgba(255, 0, 255, 0.2);
            border: 2px solid #ff00ff;
            border-radius: 10px;
            font-family: monospace;
        }
        .buckets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
        }
        .bucket {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            padding: 15px;
            min-height: 100px;
            transition: all 0.3s ease;
        }
        .bucket.active {
            border-color: #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
        }
        .bucket.collision {
            border-color: #ff6600;
            box-shadow: 0 0 30px rgba(255, 102, 0, 0.4);
        }
        .bucket-index {
            color: #888;
            font-size: 0.8em;
            margin-bottom: 10px;
            text-align: center;
        }
        .bucket-items {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .bucket-item {
            background: linear-gradient(135deg, #00ffff33, #00888833);
            border: 1px solid #00ffff;
            border-radius: 5px;
            padding: 8px;
            text-align: center;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }
        .bucket-item.new {
            animation: fadeIn 0.5s ease;
            border-color: #ffd700;
            background: linear-gradient(135deg, #ffd70033, #cc990033);
        }
        .bucket-item.probing {
            border-color: #ff6600;
            background: linear-gradient(135deg, #ff660033, #cc440033);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Set Operations */
        .set-container {
            display: flex;
            justify-content: center;
            gap: 50px;
            flex-wrap: wrap;
            padding: 20px;
        }
        .set-circle {
            width: 200px;
            height: 200px;
            border: 3px solid #00ffff;
            border-radius: 50%;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            position: relative;
            background: rgba(0, 255, 255, 0.05);
        }
        .set-label {
            position: absolute;
            top: -30px;
            font-weight: bold;
            color: #00ffff;
        }
        .set-element {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #00ffff, #0088aa);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
            font-size: 0.9em;
        }
        .set-element.highlight {
            background: linear-gradient(135deg, #ffd700, #cc9900);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        .set-element.intersection {
            background: linear-gradient(135deg, #00ff00, #008800);
        }

        /* Info Panel */
        .info-panel {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .info-box {
            background: rgba(0, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px 25px;
            text-align: center;
        }
        .info-label { color: #888; font-size: 0.9em; }
        .info-value { color: #00ffff; font-size: 1.3em; font-weight: bold; margin-top: 5px; }

        .speed-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        .speed-label { color: #888; }
        .speed-slider {
            width: 150px;
            -webkit-appearance: none;
            height: 6px;
            background: rgba(0, 255, 255, 0.2);
            border-radius: 3px;
        }
        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #00ffff;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>Hashing & Sets/Maps</h1>
        <p class="subtitle">Interactive 3D Visualization</p>
    </header>
    <div class="container">
        <div class="algorithm-selector" id="algoSelector"></div>
        <div class="visualization-area">
            <div class="step-description" id="stepDesc">Select an algorithm to begin</div>
            <div id="vizContent"></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
        <div class="step-counter" id="stepCounter">Step 0 / 0</div>
        <div class="controls">
            <button class="control-btn" id="prevBtn" disabled>Previous</button>
            <button class="control-btn" id="playBtn">Play</button>
            <button class="control-btn" id="nextBtn" disabled>Next</button>
            <button class="control-btn" id="resetBtn">Reset</button>
        </div>
        <div class="speed-control">
            <span class="speed-label">Speed:</span>
            <input type="range" class="speed-slider" id="speedSlider" min="100" max="2000" value="800">
            <span class="speed-label" id="speedValue">800ms</span>
        </div>
    </div>

    <script>
        const visualData = {
            "world": "05_hashing_and_sets_maps",
            "algorithms": [
                {
                    "algorithm": "hash_table_insert",
                    "description": "Insert elements into hash table with separate chaining",
                    "table_size": 7,
                    "steps": [
                        {"step": 1, "description": "Initialize hash table with 7 buckets", "buckets": [[],[],[],[],[],[],[]], "action": "init"},
                        {"step": 2, "description": "Insert 15: hash(15) = 15 % 7 = 1", "key": 15, "hash": 1, "buckets": [[],[15],[],[],[],[],[]], "action": "insert"},
                        {"step": 3, "description": "Insert 22: hash(22) = 22 % 7 = 1 (collision!)", "key": 22, "hash": 1, "buckets": [[],[15,22],[],[],[],[],[]], "collision": true, "action": "insert"},
                        {"step": 4, "description": "Insert 8: hash(8) = 8 % 7 = 1 (another collision!)", "key": 8, "hash": 1, "buckets": [[],[15,22,8],[],[],[],[],[]], "collision": true, "action": "insert"},
                        {"step": 5, "description": "Insert 35: hash(35) = 35 % 7 = 0", "key": 35, "hash": 0, "buckets": [[35],[15,22,8],[],[],[],[],[]], "action": "insert"},
                        {"step": 6, "description": "Insert 27: hash(27) = 27 % 7 = 6", "key": 27, "hash": 6, "buckets": [[35],[15,22,8],[],[],[],[],[27]], "action": "insert"},
                        {"step": 7, "description": "Insert 10: hash(10) = 10 % 7 = 3", "key": 10, "hash": 3, "buckets": [[35],[15,22,8],[],[10],[],[],[27]], "action": "insert"},
                        {"step": 8, "description": "Hash table complete - load factor = 6/7", "buckets": [[35],[15,22,8],[],[10],[],[],[27]], "load_factor": 0.86, "action": "complete"}
                    ]
                },
                {
                    "algorithm": "hash_table_search",
                    "description": "Search for element in hash table",
                    "table_size": 7,
                    "steps": [
                        {"step": 1, "description": "Hash table state - search for 22", "buckets": [[35],[15,22,8],[],[10],[],[],[27]], "target": 22, "action": "init"},
                        {"step": 2, "description": "Calculate hash(22) = 22 % 7 = 1", "target": 22, "hash": 1, "action": "hash"},
                        {"step": 3, "description": "Go to bucket 1, check first element: 15 != 22", "bucket": 1, "checking": 15, "action": "check"},
                        {"step": 4, "description": "Check next in chain: 22 == 22 FOUND!", "bucket": 1, "checking": 22, "found": true, "action": "found"},
                        {"step": 5, "description": "Element 22 found in bucket 1, position 2", "result": "found", "complexity": "O(1) average", "action": "complete"}
                    ]
                },
                {
                    "algorithm": "open_addressing",
                    "description": "Linear probing for collision resolution",
                    "table_size": 7,
                    "steps": [
                        {"step": 1, "description": "Initialize hash table (open addressing)", "table": [null,null,null,null,null,null,null], "action": "init"},
                        {"step": 2, "description": "Insert 15: hash(15) = 1, slot 1 empty", "key": 15, "hash": 1, "table": [null,15,null,null,null,null,null], "action": "insert"},
                        {"step": 3, "description": "Insert 22: hash(22) = 1, collision! Probe to slot 2", "key": 22, "hash": 1, "probe": 2, "table": [null,15,22,null,null,null,null], "collision": true, "action": "insert"},
                        {"step": 4, "description": "Insert 8: hash(8) = 1, collision! Probe 2 occupied, probe to 3", "key": 8, "hash": 1, "probe": 3, "table": [null,15,22,8,null,null,null], "collision": true, "action": "insert"},
                        {"step": 5, "description": "Insert 35: hash(35) = 0, slot 0 empty", "key": 35, "hash": 0, "table": [35,15,22,8,null,null,null], "action": "insert"},
                        {"step": 6, "description": "Insert 10: hash(10) = 3, collision! Probe to 4", "key": 10, "hash": 3, "probe": 4, "table": [35,15,22,8,10,null,null], "collision": true, "action": "insert"},
                        {"step": 7, "description": "Open addressing complete", "table": [35,15,22,8,10,null,null], "action": "complete"}
                    ]
                },
                {
                    "algorithm": "set_operations",
                    "description": "Set union, intersection, and difference",
                    "steps": [
                        {"step": 1, "description": "Set A = {1, 2, 3, 4}, Set B = {3, 4, 5, 6}", "setA": [1,2,3,4], "setB": [3,4,5,6], "action": "init"},
                        {"step": 2, "description": "Union: A | B - combine all unique elements", "setA": [1,2,3,4], "setB": [3,4,5,6], "result": [1,2,3,4,5,6], "operation": "union", "action": "operation"},
                        {"step": 3, "description": "Intersection: A & B - elements in both sets", "setA": [1,2,3,4], "setB": [3,4,5,6], "result": [3,4], "highlight": [3,4], "operation": "intersection", "action": "operation"},
                        {"step": 4, "description": "Difference: A - B - elements only in A", "setA": [1,2,3,4], "setB": [3,4,5,6], "result": [1,2], "highlight": [1,2], "operation": "difference", "action": "operation"},
                        {"step": 5, "description": "Symmetric Difference: A ^ B - elements in either but not both", "setA": [1,2,3,4], "setB": [3,4,5,6], "result": [1,2,5,6], "operation": "symmetric_diff", "action": "operation"},
                        {"step": 6, "description": "Set operations complete - all O(n) time", "action": "complete"}
                    ]
                }
            ]
        };

        let currentAlgo = null;
        let currentStep = 0;
        let isPlaying = false;
        let playInterval = null;
        let speed = 800;

        function init() {
            const selector = document.getElementById('algoSelector');
            visualData.algorithms.forEach((algo, index) => {
                const btn = document.createElement('button');
                btn.className = 'algo-btn';
                btn.textContent = algo.algorithm.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                btn.onclick = () => selectAlgorithm(index);
                selector.appendChild(btn);
            });
            document.getElementById('prevBtn').onclick = prevStep;
            document.getElementById('nextBtn').onclick = nextStep;
            document.getElementById('playBtn').onclick = togglePlay;
            document.getElementById('resetBtn').onclick = reset;
            document.getElementById('speedSlider').oninput = (e) => {
                speed = 2100 - e.target.value;
                document.getElementById('speedValue').textContent = speed + 'ms';
            };
        }

        function selectAlgorithm(index) {
            document.querySelectorAll('.algo-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
            currentAlgo = visualData.algorithms[index];
            currentStep = 0;
            stopPlay();
            renderStep();
            updateControls();
        }

        function renderStep() {
            if (!currentAlgo) return;
            const step = currentAlgo.steps[currentStep];
            document.getElementById('stepDesc').textContent = step.description;
            document.getElementById('stepCounter').textContent = `Step ${currentStep + 1} / ${currentAlgo.steps.length}`;
            document.getElementById('progressFill').style.width = ((currentStep + 1) / currentAlgo.steps.length * 100) + '%';

            const content = document.getElementById('vizContent');
            
            switch(currentAlgo.algorithm) {
                case 'hash_table_insert':
                case 'hash_table_search':
                    renderHashTableChaining(content, step);
                    break;
                case 'open_addressing':
                    renderOpenAddressing(content, step);
                    break;
                case 'set_operations':
                    renderSetOperations(content, step);
                    break;
            }
        }

        function renderHashTableChaining(container, step) {
            const buckets = step.buckets || [];
            const activeHash = step.hash;
            const isCollision = step.collision;
            const newKey = step.key;
            const checking = step.checking;

            let html = '<div class="hash-table-container">';
            
            if (step.key !== undefined || step.target !== undefined) {
                html += `<div class="hash-input">
                    <div class="input-box">${step.key || step.target}</div>
                    <span class="hash-arrow">→</span>
                    <div class="hash-function">hash(${step.key || step.target}) % 7 = ${step.hash}</div>
                </div>`;
            }
            
            html += '<div class="buckets-grid">';
            buckets.forEach((bucket, i) => {
                const isActive = i === activeHash;
                html += `<div class="bucket ${isActive ? (isCollision ? 'collision' : 'active') : ''}">
                    <div class="bucket-index">Bucket ${i}</div>
                    <div class="bucket-items">
                        ${bucket.map(item => {
                            const isNew = item === newKey && isActive;
                            const isChecking = item === checking;
                            const isFound = item === checking && step.found;
                            return `<div class="bucket-item ${isNew ? 'new' : ''} ${isChecking ? 'probing' : ''}" style="${isFound ? 'background: linear-gradient(135deg, #00ff0033, #00880033); border-color: #00ff00;' : ''}">${item}</div>`;
                        }).join('')}
                        ${bucket.length === 0 ? '<div style="color: #666; font-size: 0.8em;">empty</div>' : ''}
                    </div>
                </div>`;
            });
            html += '</div></div>';
            
            html += '<div class="info-panel">';
            if (step.load_factor) html += `<div class="info-box"><div class="info-label">Load Factor</div><div class="info-value">${step.load_factor.toFixed(2)}</div></div>`;
            if (step.complexity) html += `<div class="info-box"><div class="info-label">Complexity</div><div class="info-value">${step.complexity}</div></div>`;
            if (isCollision) html += `<div class="info-box"><div class="info-label">Status</div><div class="info-value" style="color:#ff6600;">COLLISION!</div></div>`;
            html += '</div>';
            
            container.innerHTML = html;
        }

        function renderOpenAddressing(container, step) {
            const table = step.table || [];
            const activeHash = step.hash;
            const probe = step.probe;
            const newKey = step.key;
            const isCollision = step.collision;

            let html = '<div class="hash-table-container">';
            
            if (step.key !== undefined) {
                html += `<div class="hash-input">
                    <div class="input-box">${step.key}</div>
                    <span class="hash-arrow">→</span>
                    <div class="hash-function">hash(${step.key}) % 7 = ${step.hash}${probe !== undefined ? ` → probe ${probe}` : ''}</div>
                </div>`;
            }
            
            html += '<div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">';
            table.forEach((val, i) => {
                const isActive = i === activeHash || i === probe;
                const isProbed = i === probe;
                const hasNew = val === newKey;
                html += `<div class="bucket ${isActive ? (isCollision && i === activeHash ? 'collision' : 'active') : ''}" style="min-height: 80px; width: 80px;">
                    <div class="bucket-index">[${i}]</div>
                    <div class="bucket-items">
                        ${val !== null ? `<div class="bucket-item ${hasNew ? 'new' : ''} ${isProbed && isCollision ? 'probing' : ''}">${val}</div>` : '<div style="color: #666;">-</div>'}
                    </div>
                </div>`;
            });
            html += '</div></div>';
            
            if (isCollision) {
                html += '<div class="info-panel"><div class="info-box"><div class="info-label">Status</div><div class="info-value" style="color:#ff6600;">Linear Probing</div></div></div>';
            }
            
            container.innerHTML = html;
        }

        function renderSetOperations(container, step) {
            const setA = step.setA || [];
            const setB = step.setB || [];
            const result = step.result || [];
            const highlight = step.highlight || [];
            const operation = step.operation;

            let html = '<div class="set-container">';
            
            html += `<div class="set-circle">
                <div class="set-label">Set A</div>
                ${setA.map(el => `<div class="set-element ${highlight.includes(el) ? 'highlight' : ''} ${operation === 'intersection' && [3,4].includes(el) ? 'intersection' : ''}">${el}</div>`).join('')}
            </div>`;
            
            html += `<div class="set-circle" style="border-color: #ff00ff; background: rgba(255, 0, 255, 0.05);">
                <div class="set-label" style="color: #ff00ff;">Set B</div>
                ${setB.map(el => `<div class="set-element ${highlight.includes(el) ? 'highlight' : ''} ${operation === 'intersection' && [3,4].includes(el) ? 'intersection' : ''}" style="background: linear-gradient(135deg, #ff00ff, #880088);">${el}</div>`).join('')}
            </div>`;
            
            html += '</div>';
            
            if (result.length > 0) {
                html += `<div style="text-align: center; margin-top: 30px;">
                    <div style="color: #888; margin-bottom: 10px;">${operation ? operation.replace('_', ' ').toUpperCase() : 'Result'}:</div>
                    <div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
                        ${result.map(el => `<div class="set-element" style="background: linear-gradient(135deg, #ffd700, #cc9900);">${el}</div>`).join('')}
                    </div>
                </div>`;
            }
            
            container.innerHTML = html;
        }

        function nextStep() { if (currentAlgo && currentStep < currentAlgo.steps.length - 1) { currentStep++; renderStep(); updateControls(); } }
        function prevStep() { if (currentAlgo && currentStep > 0) { currentStep--; renderStep(); updateControls(); } }
        function togglePlay() { isPlaying ? stopPlay() : startPlay(); }
        function startPlay() {
            if (!currentAlgo) return;
            isPlaying = true;
            document.getElementById('playBtn').textContent = 'Pause';
            playInterval = setInterval(() => { currentStep < currentAlgo.steps.length - 1 ? nextStep() : stopPlay(); }, speed);
        }
        function stopPlay() {
            isPlaying = false;
            document.getElementById('playBtn').textContent = 'Play';
            if (playInterval) { clearInterval(playInterval); playInterval = null; }
        }
        function reset() { stopPlay(); currentStep = 0; renderStep(); updateControls(); }
        function updateControls() {
            document.getElementById('prevBtn').disabled = !currentAlgo || currentStep === 0;
            document.getElementById('nextBtn').disabled = !currentAlgo || currentStep >= currentAlgo.steps.length - 1;
        }
        init();
    </script>
</body>
</html>
