<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hashing & Sets/Maps - 3D Visualization</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header {
            text-align: center;
            padding: 25px 0;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(255, 0, 255, 0.1));
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            margin-bottom: 25px;
        }
        h1 {
            font-size: 2.2rem;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 3s linear infinite;
        }
        @keyframes gradient-shift {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        .subtitle { color: #888; font-size: 1rem; margin-top: 8px; }
        .algorithm-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 25px;
        }
        .algo-btn {
            padding: 10px 18px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #00ffff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        .algo-btn:hover {
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }
        .algo-btn.active {
            background: linear-gradient(135deg, #00ffff, #0088aa);
            color: #000;
            font-weight: bold;
        }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
        }
        @media (max-width: 1200px) {
            .main-content { grid-template-columns: 1fr; }
        }
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .visualization-area {
            background: radial-gradient(ellipse at center, #0f0f1a 0%, #050508 70%, #000 100%);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            overflow: hidden;
            position: relative;
        }
        .scene {
            width: 100%;
            height: 380px;
            perspective: 1200px;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }
        .scene:active { cursor: grabbing; }
        .stage {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform-origin: 50% 50%;
            transition: transform 0.1s ease-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .viz-container {
            transform-style: preserve-3d;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .hash-table {
            display: flex;
            gap: 8px;
            transform-style: preserve-3d;
        }
        .bucket {
            width: 70px;
            min-height: 100px;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            gap: 6px;
            transition: all 0.4s ease;
        }
        .bucket.active {
            border-color: #00ffff;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.5);
            transform: translateZ(20px);
        }
        .bucket.collision {
            border-color: #ff6b6b;
            box-shadow: 0 0 25px rgba(255, 107, 107, 0.5);
        }
        .bucket-index {
            font-size: 0.7rem;
            color: #888;
            margin-bottom: 5px;
        }
        .hash-item {
            width: 55px;
            padding: 6px;
            background: linear-gradient(135deg, #0a2a2a, #0f1f1f);
            border: 2px solid #00ffff;
            border-radius: 8px;
            font-size: 0.75rem;
            text-align: center;
            color: #fff;
            transition: all 0.3s ease;
        }
        .hash-item.inserting {
            animation: insert-glow 0.5s ease-out;
            border-color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
        }
        @keyframes insert-glow {
            0% { transform: scale(0) translateY(-30px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .hash-item.found {
            border-color: #00ff88;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.7);
        }
        .hash-item.checking {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        .array-display {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .array-item {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            border: 2px solid rgba(0, 255, 255, 0.4);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .array-item.current {
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            transform: translateY(-5px);
        }
        .array-item.found {
            border-color: #00ff88;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.6);
        }
        .array-value { font-size: 1.1rem; font-weight: bold; color: #fff; }
        .array-index { font-size: 0.65rem; color: #888; }
        .code-panel {
            background: linear-gradient(135deg, #0d0d15, #1a1a25);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
        }
        .code-title {
            font-size: 0.8rem;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .code-title::before {
            content: "</>";
            color: #ff00ff;
            font-weight: bold;
        }
        .code-block {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.8rem;
            line-height: 1.6;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
        }
        .code-line {
            padding: 2px 8px;
            border-radius: 4px;
            transition: all 0.3s ease;
            white-space: pre;
        }
        .code-line.active {
            background: rgba(0, 255, 255, 0.2);
            border-left: 3px solid #00ffff;
        }
        .code-line.executed {
            background: rgba(0, 255, 136, 0.1);
            border-left: 3px solid #00ff88;
        }
        .code-keyword { color: #ff79c6; }
        .code-function { color: #50fa7b; }
        .code-string { color: #f1fa8c; }
        .code-number { color: #bd93f9; }
        .code-comment { color: #6272a4; }
        .code-variable { color: #8be9fd; }
        .info-panel {
            background: linear-gradient(135deg, #0f0f1a, #1a1a2e);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            padding: 20px;
        }
        .panel-section { margin-bottom: 20px; }
        .panel-title {
            font-size: 0.8rem;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-title::before {
            content: "";
            width: 4px;
            height: 14px;
            background: linear-gradient(180deg, #00ffff, #ff00ff);
            border-radius: 2px;
        }
        .step-description {
            font-size: 1rem;
            line-height: 1.5;
            color: #e0e0e0;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border-left: 3px solid #00ffff;
        }
        .complexity-badge {
            display: inline-block;
            padding: 5px 12px;
            background: linear-gradient(135deg, rgba(255, 0, 255, 0.2), rgba(0, 255, 255, 0.2));
            border: 1px solid rgba(255, 0, 255, 0.4);
            border-radius: 15px;
            font-size: 0.85rem;
            color: #ff00ff;
            font-weight: bold;
        }
        .hashmap-display {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.85rem;
        }
        .hashmap-entry {
            padding: 4px 8px;
            margin: 2px 0;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        .hashmap-entry.new {
            background: rgba(0, 255, 136, 0.2);
            border-left: 3px solid #00ff88;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(0, 255, 255, 0.2);
        }
        .control-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid rgba(0, 255, 255, 0.4);
            color: #00ffff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        .control-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #00ffff, #0088aa);
            color: #000;
        }
        .control-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .control-btn.playing {
            background: linear-gradient(135deg, #ff00ff, #aa0088);
            border-color: #ff00ff;
        }
        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }
        .speed-label { color: #888; font-size: 0.85rem; }
        .speed-slider {
            width: 100px;
            height: 5px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            border-radius: 3px;
        }
        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }
        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 12px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            transition: width 0.3s ease;
        }
        .step-counter {
            text-align: center;
            color: #888;
            font-size: 0.85rem;
            margin-top: 8px;
        }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
        }
        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            border: 2px solid;
        }
        .result-display {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 12px 20px;
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 255, 136, 0.1));
            border: 2px solid #00ff88;
            border-radius: 10px;
            font-size: 1rem;
            color: #00ff88;
            font-weight: bold;
            display: none;
        }
        .camera-hint {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.75rem;
        }
    </style>

<body>
    <header>
        <h1>Hashing & Sets/Maps</h1>

    </header>
    <div class="container">

    <script>
const codeSnippets = {
    "hash_insert_chaining": `<span class="code-keyword">class</span> <span class="code-function">HashTable</span>:
    <span class="code-keyword">def</span> <span class="code-function">__init__</span>(<span class="code-variable">self</span>, size=<span class="code-number">8</span>):
        <span class="code-variable">self</span>.buckets = [[] <span class="code-keyword">for</span> _ <span class="code-keyword">in</span> range(size)]
    
    <span class="code-keyword">def</span> <span class="code-function">_hash</span>(<span class="code-variable">self</span>, key):
        <span class="code-keyword">return</span> hash(key) % len(<span class="code-variable">self</span>.buckets)
    
    <span class="code-keyword">def</span> <span class="code-function">insert</span>(<span class="code-variable">self</span>, key, value):
        idx = <span class="code-variable">self</span>._hash(key)  <span class="code-comment"># Compute bucket index</span>
        bucket = <span class="code-variable">self</span>.buckets[idx]
        <span class="code-keyword">for</span> i, (k, v) <span class="code-keyword">in</span> enumerate(bucket):
            <span class="code-keyword">if</span> k == key:  <span class="code-comment"># Update existing</span>
                bucket[i] = (key, value)
                <span class="code-keyword">return</span>
        bucket.append((key, value))  <span class="code-comment"># Add to chain</span>`,
    "two_sum_hashmap": `<span class="code-keyword">def</span> <span class="code-function">two_sum</span>(nums, target):
    <span class="code-variable">hashmap</span> = {}  <span class="code-comment"># value -> index</span>
    
    <span class="code-keyword">for</span> i, num <span class="code-keyword">in</span> enumerate(nums):
        complement = target - num
        
        <span class="code-keyword">if</span> complement <span class="code-keyword">in</span> <span class="code-variable">hashmap</span>:
            <span class="code-comment"># Found! Return indices</span>
            <span class="code-keyword">return</span> [<span class="code-variable">hashmap</span>[complement], i]
        
        <span class="code-comment"># Store current number and index</span>
        <span class="code-variable">hashmap</span>[num] = i
    
    <span class="code-keyword">return</span> []  <span class="code-comment"># No solution</span>`,
    "hash_lookup_chaining": `<span class="code-keyword">def</span> <span class="code-function">lookup</span>(<span class="code-variable">self</span>, key):
    idx = <span class="code-variable">self</span>._hash(key)  <span class="code-comment"># Compute bucket</span>
    bucket = <span class="code-variable">self</span>.buckets[idx]
    
    <span class="code-keyword">for</span> k, v <span class="code-keyword">in</span> bucket:  <span class="code-comment"># Search chain</span>
        <span class="code-keyword">if</span> k == key:
            <span class="code-keyword">return</span> v  <span class="code-comment"># Found!</span>
    
    <span class="code-keyword">return</span> <span class="code-keyword">None</span>  <span class="code-comment"># Not found</span>`,
    "hash_insert_linear_probing": `<span class="code-keyword">def</span> <span class="code-function">insert</span>(<span class="code-variable">self</span>, key):
    idx = <span class="code-variable">self</span>._hash(key)
    
    <span class="code-keyword">while</span> <span class="code-variable">self</span>.buckets[idx] <span class="code-keyword">is not</span> <span class="code-keyword">None</span>:
        <span class="code-comment"># Collision! Linear probe</span>
        idx = (idx + <span class="code-number">1</span>) % len(<span class="code-variable">self</span>.buckets)
    
    <span class="code-variable">self</span>.buckets[idx] = key  <span class="code-comment"># Insert</span>`,
    "set_operations": `<span class="code-variable">set_a</span> = {<span class="code-number">1</span>, <span class="code-number">2</span>, <span class="code-number">3</span>, <span class="code-number">4</span>}
<span class="code-variable">set_b</span> = {<span class="code-number">3</span>, <span class="code-number">4</span>, <span class="code-number">5</span>, <span class="code-number">6</span>}

<span class="code-comment"># Union: all unique elements</span>
union = <span class="code-variable">set_a</span> | <span class="code-variable">set_b</span>  <span class="code-comment"># {1,2,3,4,5,6}</span>

<span class="code-comment"># Intersection: common elements</span>
inter = <span class="code-variable">set_a</span> & <span class="code-variable">set_b</span>  <span class="code-comment"># {3, 4}</span>

<span class="code-comment"># Difference: in A but not B</span>
diff = <span class="code-variable">set_a</span> - <span class="code-variable">set_b</span>  <span class="code-comment"># {1, 2}</span>`,
    "hash_resize": `<span class="code-keyword">def</span> <span class="code-function">_resize</span>(<span class="code-variable">self</span>):
    old = <span class="code-variable">self</span>.buckets
    <span class="code-variable">self</span>.buckets = [<span class="code-keyword">None</span>] * (len(old) * <span class="code-number">2</span>)
    
    <span class="code-keyword">for</span> item <span class="code-keyword">in</span> old:
        <span class="code-keyword">if</span> item <span class="code-keyword">is not</span> <span class="code-keyword">None</span>:
            <span class="code-comment"># Rehash into new table</span>
            <span class="code-variable">self</span>.insert(item)`
};

const visualData = {"algorithms":[{"algorithm":"hash_insert_chaining","name":"Hash Insert (Chaining)","complexity":"O(1) avg","steps":[{"step":1,"description":"Initialize empty hash table with 8 buckets. Each bucket can hold a chain (linked list) of key-value pairs.","action":"init","buckets":[[],[],[],[],[],[],[],[]]},{"step":2,"description":"Insert 'apple'. Compute hash: hash('apple') % 8 = 1. The hash function maps the key to bucket index 1.","action":"hash","key":"apple","bucket":1,"buckets":[[],[],[],[],[],[],[],[]]},{"step":3,"description":"Insert 'apple':10 into bucket 1. The bucket was empty, so we just add it to the chain.","action":"insert","key":"apple","value":10,"bucket":1,"buckets":[[],[["apple",10]],[],[],[],[],[],[]]},{"step":4,"description":"Insert 'banana'. Compute hash: hash('banana') % 8 = 2. Different key, different bucket.","action":"hash","key":"banana","bucket":2,"buckets":[[],[["apple",10]],[],[],[],[],[],[]]},{"step":5,"description":"Insert 'banana':20 into bucket 2. No collision here either.","action":"insert","key":"banana","value":20,"bucket":2,"buckets":[[],[["apple",10]],[["banana",20]],[],[],[],[],[]]},{"step":6,"description":"Insert 'apricot'. Compute hash: hash('apricot') % 8 = 1. Same bucket as 'apple'! This is a COLLISION.","action":"hash","key":"apricot","bucket":1,"collision":true,"buckets":[[],[["apple",10]],[["banana",20]],[],[],[],[],[]]},{"step":7,"description":"COLLISION at bucket 1! With separate chaining, we simply add to the chain. No need to find another bucket.","action":"collision","bucket":1,"buckets":[[],[["apple",10]],[["banana",20]],[],[],[],[],[]]},{"step":8,"description":"Append 'apricot':30 to the chain in bucket 1. Now bucket 1 has two items. Lookup may need to traverse the chain.","action":"insert","key":"apricot","value":30,"bucket":1,"buckets":[[],[["apple",10],["apricot",30]],[["banana",20]],[],[],[],[],[]]}]},{"algorithm":"two_sum_hashmap","name":"Two Sum (Hash Map)","complexity":"O(n)","input":{"array":[2,7,11,15],"target":9},"steps":[{"step":1,"description":"Find two numbers that sum to 9. We'll use a hash map to store seen numbers. This gives O(n) instead of O(n²)!","action":"init","array":[2,7,11,15],"target":9,"hashmap":{}},{"step":2,"description":"Process nums[0]=2. We need complement = 9-2 = 7. Is 7 in our hash map?","action":"process","index":0,"value":2,"complement":7,"hashmap":{}},{"step":3,"description":"7 is NOT in hash map (it's empty). Store {2: 0} so we can find it later if needed.","action":"lookup_miss","key":7,"hashmap":{}},{"step":4,"description":"Add 2 to hash map with its index. hashmap = {2: 0}. Now if we see 7 later, we know 2 is at index 0.","action":"store","key":2,"value":0,"hashmap":{"2":0}},{"step":5,"description":"Process nums[1]=7. We need complement = 9-7 = 2. Is 2 in our hash map?","action":"process","index":1,"value":7,"complement":2,"hashmap":{"2":0}},{"step":6,"description":"YES! 2 IS in hash map at index 0! We found our pair: nums[0] + nums[1] = 2 + 7 = 9","action":"lookup_hit","key":2,"found_index":0,"hashmap":{"2":0}},{"step":7,"description":"SOLUTION FOUND! Return indices [0, 1]. The hash map let us find the complement in O(1) time!","action":"solution","indices":[0,1],"values":[2,7]}]},{"algorithm":"hash_lookup_chaining","name":"Hash Lookup (Chaining)","complexity":"O(1) avg","steps":[{"step":1,"description":"Look up 'apricot' in our hash table. First, we compute the hash to find which bucket to search.","action":"start","key":"apricot","buckets":[[],[["apple",10],["apricot",30]],[["banana",20]],[],[],[],[],[]]},{"step":2,"description":"Compute hash: hash('apricot') % 8 = 1. Go to bucket 1.","action":"hash","key":"apricot","bucket":1,"buckets":[[],[["apple",10],["apricot",30]],[["banana",20]],[],[],[],[],[]]},{"step":3,"description":"Bucket 1 has a chain with 2 items. Check first item: 'apple'. Does 'apple' == 'apricot'? No.","action":"check","key":"apricot","checking":"apple","match":false,"bucket":1},{"step":4,"description":"Check second item: 'apricot'. Does 'apricot' == 'apricot'? YES! Found it!","action":"check","key":"apricot","checking":"apricot","match":true,"bucket":1},{"step":5,"description":"Return value 30. Lookup complete! Average O(1), but worst case O(n) if all keys hash to same bucket.","action":"found","key":"apricot","value":30}]},{"algorithm":"set_operations","name":"Set Operations","complexity":"O(n+m)","steps":[{"step":1,"description":"Two sets: A = {1,2,3,4} and B = {3,4,5,6}. Sets are implemented using hash tables for O(1) membership testing.","action":"init","set_a":[1,2,3,4],"set_b":[3,4,5,6]},{"step":2,"description":"UNION (A | B): Combine all unique elements from both sets.","action":"union_start","set_a":[1,2,3,4],"set_b":[3,4,5,6]},{"step":3,"description":"Union result: {1, 2, 3, 4, 5, 6}. Every element appears exactly once.","action":"union_result","result":[1,2,3,4,5,6]},{"step":4,"description":"INTERSECTION (A & B): Find elements that exist in BOTH sets.","action":"intersection_start","set_a":[1,2,3,4],"set_b":[3,4,5,6]},{"step":5,"description":"Intersection result: {3, 4}. Only 3 and 4 appear in both sets.","action":"intersection_result","result":[3,4]},{"step":6,"description":"DIFFERENCE (A - B): Find elements in A that are NOT in B.","action":"difference_start","set_a":[1,2,3,4],"set_b":[3,4,5,6]},{"step":7,"description":"Difference result: {1, 2}. These are in A but not in B.","action":"difference_result","result":[1,2]}]}]};

let currentAlgorithm = null;
let currentStep = 0;
let isPlaying = false;
let playInterval = null;
let cameraRotX = 10;
let cameraRotY = 0;
let cameraZoom = 0;
let isDragging = false;
let lastMouseX = 0;
let lastMouseY = 0;

const scene = document.getElementById('scene');
const stage = document.getElementById('stage');
const vizContainer = document.getElementById('vizContainer');
const codeBlock = document.getElementById('codeBlock');
const stepDescription = document.getElementById('stepDescription');
const complexityBadge = document.getElementById('complexityBadge');
const hashmapDisplay = document.getElementById('hashmapDisplay');
const progressFill = document.getElementById('progressFill');
const stepCounter = document.getElementById('stepCounter');
const playBtn = document.getElementById('playBtn');
const resultDisplay = document.getElementById('resultDisplay');

function initAlgorithmSelector() {
    const selector = document.getElementById('algoSelector');
    visualData.algorithms.forEach((algo, index) => {
        const btn = document.createElement('button');
        btn.className = 'algo-btn';
        btn.textContent = algo.name;
        btn.onclick = () => selectAlgorithm(index);
        selector.appendChild(btn);
    });
}

function selectAlgorithm(index) {
    document.querySelectorAll('.algo-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
    currentAlgorithm = visualData.algorithms[index];
    currentStep = 0;
    stopPlaying();
    complexityBadge.textContent = currentAlgorithm.complexity;
    renderCode();
    renderStep();
    updateControls();
}

function renderCode() {
    const code = codeSnippets[currentAlgorithm.algorithm] || '';
    const lines = code.split('\n');
    let html = '';
    lines.forEach((line, idx) => {
        html += '<div class="code-line" data-line="' + idx + '">' + line + '</div>';
    });
    codeBlock.innerHTML = html;
}

function highlightCodeLines(stepNum) {
    const lineMap = codeLineMap[currentAlgorithm.algorithm] || {};
    const activeLines = lineMap[stepNum] || [];
    document.querySelectorAll('.code-line').forEach((el, idx) => {
        el.classList.remove('active', 'executed');
        if (activeLines.includes(idx)) el.classList.add('active');
    });
}

function renderHashTable(buckets, step) {
    let html = '<div class="hash-table">';
    buckets.forEach((bucket, idx) => {
        let bucketClass = 'bucket';
        if (step.bucket === idx) {
            bucketClass += step.collision ? ' collision' : ' active';
        }
        html += '<div class="' + bucketClass + '">';
        html += '<div class="bucket-index">[' + idx + ']</div>';
        if (Array.isArray(bucket)) {
            bucket.forEach((item, itemIdx) => {
                let itemClass = 'hash-item';
                if (step.action === 'insert' && step.bucket === idx && itemIdx === bucket.length - 1) {
                    itemClass += ' inserting';
                }
                if (step.action === 'check' && step.checking === item[0]) {
                    itemClass += step.match ? ' found' : ' checking';
                }
                if (step.action === 'found' && step.key === item[0]) {
                    itemClass += ' found';
                }
                html += '<div class="' + itemClass + '">' + item[0] + ':' + item[1] + '</div>';
            });
        }
        html += '</div>';
    });
    html += '</div>';
    return html;
}

function renderTwoSum(step) {
    const array = currentAlgorithm.input.array;
    let html = '<div class="array-display">';
    array.forEach((val, idx) => {
        let itemClass = 'array-item';
        if (step.index === idx) itemClass += ' current';
        if (step.action === 'solution' && step.indices.includes(idx)) itemClass += ' found';
        html += '<div class="' + itemClass + '"><span class="array-value">' + val + '</span><span class="array-index">[' + idx + ']</span></div>';
    });
    html += '</div>';
    
    html += '<div class="hash-table" style="margin-top:20px">';
    const hashmap = step.hashmap || {};
    for (let i = 0; i < 4; i++) {
        html += '<div class="bucket"><div class="bucket-index">[' + i + ']</div>';
        Object.entries(hashmap).forEach(([k, v]) => {
            if (parseInt(k) % 4 === i) {
                let itemClass = 'hash-item';
                if (step.action === 'store' && step.key == k) itemClass += ' inserting';
                if (step.action === 'lookup_hit' && step.key == k) itemClass += ' found';
                html += '<div class="' + itemClass + '">' + k + ':' + v + '</div>';
            }
        });
        html += '</div>';
    }
    html += '</div>';
    
    hashmapDisplay.innerHTML = JSON.stringify(step.hashmap || {}, null, 2);
    return html;
}

function renderSets(step) {
    let html = '<div style="display:flex;gap:30px;align-items:flex-start">';
    
    const setA = step.set_a || currentAlgorithm.steps[0].set_a;
    const setB = step.set_b || currentAlgorithm.steps[0].set_b;
    const result = step.result;
    
    html += '<div><div style="color:#00ffff;margin-bottom:8px;font-size:0.9rem">Set A</div><div class="hash-table" style="flex-direction:column">';
    setA.forEach(v => {
        let cls = 'hash-item';
        if (result && result.includes(v)) cls += ' found';
        html += '<div class="' + cls + '">' + v + '</div>';
    });
    html += '</div></div>';
    
    html += '<div><div style="color:#ff00ff;margin-bottom:8px;font-size:0.9rem">Set B</div><div class="hash-table" style="flex-direction:column">';
    setB.forEach(v => {
        let cls = 'hash-item';
        if (result && result.includes(v)) cls += ' found';
        html += '<div class="' + cls + '">' + v + '</div>';
    });
    html += '</div></div>';
    
    if (result) {
        html += '<div><div style="color:#00ff88;margin-bottom:8px;font-size:0.9rem">Result</div><div class="hash-table" style="flex-direction:column">';
        result.forEach(v => {
            html += '<div class="hash-item found">' + v + '</div>';
        });
        html += '</div></div>';
    }
    
    html += '</div>';
    return html;
}

function renderStep() {
    if (!currentAlgorithm) return;
    const step = currentAlgorithm.steps[currentStep];
    stepDescription.textContent = step.description;
    highlightCodeLines(step.step);
    resultDisplay.style.display = 'none';
    
    let html = '';
    if (currentAlgorithm.algorithm === 'two_sum_hashmap') {
        html = renderTwoSum(step);
        if (step.action === 'solution') {
            resultDisplay.style.display = 'block';
            resultDisplay.textContent = 'Found: [' + step.indices.join(', ') + ']';
        }
    } else if (currentAlgorithm.algorithm === 'set_operations') {
        html = renderSets(step);
        hashmapDisplay.textContent = step.result ? 'Result: {' + step.result.join(', ') + '}' : '-';
    } else {
        html = renderHashTable(step.buckets || [[],[],[],[],[],[],[],[]], step);
        if (step.action === 'found') {
            resultDisplay.style.display = 'block';
            resultDisplay.textContent = step.key + ' = ' + step.value;
        }
        hashmapDisplay.textContent = step.buckets ? JSON.stringify(step.buckets.filter(b => b.length > 0)) : '{}';
    }
    
    vizContainer.innerHTML = html;
    progressFill.style.width = ((currentStep + 1) / currentAlgorithm.steps.length * 100) + '%';
    stepCounter.textContent = 'Step ' + (currentStep + 1) + ' / ' + currentAlgorithm.steps.length;
}

function updateControls() {
    document.getElementById('prevBtn').disabled = !currentAlgorithm || currentStep === 0;
    document.getElementById('nextBtn').disabled = !currentAlgorithm || currentStep >= currentAlgorithm.steps.length - 1;
    document.getElementById('playBtn').disabled = !currentAlgorithm;
}

function nextStep() {
    if (currentAlgorithm && currentStep < currentAlgorithm.steps.length - 1) { currentStep++; renderStep(); updateControls(); }
    else stopPlaying();
}

function prevStep() {
    if (currentAlgorithm && currentStep > 0) { currentStep--; renderStep(); updateControls(); }
}

function togglePlay() { if (isPlaying) stopPlaying(); else startPlaying(); }

function startPlaying() {
    isPlaying = true;
    playBtn.textContent = 'Pause';
    playBtn.classList.add('playing');
    playInterval = setInterval(() => {
        if (currentStep < currentAlgorithm.steps.length - 1) nextStep();
        else stopPlaying();
    }, 2200 - document.getElementById('speedSlider').value);
}

function stopPlaying() {
    isPlaying = false;
    playBtn.textContent = 'Play';
    playBtn.classList.remove('playing');
    if (playInterval) { clearInterval(playInterval); playInterval = null; }
}

function reset() { stopPlaying(); currentStep = 0; renderStep(); updateControls(); }

function updateCamera() {
    stage.style.transform = 'translateZ(' + cameraZoom + 'px) rotateX(' + cameraRotX + 'deg) rotateY(' + cameraRotY + 'deg)';
}

scene.addEventListener('mousedown', (e) => { isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY; });
document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    cameraRotY += (e.clientX - lastMouseX) * 0.5;
    cameraRotX -= (e.clientY - lastMouseY) * 0.3;
    cameraRotX = Math.max(-60, Math.min(60, cameraRotX));
    lastMouseX = e.clientX; lastMouseY = e.clientY;
    updateCamera();
});
document.addEventListener('mouseup', () => { isDragging = false; });
scene.addEventListener('wheel', (e) => { e.preventDefault(); cameraZoom += e.deltaY * -0.5; cameraZoom = Math.max(-300, Math.min(200, cameraZoom)); updateCamera(); });

document.getElementById('playBtn').onclick = togglePlay;
document.getElementById('prevBtn').onclick = prevStep;
document.getElementById('nextBtn').onclick = nextStep;
document.getElementById('resetBtn').onclick = reset;
document.getElementById('speedSlider').oninput = () => { if (isPlaying) { stopPlaying(); startPlaying(); } };

initAlgorithmSelector();
updateCamera();
    </script>
</body>
</html>
