<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trees & BST - 3D Visualization</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header {
            text-align: center;
            padding: 25px 0;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(255, 0, 255, 0.1));
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            margin-bottom: 25px;
        }
        h1 {
            font-size: 2.2rem;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 3s linear infinite;
        }
        @keyframes gradient-shift {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        .subtitle { color: #888; font-size: 1rem; margin-top: 8px; }
        .algorithm-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 25px;
        }
        .algo-btn {
            padding: 10px 18px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #00ffff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        .algo-btn:hover { border-color: #00ffff; box-shadow: 0 0 20px rgba(0, 255, 255, 0.3); }
        .algo-btn.active {
            background: linear-gradient(135deg, #00ffff, #0088aa);
            color: #000;
            font-weight: bold;
        }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
        }
        @media (max-width: 1200px) { .main-content { grid-template-columns: 1fr; } }
        .left-panel { display: flex; flex-direction: column; gap: 20px; }
        .visualization-area {
            background: radial-gradient(ellipse at center, #0f0f1a 0%, #050508 70%, #000 100%);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            overflow: hidden;
            position: relative;
        }
        .scene {
            width: 100%;
            height: 400px;
            perspective: 1200px;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }
        .scene:active { cursor: grabbing; }
        .stage {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform-origin: 50% 50%;
            transition: transform 0.1s ease-out;
            position: relative;
        }
        .tree-container {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }
        .tree-node {
            position: absolute;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%);
            border: 3px solid rgba(0, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            transform-style: preserve-3d;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2), 0 8px 20px rgba(0, 0, 0, 0.5);
        }
        .tree-node.active {
            border-color: #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
            transform: scale(1.2);
        }
        .tree-node.visited {
            border-color: #00ff88;
            background: linear-gradient(135deg, #0a2a1a 0%, #0f1f0f 100%);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.5);
        }
        .tree-node.path {
            border-color: #ffd700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
        }
        .tree-node.inserting {
            border-color: #ff00ff;
            animation: pulse-insert 0.5s ease-out;
        }
        @keyframes pulse-insert {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); opacity: 1; }
        }
        .tree-node.deleting {
            border-color: #ff6b6b;
            animation: fade-delete 0.5s ease-out forwards;
        }
        @keyframes fade-delete {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
        .tree-edge {
            position: absolute;
            height: 3px;
            background: linear-gradient(90deg, rgba(0, 255, 255, 0.3), rgba(0, 255, 255, 0.6));
            transform-origin: left center;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        .tree-edge.active {
            background: linear-gradient(90deg, #00ffff, #00ffff);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            height: 4px;
        }
        .tree-edge.visited {
            background: linear-gradient(90deg, #00ff88, #00ff88);
        }
        .output-display {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #00ff88;
        }
        .code-panel {
            background: linear-gradient(135deg, #0d0d15, #1a1a25);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            padding: 15px;
            max-height: 280px;
            overflow-y: auto;
        }
        .code-title {
            font-size: 0.8rem;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .code-title::before { content: "</>"; color: #ff00ff; font-weight: bold; }
        .code-block {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.75rem;
            line-height: 1.5;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
        }
        .code-line {
            padding: 2px 8px;
            border-radius: 4px;
            transition: all 0.3s ease;
            white-space: pre;
        }
        .code-line.active {
            background: rgba(0, 255, 255, 0.2);
            border-left: 3px solid #00ffff;
        }
        .code-keyword { color: #ff79c6; }
        .code-function { color: #50fa7b; }
        .code-string { color: #f1fa8c; }
        .code-number { color: #bd93f9; }
        .code-comment { color: #6272a4; }
        .code-variable { color: #8be9fd; }
        .info-panel {
            background: linear-gradient(135deg, #0f0f1a, #1a1a2e);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            padding: 20px;
        }
        .panel-section { margin-bottom: 20px; }
        .panel-title {
            font-size: 0.8rem;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-title::before {
            content: "";
            width: 4px;
            height: 14px;
            background: linear-gradient(180deg, #00ffff, #ff00ff);
            border-radius: 2px;
        }
        .step-description {
            font-size: 1rem;
            line-height: 1.5;
            color: #e0e0e0;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border-left: 3px solid #00ffff;
        }
        .complexity-badge {
            display: inline-block;
            padding: 5px 12px;
            background: linear-gradient(135deg, rgba(255, 0, 255, 0.2), rgba(0, 255, 255, 0.2));
            border: 1px solid rgba(255, 0, 255, 0.4);
            border-radius: 15px;
            font-size: 0.85rem;
            color: #ff00ff;
            font-weight: bold;
        }
        .tree-info {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.85rem;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(0, 255, 255, 0.2);
        }
        .control-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid rgba(0, 255, 255, 0.4);
            color: #00ffff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        .control-btn:hover:not(:disabled) { background: linear-gradient(135deg, #00ffff, #0088aa); color: #000; }
        .control-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .control-btn.playing { background: linear-gradient(135deg, #ff00ff, #aa0088); border-color: #ff00ff; }
        .speed-control { display: flex; align-items: center; gap: 10px; margin-left: auto; }
        .speed-label { color: #888; font-size: 0.85rem; }
        .speed-slider {
            width: 100px;
            height: 5px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            border-radius: 3px;
        }
        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }
        .progress-bar { height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; overflow: hidden; margin-top: 12px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00ffff, #ff00ff); transition: width 0.3s ease; }
        .step-counter { text-align: center; color: #888; font-size: 0.85rem; margin-top: 8px; }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; }
        .legend-color { width: 14px; height: 14px; border-radius: 50%; border: 2px solid; }
        .result-display {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 12px 20px;
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 255, 136, 0.1));
            border: 2px solid #00ff88;
            border-radius: 10px;
            font-size: 1rem;
            color: #00ff88;
            font-weight: bold;
            display: none;
        }
        .camera-hint {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.75rem;
        }
    </style>

    "levelorder_traversal": `<span class="code-keyword">from</span> collections <span class="code-keyword">import</span> deque

<span class="code-keyword">def</span> <span class="code-function">levelorder</span>(root):

description":"In-order traversal visits: Left subtree, Root, Right subtree. This gives sorted order for BST!","action":"start","current":50,"output":[],"tree":[50,30,70,20,40,60,80]},{"step":2,"description":"Go left from 50 to 30. We must visit entire left subtree before root.","action":"descend","current":30,"output":[],"tree":[50,30,70,20,40,60,80]},{"step":3,"description":"Go left from 30 to 20. Continue going left until we can't.","action":"descend","current":20,"output":[],"tree":[50,30,70,20,40,60,80]},{"step":4,"description":"Visit 20 (no left child). First value in our sorted output!","action":"visit","current":20,"output":[20],"tree":[50,30,70,20,40,60,80]},{"step":5,"description":"Back to 30, visit it. Left subtree done, now visit root.","action":"visit","current":30,"output":[20,30],"tree":[50,30,70,20,40,60,80]},{"step":6,"description":"Visit 40 (right child of 30). Left subtree of 50 complete.","action":"visit","current":40,"output":[20,30,40],"tree":[50,30,70,20,40,60,80]},{"step":7,"description":"Visit root 50. Now process right subtree.","action":"visit","current":50,"output":[20,30,40,50],"tree":[50,30,70,20,40,60,80]},{"step":8,"description":"Go right to 70, then left to 60.","action":"descend","current":70,"output":[20,30,40,50],"tree":[50,30,70,20,40,60,80]},{"step":9,"description":"Visit 60 (left child of 70).","action":"visit","current":60,"output":[20,30,40,50,60],"tree":[50,30,70,20,40,60,80]},{"step":10,"description":"Visit 70.","action":"visit","current":70,"output":[20,30,40,50,60,70],"tree":[50,30,70,20,40,60,80]},{"step":11,"description":"Visit 80. Traversal complete! Notice output is sorted.","action":"visit","current":80,"output":[20,30,40,50,60,70,80],"tree":[50,30,70,20,40,60,80]}]},{"algorithm":"levelorder_traversal","name":"Level-Order (BFS)","complexity":"O(n)","tree":[50,30,70,20,40,60,80],"steps":[{"step":1,"description":"Level-order uses a queue. Visit nodes level by level, left to right.","action":"start","queue":[50],"output":[],"tree":[50,30,70,20,40,60,80]},{"step":2,"description":"Dequeue 50, visit it, enqueue children (30, 70). Level 0 done.","action":"visit","current":50,"queue":[30,70],"output":[50],"level":0,"tree":[50,30,70,20,40,60,80]},{"step":3,"description":"Dequeue 30, visit it, enqueue children (20, 40).","action":"visit","current":30,"queue":[70,20,40],"output":[50,30],"level":1,"tree":[50,30,70,20,40,60,80]},{"step":4,"description":"Dequeue 70, visit it, enqueue children (60, 80). Level 1 done.","action":"visit","current":70,"queue":[20,40,60,80],"output":[50,30,70],"level":1,"tree":[50,30,70,20,40,60,80]},{"step":5,"description":"Visit remaining nodes: 20, 40, 60, 80. Level 2 (leaves).","action":"visit_level","nodes":[20,40,60,80],"queue":[],"output":[50,30,70,20,40,60,80],"level":2,"tree":[50,30,70,20,40,60,80]},{"step":6,"description":"Queue empty, traversal complete! Visited level by level.","action":"complete","output":[50,30,70,20,40,60,80],"tree":[50,30,70,20,40,60,80]}]}]};

let currentAlgorithm = null;
let currentStep = 0;
let isPlaying = false;
let playInterval = null;
let cameraRotX = 15;
let cameraRotY = 0;
let cameraZoom = 0;
let isDragging = false;
let lastMouseX = 0;
let lastMouseY = 0;

const scene = document.getElementById('scene');
const stage = document.getElementById('stage');
const treeContainer = document.getElementById('treeContainer');
const codeBlock = document.getElementById('codeBlock');
const stepDescription = document.getElementById('stepDescription');
const complexityBadge = document.getElementById('complexityBadge');
const treeInfo = document.getElementById('treeInfo');
const outputDisplay = document.getElementById('outputDisplay');
const progressFill = document.getElementById('progressFill');
const stepCounter = document.getElementById('stepCounter');
const playBtn = document.getElementById('playBtn');
const resultDisplay = document.getElementById('resultDisplay');

function initAlgorithmSelector() {
    const selector = document.getElementById('algoSelector');
    visualData.algorithms.forEach((algo, index) => {
        const btn = document.createElement('button');
        btn.className = 'algo-btn';
        btn.textContent = algo.name;
        btn.onclick = () => selectAlgorithm(index);
        selector.appendChild(btn);
    });
}

function selectAlgorithm(index) {
    document.querySelectorAll('.algo-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
    currentAlgorithm = visualData.algorithms[index];
    currentStep = 0;
    stopPlaying();
    complexityBadge.textContent = currentAlgorithm.complexity;
    renderCode();
    renderStep();
    updateControls();
}

function renderCode() {
    const code = codeSnippets[currentAlgorithm.algorithm] || '';
    const lines = code.split('\n');
    let html = '';
    lines.forEach((line, idx) => {
        html += '<div class="code-line" data-line="' + idx + '">' + line + '</div>';
    });
    codeBlock.innerHTML = html;
}

function highlightCodeLines(stepNum) {
    const lineMap = codeLineMap[currentAlgorithm.algorithm] || {};
    const activeLines = lineMap[stepNum] || [];
    document.querySelectorAll('.code-line').forEach((el, idx) => {
        el.classList.remove('active');
        if (activeLines.includes(idx)) el.classList.add('active');
    });
}

function getNodePositions(tree) {
    const positions = {};
    const width = 500;
    const height = 350;
    const levelHeight = 80;
    
    function calcPos(index, level, left, right) {
        if (index >= tree.length || tree[index] === null || tree[index] === undefined) return;
        const x = (left + right) / 2;
        const y = 50 + level * levelHeight;
        positions[tree[index]] = { x, y, index };
        calcPos(2 * index + 1, level + 1, left, x);
        calcPos(2 * index + 2, level + 1, x, right);
    }
    calcPos(0, 0, 50, width - 50);
    return positions;
}

function renderTree(step) {
    const tree = step.tree || currentAlgorithm.tree;
    const positions = getNodePositions(tree);
    const current = step.current;
    const path = step.path || [];
    const output = step.output || [];
    const visitedNodes = step.action === 'visit' || step.action === 'visit_level' ? output : [];
    
    let html = '';
    
    // Draw edges first
    tree.forEach((val, idx) => {
        if (val === null || val === undefined) return;
        const pos = positions[val];
        if (!pos) return;
        
        const leftIdx = 2 * idx + 1;
        const rightIdx = 2 * idx + 2;
        
        if (leftIdx < tree.length && tree[leftIdx] !== null && tree[leftIdx] !== undefined) {
            const childPos = positions[tree[leftIdx]];
            if (childPos) {
                const dx = childPos.x - pos.x;
                const dy = childPos.y - pos.y;
                const length = Math.sqrt(dx * dx + dy * dy);
                const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                let edgeClass = 'tree-edge';
                if (path.includes(val) && path.includes(tree[leftIdx])) edgeClass += ' active';
                if (visitedNodes.includes(val) && visitedNodes.includes(tree[leftIdx])) edgeClass += ' visited';
                html += '<div class="' + edgeClass + '" style="left:' + (pos.x + 25) + 'px;top:' + (pos.y + 25) + 'px;width:' + length + 'px;transform:rotate(' + angle + 'deg)"></div>';
            }
        }
        
        if (rightIdx < tree.length && tree[rightIdx] !== null && tree[rightIdx] !== undefined) {
            const childPos = positions[tree[rightIdx]];
            if (childPos) {
                const dx = childPos.x - pos.x;
                const dy = childPos.y - pos.y;
                const length = Math.sqrt(dx * dx + dy * dy);
                const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                let edgeClass = 'tree-edge';
                if (path.includes(val) && path.includes(tree[rightIdx])) edgeClass += ' active';
                if (visitedNodes.includes(val) && visitedNodes.includes(tree[rightIdx])) edgeClass += ' visited';
                html += '<div class="' + edgeClass + '" style="left:' + (pos.x + 25) + 'px;top:' + (pos.y + 25) + 'px;width:' + length + 'px;transform:rotate(' + angle + 'deg)"></div>';
            }
        }
    });
    
    // Draw nodes
    tree.forEach((val, idx) => {
        if (val === null || val === undefined) return;
        const pos = positions[val];
        if (!pos) return;
        
        let nodeClass = 'tree-node';
        if (val === current) nodeClass += ' active';
        if (path.includes(val) && val !== current) nodeClass += ' path';
        if (visitedNodes.includes(val)) nodeClass += ' visited';
        if (step.action === 'insert' && step.value === val) nodeClass += ' inserting';
        if (step.action === 'found' && val === current) nodeClass += ' visited';
        if (step.nodes && step.nodes.includes(val)) nodeClass += ' visited';
        
        html += '<div class="' + nodeClass + '" style="left:' + pos.x + 'px;top:' + pos.y + 'px">' + val + '</div>';
    });
    
    treeContainer.innerHTML = html;
    
    // Update output display
    if (step.output && step.output.length > 0) {
        outputDisplay.style.display = 'block';
        outputDisplay.textContent = 'Output: [' + step.output.join(', ') + ']';
    } else {
        outputDisplay.style.display = 'none';
    }
    
    // Update tree info
    treeInfo.textContent = step.queue ? 'Queue: [' + step.queue.join(', ') + ']' : 'Tree: [' + tree.filter(v => v !== null).join(', ') + ']';
    
    // Result display
    if (step.action === 'found' || step.action === 'complete') {
        resultDisplay.style.display = 'block';
        resultDisplay.textContent = step.action === 'found' ? 'Found: ' + current : 'Complete!';
    } else {
        resultDisplay.style.display = 'none';
    }
}

function renderStep() {
    if (!currentAlgorithm) return;
    const step = currentAlgorithm.steps[currentStep];
    stepDescription.textContent = step.description;
    highlightCodeLines(step.step);
    renderTree(step);
    progressFill.style.width = ((currentStep + 1) / currentAlgorithm.steps.length * 100) + '%';
    stepCounter.textContent = 'Step ' + (currentStep + 1) + ' / ' + currentAlgorithm.steps.length;
}

function updateControls() {
    document.getElementById('prevBtn').disabled = !currentAlgorithm || currentStep === 0;
    document.getElementById('nextBtn').disabled = !currentAlgorithm || currentStep >= currentAlgorithm.steps.length - 1;
    document.getElementById('playBtn').disabled = !currentAlgorithm;
}

function nextStep() {
    if (currentAlgorithm && currentStep < currentAlgorithm.steps.length - 1) { currentStep++; renderStep(); updateControls(); }
    else stopPlaying();
}

function prevStep() {
    if (currentAlgorithm && currentStep > 0) { currentStep--; renderStep(); updateControls(); }
}

function togglePlay() { if (isPlaying) stopPlaying(); else startPlaying(); }

function startPlaying() {
    isPlaying = true;
    playBtn.textContent = 'Pause';
    playBtn.classList.add('playing');
    playInterval = setInterval(() => {
        if (currentStep < currentAlgorithm.steps.length - 1) nextStep();
        else stopPlaying();
    }, 2200 - document.getElementById('speedSlider').value);
}

function stopPlaying() {
    isPlaying = false;
    playBtn.textContent = 'Play';
    playBtn.classList.remove('playing');
    if (playInterval) { clearInterval(playInterval); playInterval = null; }
}

function reset() { stopPlaying(); currentStep = 0; renderStep(); updateControls(); }

function updateCamera() {
    stage.style.transform = 'translateZ(' + cameraZoom + 'px) rotateX(' + cameraRotX + 'deg) rotateY(' + cameraRotY + 'deg)';
}

scene.addEventListener('mousedown', (e) => { isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY; });
document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    cameraRotY += (e.clientX - lastMouseX) * 0.5;
    cameraRotX -= (e.clientY - lastMouseY) * 0.3;
    cameraRotX = Math.max(-60, Math.min(60, cameraRotX));
    lastMouseX = e.clientX; lastMouseY = e.clientY;
    updateCamera();
});
document.addEventListener('mouseup', () => { isDragging = false; });
scene.addEventListener('wheel', (e) => { e.preventDefault(); cameraZoom += e.deltaY * -0.5; cameraZoom = Math.max(-300, Math.min(200, cameraZoom)); updateCamera(); });

document.getElementById('playBtn').onclick = togglePlay;
document.getElementById('prevBtn').onclick = prevStep;
document.getElementById('nextBtn').onclick = nextStep;
document.getElementById('resetBtn').onclick = reset;
document.getElementById('speedSlider').oninput = () => { if (isPlaying) { stopPlaying(); startPlaying(); } };

initAlgorithmSelector();
updateCamera();
    </script>
</body>
</html>
