<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphs & Traversals - 3D Visualization</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header {
            text-align: center;
            padding: 25px 0;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(255, 0, 255, 0.1));
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            margin-bottom: 25px;
        }
        h1 {
            font-size: 2.2rem;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-shift 3s linear infinite;
        }
        @keyframes gradient-shift {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        .subtitle { color: #888; font-size: 1rem; margin-top: 8px; }
        .algorithm-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 25px;
        }
        .algo-btn {
            padding: 10px 18px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #00ffff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        .algo-btn:hover { border-color: #00ffff; box-shadow: 0 0 20px rgba(0, 255, 255, 0.3); }
        .algo-btn.active {
            background: linear-gradient(135deg, #00ffff, #0088aa);
            color: #000;
            font-weight: bold;
        }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
        }
        @media (max-width: 1200px) { .main-content { grid-template-columns: 1fr; } }
        .left-panel { display: flex; flex-direction: column; gap: 20px; }
        .visualization-area {
            background: radial-gradient(ellipse at center, #0f0f1a 0%, #050508 70%, #000 100%);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            overflow: hidden;
            position: relative;
        }
        .scene {
            width: 100%;
            height: 420px;
            perspective: 1200px;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }
        .scene:active { cursor: grabbing; }
        .stage {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform-origin: 50% 50%;
            transition: transform 0.1s ease-out;
            position: relative;
        }
        .graph-container {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }
        .graph-node {
            position: absolute;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%);
            border: 3px solid rgba(0, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2), 0 8px 20px rgba(0, 0, 0, 0.5);
            transform: translate(-50%, -50%);
        }
        .graph-node.current {
            border-color: #00ffff;
            box-shadow: 0 0 35px rgba(0, 255, 255, 0.7);
            transform: translate(-50%, -50%) scale(1.2);
        }
        .graph-node.visited {
            border-color: #00ff88;
            background: linear-gradient(135deg, #0a2a1a 0%, #0f1f0f 100%);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }
        .graph-node.discovered {
            border-color: #ffd700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
        }
        .graph-node.in-queue {
            border-color: #ff00ff;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
        }
        .graph-node.path {
            border-color: #ffd700;
            background: linear-gradient(135deg, #2a2a1a 0%, #1f1f0f 100%);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
        }
        .graph-node.cycle {
            border-color: #ff6b6b;
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.6);
        }
        .graph-node.source {
            border-color: #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.6);
        }
        .graph-node.target {
            border-color: #ff6b6b;
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.6);
        }
        .graph-edge {
            position: absolute;
            height: 2px;
            background: rgba(0, 255, 255, 0.3);
            transform-origin: left center;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        .graph-edge.active {
            background: #00ffff;
            height: 3px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        .graph-edge.visited {
            background: #00ff88;
        }
        .graph-edge.path {
            background: #ffd700;
            height: 4px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }
        .graph-edge.cycle {
            background: #ff6b6b;
            height: 4px;
        }
        .graph-edge.directed::after {
            content: "";
            position: absolute;
            right: -5px;
            top: -4px;
            border: 5px solid transparent;
            border-left: 8px solid currentColor;
        }
        .code-panel {
            background: linear-gradient(135deg, #0d0d15, #1a1a25);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            padding: 15px;
            max-height: 260px;
            overflow-y: auto;
        }
        .code-title {
            font-size: 0.8rem;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .code-title::before { content: "</>"; color: #ff00ff; font-weight: bold; }
        .code-block {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.75rem;
            line-height: 1.5;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
        }
        .code-line {
            padding: 2px 8px;
            border-radius: 4px;
            transition: all 0.3s ease;
            white-space: pre;
        }
        .code-line.active {
            background: rgba(0, 255, 255, 0.2);
            border-left: 3px solid #00ffff;
        }
        .code-keyword { color: #ff79c6; }
        .code-function { color: #50fa7b; }
        .code-number { color: #bd93f9; }
        .code-comment { color: #6272a4; }
        .code-variable { color: #8be9fd; }
        .info-panel {
            background: linear-gradient(135deg, #0f0f1a, #1a1a2e);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            padding: 20px;
        }
        .panel-section { margin-bottom: 20px; }
        .panel-title {
            font-size: 0.8rem;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-title::before {
            content: "";
            width: 4px;
            height: 14px;
            background: linear-gradient(180deg, #00ffff, #ff00ff);
            border-radius: 2px;
        }
        .step-description {
            font-size: 1rem;
            line-height: 1.5;
            color: #e0e0e0;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border-left: 3px solid #00ffff;
        }
        .complexity-badge {
            display: inline-block;
            padding: 5px 12px;
            background: linear-gradient(135deg, rgba(255, 0, 255, 0.2), rgba(0, 255, 255, 0.2));
            border: 1px solid rgba(255, 0, 255, 0.4);
            border-radius: 15px;
            font-size: 0.85rem;
            color: #ff00ff;
            font-weight: bold;
        }
        .state-info {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.85rem;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(0, 255, 255, 0.2);
        }
        .control-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid rgba(0, 255, 255, 0.4);
            color: #00ffff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        .control-btn:hover:not(:disabled) { background: linear-gradient(135deg, #00ffff, #0088aa); color: #000; }
        .control-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .control-btn.playing { background: linear-gradient(135deg, #ff00ff, #aa0088); border-color: #ff00ff; }
        .speed-control { display: flex; align-items: center; gap: 10px; margin-left: auto; }
        .speed-label { color: #888; font-size: 0.85rem; }
        .speed-slider {
            width: 100px;
            height: 5px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            border-radius: 3px;
        }
        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }
        .progress-bar { height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; overflow: hidden; margin-top: 12px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00ffff, #ff00ff); transition: width 0.3s ease; }
        .step-counter { text-align: center; color: #888; font-size: 0.85rem; margin-top: 8px; }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; }
        .legend-color { width: 14px; height: 14px; border-radius: 50%; border: 2px solid; }
        .result-display {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 12px 20px;
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 255, 136, 0.1));
            border: 2px solid #00ff88;
            border-radius: 10px;
            font-size: 1rem;
            color: #00ff88;
            font-weight: bold;
            display: none;
        }
        .camera-hint {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Graphs & Traversals</h1>
        <p class="subtitle">Interactive 3D Visualization with Code - Drag to rotate, scroll to zoom</p>
    </header>
    <div class="container">
        <div class="algorithm-selector" id="algoSelector"></div>
        <div class="main-content">
            <div class="left-panel">
                <div class="visualization-area">
                    <div class="scene" id="scene">
                        <div class="stage" id="stage">
                            <div class="graph-container" id="graphContainer"></div>

                        <div class="legend-item"><div class="legend-color" style="border-color:#ffd700;background:rgba(255,215,0,0.2)"></div><span>Discovered</span></div>
                        <div class="legend-item"><div class="legend-color" style="border-color:#ff00ff;background:rgba(255,0,255,0.2)"></div><span>In Queue</span></div>

    <script>
const codeSnippets = {
    "bfs": `<span class="code-keyword">from</span> collections <span class="code-keyword">import</span> deque

<span class="code-keyword">def</span> <span class="code-function">bfs</span>(graph, start):
    visited = {start}
    queue = deque([start])
    result = []
    
    <span class="code-keyword">while</span> queue:
        node = queue.popleft()
        result.append(node)
        
        <span class="code-keyword">for</span> neighbor <span class="code-keyword">in</span> graph[node]:
            <span class="code-keyword">if</span> neighbor <span class="code-keyword">not in</span> visited:
                visited.add(neighbor)
                queue.append(neighbor)
    
    <span class="code-keyword">return</span> result`,
    "dfs": `<span class="code-keyword">def</span> <span class="code-function">dfs</span>(graph, start):
    visited = set()
    result = []
    
    <span class="code-keyword">def</span> <span class="code-function">explore</span>(node):
        visited.add(node)
        result.append(node)
        
        <span class="code-keyword">for</span> neighbor <span class="code-keyword">in</span> graph[node]:
            <span class="code-keyword">if</span> neighbor <span class="code-keyword">not in</span> visited:
                explore(neighbor)
    
    explore(start)
    <span class="code-keyword">return</span> result`,
    "shortest_path_bfs": `<span class="code-keyword">def</span> <span class="code-function">shortest_path</span>(graph, start, end):
    queue = deque([(start, [start])])
    visited = {start}
    
    <span class="code-keyword">while</span> queue:
        node, path = queue.popleft()
        
        <span class="code-keyword">if</span> node == end:
            <span class="code-keyword">return</span> path  <span class="code-comment"># Found!</span>
        
        <span class="code-keyword">for</span> neighbor <span class="code-keyword">in</span> graph[node]:
            <span class="code-keyword">if</span> neighbor <span class="code-keyword">not in</span> visited:
                visited.add(neighbor)
                queue.append((neighbor, path + [neighbor]))
    
    <span class="code-keyword">return</span> []  <span class="code-comment"># No path</span>`,
    "connected_components": `<span class="code-keyword">def</span> <span class="code-function">find_components</span>(graph):
    visited = set()
    components = []
    
    <span class="code-keyword">for</span> node <span class="code-keyword">in</span> graph:
        <span class="code-keyword">if</span> node <span class="code-keyword">not in</span> visited:
            component = []
            bfs(graph, node, visited, component)
            components.append(component)
    
    <span class="code-keyword">return</span> components`,
    "cycle_detection": `<span class="code-keyword">def</span> <span class="code-function">has_cycle</span>(graph):
    WHITE, GRAY, BLACK = <span class="code-number">0</span>, <span class="code-number">1</span>, <span class="code-number">2</span>
    color = {n: WHITE <span class="code-keyword">for</span> n <span class="code-keyword">in</span> graph}
    
    <span class="code-keyword">def</span> <span class="code-function">dfs</span>(node):
        color[node] = GRAY  <span class="code-comment"># In progress</span>
        <span class="code-keyword">for</span> neighbor <span class="code-keyword">in</span> graph[node]:
            <span class="code-keyword">if</span> color[neighbor] == GRAY:
                <span class="code-keyword">return</span> <span class="code-keyword">True</span>  <span class="code-comment"># Cycle!</span>
            <span class="code-keyword">if</span> color[neighbor] == WHITE:
                <span class="code-keyword">if</span> dfs(neighbor):
                    <span class="code-keyword">return</span> <span class="code-keyword">True</span>
        color[node] = BLACK  <span class="code-comment"># Done</span>
        <span class="code-keyword">return</span> <span class="code-keyword">False</span>`,
    "topological_sort": `<span class="code-keyword">from</span> collections <span class="code-keyword">import</span> deque

<span class="code-keyword">def</span> <span class="code-function">topological_sort</span>(graph):
    in_degree = {n: <span class="code-number">0</span> <span class="code-keyword">for</span> n <span class="code-keyword">in</span> graph}
    <span class="code-keyword">for</span> node <span class="code-keyword">in</span> graph:
        <span class="code-keyword">for</span> neighbor <span class="code-keyword">in</span> graph[node]:
            in_degree[neighbor] += <span class="code-number">1</span>
    
    queue = deque([n <span class="code-keyword">for</span> n <span class="code-keyword">in</span> graph <span class="code-keyword">if</span> in_degree[n] == <span class="code-number">0</span>])
    result = []
    
    <span class="code-keyword">while</span> queue:
        node = queue.popleft()
        result.append(node)
        <span class="code-keyword">for</span> neighbor <span class="code-keyword">in</span> graph[node]:
            in_degree[neighbor] -= <span class="code-number">1</span>
            <span class="code-keyword">if</span> in_degree[neighbor] == <span class="code-number">0</span>:
                queue.append(neighbor)
    
    <span class="code-keyword">return</span> result`
};

let currentAlgorithm = null;
let currentStep = 0;
let isPlaying = false;
let playInterval = null;
let cameraRotX = 15;
let cameraRotY = 0;
let cameraZoom = 0;
let isDragging = false;
let lastMouseX = 0;
let lastMouseY = 0;

const scene = document.getElementById('scene');
const stage = document.getElementById('stage');
const graphContainer = document.getElementById('graphContainer');
const codeBlock = document.getElementById('codeBlock');
const stepDescription = document.getElementById('stepDescription');
const complexityBadge = document.getElementById('complexityBadge');
const stateInfo = document.getElementById('stateInfo');
const progressFill = document.getElementById('progressFill');
const stepCounter = document.getElementById('stepCounter');
const playBtn = document.getElementById('playBtn');
const resultDisplay = document.getElementById('resultDisplay');

function initAlgorithmSelector() {
    const selector = document.getElementById('algoSelector');
    visualData.algorithms.forEach((algo, index) => {
        const btn = document.createElement('button');
        btn.className = 'algo-btn';
        btn.textContent = algo.name;
        btn.onclick = () => selectAlgorithm(index);
        selector.appendChild(btn);
    });
}

function selectAlgorithm(index) {
    document.querySelectorAll('.algo-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
    currentAlgorithm = visualData.algorithms[index];
    currentStep = 0;
    stopPlaying();
    complexityBadge.textContent = currentAlgorithm.complexity;
    renderCode();
    renderStep();
    updateControls();
}

function renderCode() {
    const code = codeSnippets[currentAlgorithm.algorithm] || '';
    const lines = code.split('\n');
    let html = '';
    lines.forEach((line, idx) => {
        html += '<div class="code-line" data-line="' + idx + '">' + line + '</div>';
    });
    codeBlock.innerHTML = html;
}

function highlightCodeLines(stepNum) {
    const lineMap = codeLineMap[currentAlgorithm.algorithm] || {};
    const activeLines = lineMap[stepNum] || [];
    document.querySelectorAll('.code-line').forEach((el, idx) => {
        el.classList.remove('active');
        if (activeLines.includes(idx)) el.classList.add('active');
    });
}

function renderGraph(step) {
    const graph = currentAlgorithm.graph;
    const positions = nodePositions[currentAlgorithm.algorithm];
    const visited = step.visited || [];
    const current = step.current;
    const discovered = step.discovered || [];
    const queue = step.queue || [];
    const path = step.path || [];
    const cycle = step.cycle || [];
    const source = step.source;
    const target = step.target;
    const isDirected = graph.directed;
    
    let html = '';
    
    // Draw edges
    graph.edges.forEach(([from, to]) => {
        const fromPos = positions[from];
        const toPos = positions[to];
        if (!fromPos || !toPos) return;
        
        const dx = toPos[0] - fromPos[0];
        const dy = toPos[1] - fromPos[1];
        const length = Math.sqrt(dx * dx + dy * dy) - 50;
        const angle = Math.atan2(dy, dx) * 180 / Math.PI;
        
        let edgeClass = 'graph-edge';
        if (isDirected) edgeClass += ' directed';
        if (visited.includes(from) && visited.includes(to)) edgeClass += ' visited';
        if (path.includes(from) && path.includes(to)) edgeClass += ' path';
        if (step.back_edge && step.back_edge[0] == from && step.back_edge[1] == to) edgeClass += ' cycle';
        if (cycle.includes(from) && cycle.includes(to)) edgeClass += ' cycle';
        
        const startX = fromPos[0] + 25 * Math.cos(angle * Math.PI / 180);
        const startY = fromPos[1] + 25 * Math.sin(angle * Math.PI / 180);
        
        html += '<div class="' + edgeClass + '" style="left:' + startX + 'px;top:' + startY + 'px;width:' + length + 'px;transform:rotate(' + angle + 'deg)"></div>';
    });
    
    // Draw nodes
    graph.nodes.forEach(node => {
        const pos = positions[node];
        if (!pos) return;
        
        let nodeClass = 'graph-node';
        if (node === current) nodeClass += ' current';
        else if (visited.includes(node)) nodeClass += ' visited';
        if (discovered.includes(node)) nodeClass += ' discovered';
        if (queue.includes(node) && node !== current) nodeClass += ' in-queue';
        if (path.includes(node)) nodeClass += ' path';
        if (cycle.includes(node)) nodeClass += ' cycle';
        if (node === source) nodeClass += ' source';
        if (node === target) nodeClass += ' target';
        
        html += '<div class="' + nodeClass + '" style="left:' + pos[0] + 'px;top:' + pos[1] + 'px">' + node + '</div>';
    });
    
    graphContainer.innerHTML = html;
}

function renderStep() {
    if (!currentAlgorithm) return;
    const step = currentAlgorithm.steps[currentStep];
    stepDescription.textContent = step.description;
    highlightCodeLines(step.step);
    resultDisplay.style.display = 'none';
    
    renderGraph(step);
    
    // Update state info
    let stateText = '';
    if (step.queue) stateText += 'Queue: [' + step.queue.join(', ') + ']\n';
    if (step.stack) stateText += 'Stack: [' + step.stack.join(', ') + ']\n';
    if (step.visited) stateText += 'Visited: [' + step.visited.join(', ') + ']';
    if (step.result) stateText += 'Result: [' + step.result.join(', ') + ']';
    if (step.in_degrees) stateText += 'In-degrees: ' + JSON.stringify(step.in_degrees);
    stateInfo.textContent = stateText || '-';
    
    if (step.action === 'complete') {
        resultDisplay.style.display = 'block';
        if (step.order) resultDisplay.textContent = 'Order: ' + step.order.join(' -> ');
        else if (step.path) resultDisplay.textContent = 'Path: ' + step.path.join(' -> ');
        else if (step.cycle) resultDisplay.textContent = 'Cycle: ' + step.cycle.join(' -> ');
        else resultDisplay.textContent = 'Complete!';
    }
    
    progressFill.style.width = ((currentStep + 1) / currentAlgorithm.steps.length * 100) + '%';
    stepCounter.textContent = 'Step ' + (currentStep + 1) + ' / ' + currentAlgorithm.steps.length;
}

function updateControls() {
    document.getElementById('prevBtn').disabled = !currentAlgorithm || currentStep === 0;
    document.getElementById('nextBtn').disabled = !currentAlgorithm || currentStep >= currentAlgorithm.steps.length - 1;
    document.getElementById('playBtn').disabled = !currentAlgorithm;
}

function nextStep() {
    if (currentAlgorithm && currentStep < currentAlgorithm.steps.length - 1) { currentStep++; renderStep(); updateControls(); }
    else stopPlaying();
}

function prevStep() {
    if (currentAlgorithm && currentStep > 0) { currentStep--; renderStep(); updateControls(); }
}

function togglePlay() { if (isPlaying) stopPlaying(); else startPlaying(); }

function startPlaying() {
    isPlaying = true;
    playBtn.textContent = 'Pause';
    playBtn.classList.add('playing');
    playInterval = setInterval(() => {
        if (currentStep < currentAlgorithm.steps.length - 1) nextStep();
        else stopPlaying();
    }, 2200 - document.getElementById('speedSlider').value);
}

function stopPlaying() {
    isPlaying = false;
    playBtn.textContent = 'Play';
    playBtn.classList.remove('playing');
    if (playInterval) { clearInterval(playInterval); playInterval = null; }
}

function reset() { stopPlaying(); currentStep = 0; renderStep(); updateControls(); }

function updateCamera() {
    stage.style.transform = 'translateZ(' + cameraZoom + 'px) rotateX(' + cameraRotX + 'deg) rotateY(' + cameraRotY + 'deg)';
}

scene.addEventListener('mousedown', (e) => { isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY; });
document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    cameraRotY += (e.clientX - lastMouseX) * 0.5;
    cameraRotX -= (e.clientY - lastMouseY) * 0.3;
    cameraRotX = Math.max(-60, Math.min(60, cameraRotX));
    lastMouseX = e.clientX; lastMouseY = e.clientY;
    updateCamera();
});
document.addEventListener('mouseup', () => { isDragging = false; });
scene.addEventListener('wheel', (e) => { e.preventDefault(); cameraZoom += e.deltaY * -0.5; cameraZoom = Math.max(-300, Math.min(200, cameraZoom)); updateCamera(); });

document.getElementById('playBtn').onclick = togglePlay;
document.getElementById('prevBtn').onclick = prevStep;
document.getElementById('nextBtn').onclick = nextStep;
document.getElementById('resetBtn').onclick = reset;
document.getElementById('speedSlider').oninput = () => { if (isPlaying) { stopPlaying(); startPlaying(); } };

initAlgorithmSelector();
updateCamera();
    </script>
</body>
